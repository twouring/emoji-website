function bindAds(){
  const host = document.getElementById('ads-body');
  if (!host) return;
  const on = (id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };
  on('ads-new','click',()=>{ ADS_EDIT = adsBlankCamp(); paintAds(); });
  host.querySelectorAll('[data-ads-new-for]').forEach(b=>b.onclick=()=>{ ADS_EDIT = adsBlankCamp(b.dataset.adsNewFor); paintAds(); });
  host.querySelectorAll('[data-ads-edit]').forEach(b=>b.onclick=()=>{
    const c = (ADS_CAMPS||[]).find(x=>x.id===b.dataset.adsEdit); if(!c) return;
    ADS_EDIT = JSON.parse(JSON.stringify(c)); ADS_EDIT.metrics = ADS_EDIT.metrics||{}; paintAds();
  });
  host.querySelectorAll('[data-ads-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定刪除此投放紀錄？')) return;
    try { await api('/admin/ads/campaigns/'+b.dataset.adsDel,{method:'DELETE'});
      ADS_CAMPS = ADS_CAMPS.filter(x=>x.id!==b.dataset.adsDel);
      if (ADS_EDIT && ADS_EDIT.id===b.dataset.adsDel) ADS_EDIT=null;
      toast('已刪除'); paintAds();
    } catch(e){ toast(e.message); }
  });
  on('ac-cancel','click',()=>{ ADS_EDIT=null; paintAds(); });
  on('ac-save','click',async()=>{
    const v = id => document.getElementById(id).value;
    const metrics = {};
    if (Number(v('ac-reach'))) metrics.reach = Number(v('ac-reach'));
    if (Number(v('ac-clicks'))) metrics.clicks = Number(v('ac-clicks'));
    try {
      await api('/admin/ads/campaigns',{method:'POST',body:{
        id: ADS_EDIT.id || undefined, post_id: v('ac-post'), layer: v('ac-layer'), status: v('ac-status'),
        start_date: v('ac-start'), end_date: v('ac-end'),
        budget: Number(v('ac-budget'))||0, spent: Number(v('ac-spent'))||0, metrics, notes: v('ac-notes') }});
      ADS_EDIT = null; ADS_CAMPS = null;   // 重新載入取回正規化後資料
      toast('已儲存投放紀錄'); paintAds();
    } catch(e){ toast(e.message); }
  });
  // 建議表中的貼文連結 → 跳社群經營編輯（路徑路由處理）
  host.querySelectorAll('[data-sp-edit]').forEach(b=>b.onclick=(ev)=>{
    ev.preventDefault(); go('social/edit/' + b.dataset.spEdit);
  });
}

// page 兼容：seed 巢狀 {layout,fields} → renderSpec 攤平格式
function spNormPage(pg){
  if (!pg || pg.category) return pg;
  const lid = String(pg.layout||'03a');
  return Object.assign({category:lid.slice(0,2), variant:lid.slice(2)||'a', format:pg.format||'portrait'}, pg.fields||{});
}

/* 行事曆縮圖：每格 IG 貼文以首頁版型即時渲染（縮放後約 100px 寬） */
function renderCalendarPreviews(){
  if (!window.IGStudio || !window.IGStudio.renderSpec) return;
  document.querySelectorAll('[data-cal-prev]').forEach(box=>{
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===box.dataset.calPrev);
    const pg = p && (p.pages||[])[0];
    if (!pg) return;
    try {
      const node = window.IGStudio.renderSpec(spNormPage(pg));
      const w = box.clientWidth || 110;
      node.style.transformOrigin = 'top left';
      node.style.transform = `scale(${w/1080})`;
      box.innerHTML = '';
      box.appendChild(node);
    } catch(_) { box.textContent = ''; }
  });
}

function renderSocialPreviews(){
  if (!window.IGStudio || !window.IGStudio.renderSpec) return;
  document.querySelectorAll('[data-sp-prev]').forEach(box=>{
    const i = Number(box.dataset.spPrev);
    const pg = (SOCIAL_EDIT.pages||[])[i];
    if (!pg) return;
    try {
      const node = window.IGStudio.renderSpec(spNormPage(pg));
      const w = 150, scale = w/1080;
      box.innerHTML = '';
      box.style.width = w+'px';
      box.style.height = Math.round((pg.format==='square'?1080:1350)*scale)+'px';
      node.style.transformOrigin='top left';
      node.style.transform=`scale(${scale})`;
      box.appendChild(node);
    } catch(e){ box.textContent = '預覽失敗'; }
  });
}

function bindSocial(){

  host.querySelectorAll('[data-social-view]').forEach(b=>b.onclick=()=>{
    if (SOCIAL_VIEW==='edit' && SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;

  });
  on('sp-f-platform','change',e=>{ SOCIAL_FILTER.platform=e.target.value; paintSocial(); });
  on('sp-f-status','change',e=>{ SOCIAL_FILTER.status=e.target.value; paintSocial(); });
  on('sp-f-q','input',e=>{ SOCIAL_FILTER.q=e.target.value;
    document.querySelectorAll('#sp-body tr').forEach(tr=>{ const qq=(tr.dataset.q||'').toLowerCase();
      tr.style.display = !e.target.value.trim() || qq.includes(e.target.value.trim().toLowerCase()) ? '' : 'none'; }); });
  on('sp-new-ig','click',()=>socialNewPost('ig'));
  on('sp-new-x','click',()=>socialNewPost('x'));
  const spShiftWeek = n => { const b = SOCIAL_CAL_WEEK ? spDate(SOCIAL_CAL_WEEK) : new Date(); b.setDate(b.getDate()+n*7); return spDay(b); };
  on('sp-cal-prev','click',()=>{ if (SOCIAL_CAL_MODE==='week') SOCIAL_CAL_WEEK = spShiftWeek(-1); else SOCIAL_CAL_MONTH = spShiftYM(socialCalYM(), -1); paintSocial(); });
  on('sp-cal-next','click',()=>{ if (SOCIAL_CAL_MODE==='week') SOCIAL_CAL_WEEK = spShiftWeek(1); else SOCIAL_CAL_MONTH = spShiftYM(socialCalYM(), 1); paintSocial(); });
  on('sp-cal-today','click',()=>{ if (SOCIAL_CAL_MODE==='week') SOCIAL_CAL_WEEK = null; else SOCIAL_CAL_MONTH = spYM(new Date()); paintSocial(); });
  on('sp-cal-mode-week','click',()=>{ SOCIAL_CAL_MODE='week'; SOCIAL_CAL_WEEK=null; paintSocial(); });
  on('sp-cal-mode-month','click',()=>{ SOCIAL_CAL_MODE='month'; paintSocial(); });

  host.querySelectorAll('[data-sp-edit]').forEach(b=>b.onclick=(ev)=>{
    ev.preventDefault();
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===b.dataset.spEdit); if(!p) return;
    SOCIAL_EDIT = JSON.parse(JSON.stringify(p));
    SOCIAL_EDIT.metrics = SOCIAL_EDIT.metrics||{};
    SOCIAL_EDIT.pages = SOCIAL_EDIT.pages||[];
    SOCIAL_EDIT.images = SOCIAL_EDIT.images||[];
    SOCIAL_VIEW='edit'; SOCIAL_DIRTY=false; paintSocial();
    document.querySelector('[data-panel="social"]')?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  host.querySelectorAll('[data-sp-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定刪除此貼文？')) return;
    try { await api('/admin/social/posts/'+b.dataset.spDel,{method:'DELETE'});
      SOCIAL_POSTS = SOCIAL_POSTS.filter(x=>x.id!==b.dataset.spDel);
      toast('已刪除貼文'); paintSocial();
    } catch(e){ toast(e.message); }
  });

  if (SOCIAL_VIEW!=='edit' || !SOCIAL_EDIT) return;

  /* ---- 編輯器 ---- */
  // 每次輸入即回寫 SOCIAL_EDIT：任何 refresh() 整頁重繪都從最新狀態重建，不遺失
  const markDirty = ()=>{ socialCollectEdit(); SOCIAL_DIRTY=true; };
  host.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',markDirty));
  on('sp-back','click',()=>{
    if (SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;
    SOCIAL_VIEW='list'; SOCIAL_EDIT=null; SOCIAL_DIRTY=false; paintSocial();
  });
  on('sp-save','click',socialSave);
  on('sp-del','click',async()=>{
    if(!confirm('確定刪除此貼文？')) return;
    try { await api('/admin/social/posts/'+SOCIAL_EDIT.id,{method:'DELETE'});
      SOCIAL_POSTS = SOCIAL_POSTS.filter(x=>x.id!==SOCIAL_EDIT.id);
      SOCIAL_VIEW='list'; SOCIAL_EDIT=null; SOCIAL_DIRTY=false;
      toast('已刪除貼文'); paintSocial();
    } catch(e){ toast(e.message); }
  });
  on('sp-copy','click',async()=>{
    socialCollectEdit();
    const p2 = SOCIAL_EDIT;
    // IG：中英同貼合併；X：中文版（日文版用「複製日文」另發）
    const text = p2.platform==='ig'
      ? [p2.caption, p2.caption_en, p2.hashtags].filter(Boolean).join('\n\n')
      : p2.caption + (p2.hashtags?'\n\n'+p2.hashtags:'');
    try { await navigator.clipboard.writeText(text); toast(p2.platform==='ig'?'已複製中英文案＋hashtags':'已複製中文版'); }
    catch(e){ toast('複製失敗：'+e.message); }
  });
  on('sp-copy-ja','click',async()=>{
    socialCollectEdit();
    try { await navigator.clipboard.writeText(SOCIAL_EDIT.caption_ja||''); toast('已複製日文版'); }
    catch(e){ toast('複製失敗：'+e.message); }
  });
  on('sp-export','click',socialExportPngs);
  on('sp-e-caption','input',e=>{
    const el=document.getElementById('sp-xlen');
    if (el) el.textContent = `中文版全形計 2：${socialXLen(e.target.value)}／280`;
  });
  on('sp-e-caption-ja','input',e=>{
    const el=document.getElementById('sp-xlen-ja');
    if (el) el.textContent = `日文版全形計 2：${socialXLen(e.target.value)}／280`;
  });
  on('sp-e-platform','change',()=>{ socialCollectEdit(); paintSocial(); });
  on('sp-e-upload','change',async e=>{
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const ed = SOCIAL_EDIT;   // 上傳期間可能切換貼文：完成時比對仍是同一篇才寫入
    try {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/admin/upload/social',{ method:'POST', headers: token?{Authorization:'Bearer '+token}:{}, body: fd });
      const data = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(data.error || ('上傳失敗（'+r.status+'）'));
      if (!SOCIAL_EDIT || SOCIAL_EDIT !== ed) { toast('已離開原貼文，圖片未加入（'+data.url+'）'); return; }
      socialCollectEdit();
      SOCIAL_EDIT.images.push(data.url);
      SOCIAL_DIRTY = true;
      toast('已上傳，記得儲存貼文'); paintSocial();
    } catch(err){ toast(err.message); } finally { e.target.value=''; }
  });
  host.querySelectorAll('[data-sp-imgdel]').forEach(b=>b.onclick=()=>{
    socialCollectEdit();
    SOCIAL_EDIT.images.splice(Number(b.dataset.spImgdel),1);
    SOCIAL_DIRTY=true; paintSocial();
  });

  /* 頁面編輯 */
  on('sp-pgadd','click',()=>{
    socialCollectEdit();
    SOCIAL_EDIT.pages.push({category:'03',variant:'a',format:'portrait',q_text:'',q_sub:'',q_by:''});
    SOCIAL_DIRTY=true; paintSocial();
  });
  host.querySelectorAll('[data-sp-pglayout]').forEach(sel=>sel.onchange=()=>{
    socialCollectEdit();
    const i=Number(sel.dataset.spPglayout), lid=sel.value;
    const pg=SOCIAL_EDIT.pages[i];
    SOCIAL_EDIT.pages[i]=Object.assign({},pg,{category:lid.slice(0,2),variant:lid.slice(2)});
    SOCIAL_DIRTY=true; paintSocial();
  });
  host.querySelectorAll('[data-sp-pg]').forEach(inp=>inp.addEventListener('input',()=>{
    const i=Number(inp.dataset.spPg), k=inp.dataset.spK;
    if (SOCIAL_EDIT.pages[i]) SOCIAL_EDIT.pages[i][k]=inp.value;
    SOCIAL_DIRTY=true;
    // 只重繪這一頁的預覽
    const box=document.querySelector(`[data-sp-prev="${i}"]`);
    if (box && window.IGStudio && window.IGStudio.renderSpec){
      try { const node=window.IGStudio.renderSpec(spNormPage(SOCIAL_EDIT.pages[i]));
        node.style.transformOrigin='top left'; node.style.transform='scale('+(150/1080)+')';
        box.innerHTML=''; box.appendChild(node);
      } catch(e){}
    }
  }));
  const movePage=(i,dir)=>{
    socialCollectEdit();
    const pgs=SOCIAL_EDIT.pages, j=i+dir;
    if (j<0||j>=pgs.length) return;
    [pgs[i],pgs[j]]=[pgs[j],pgs[i]];
    SOCIAL_DIRTY=true; paintSocial();
  };
  host.querySelectorAll('[data-sp-pgup]').forEach(b=>b.onclick=()=>movePage(Number(b.dataset.spPgup),-1));
  host.querySelectorAll('[data-sp-pgdn]').forEach(b=>b.onclick=()=>movePage(Number(b.dataset.spPgdn),1));
  host.querySelectorAll('[data-sp-pgdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('刪除此頁？')) return;
    socialCollectEdit();
    SOCIAL_EDIT.pages.splice(Number(b.dataset.spPgdel),1);
    SOCIAL_DIRTY=true; paintSocial();
  });
}

async function ensureIgScripts() {
  if (window.IGStudio) return;
  const load = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
  await load('/ig-studio-lib.js');
  await load('/vendor/html-to-image.js');
  await load('/menu-data.js');
  await load('/ig-studio.js');
  await load('/social-ads-lib.js');
}

async function refresh(){ const d=await api('/state'); if(!d.organizer)await ensureIgScripts(); render(d); applyRoute(); }

async function main(){
  if (!token) return renderLogin();
  try {
    const d = await api('/state');
    if (!['admin','organizer'].includes(d.role)) return renderLogin('請使用已授權帳號登入；外部主辦人請使用活動主入口 /organizer/events。');
    if(!d.organizer)await ensureIgScripts();
    render(d);
    applyRoute();
  } catch(e){
    if (String(e.message).includes('登入') || String(e.message).includes('401')) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); return renderLogin(); }
    app.innerHTML = `<p class="a-center">暫時無法連線：${esc(e.message)}<br><button class="btn btn--ghost btn-sm" style="margin-top:1rem" onclick="location.reload()">重新整理</button></p>`;
  }
}
main();
</script>
</body>
</html>
