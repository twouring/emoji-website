<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1A17">
<meta name="robots" content="noindex,nofollow">
<title>桌邊點餐｜言文字</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--soft:#3A362E;--muted:#6F6A60;--paper:#FAF8F3;--line:#E4E0D6;--yellow:#FFDE34;--ok:#1F7A4D;--bad:#B3261E}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);padding-bottom:calc(104px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation}input,textarea{font:inherit}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}.ico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ico.lg{width:1.35em;height:1.35em}.with-icon{display:inline-flex;align-items:center;justify-content:center;gap:7px}.title-icon{display:inline-flex;align-items:center;gap:8px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:1.15rem}.top .actions{display:flex;align-items:center;gap:8px}.top .t{background:var(--yellow);color:var(--ink);padding:4px 12px;border-radius:999px;font-weight:700;white-space:nowrap}.lang{min-width:48px;min-height:38px;border:1px solid #777;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-weight:700}
.top small{color:#cfc9bb}
.wrap{padding:14px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
h2{font-size:1rem;margin:22px 0 8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h3{font-size:1.05rem;margin:0 0 6px}
.venue{font-size:1.3rem;margin:26px 0 4px;font-weight:700}.venue small{color:var(--muted);font-weight:400;margin-left:6px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:stretch;min-width:0;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}
.item:active{transform:translateY(1px)}
.item img,.item .ph{width:100%;aspect-ratio:4/3;object-fit:cover;flex:none;background:linear-gradient(135deg,#eee9da,#faf8f3);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.8rem}
.item .n{padding:10px 10px 12px;min-width:0}.item .n b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}.item .n small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .n small.note{display:none}
.item .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.item .p{font-weight:800;white-space:nowrap}.item .tap{font-size:1rem;color:var(--muted)}
.add{border:0;background:transparent;color:inherit;text-align:left}
.menu-status{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.menu-status b{font-size:1.05rem}.menu-status small{display:block;color:var(--muted);line-height:1.4}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;z-index:5;box-shadow:0 -6px 22px rgba(0,0,0,.08)}
.bar .s{min-width:0}.bar .s small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;min-height:48px}
.btn:disabled{opacity:.45;cursor:default}.btn.ghost{background:#fff;color:var(--ink)}.btn.sm{padding:6px 14px}.btn.y{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.sheet{position:fixed;inset:0;background:rgba(27,26,23,.55);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}.line .by{color:var(--muted)}
.detail-img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--line);margin:6px 0 12px}.detail-note{color:var(--muted);margin:0 0 10px}.detail-price{font-size:1.25rem;font-weight:800;margin:0 0 8px}.opt{margin:14px 0}.opt-title{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice-grid label{display:flex;align-items:center;justify-content:center;min-height:44px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;line-height:1.25}.choice-grid label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fff8cf}.choice-grid input{position:absolute;opacity:0;pointer-events:none}.qty{display:flex;align-items:center;gap:10px}.qty button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:1.2rem}.qty b{min-width:2ch;text-align:center}.note-field textarea{width:100%;min-height:74px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical}
.line .x{border:0;background:none;color:var(--bad);padding:0 4px}
.who{font-weight:700;margin:14px 0 4px;display:flex;justify-content:space-between}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#pay-scope{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#pay-scope label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;line-height:1.35}#pay-scope label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.split-box{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}.split-box input{width:72px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.split-result{background:#fff8cf;border-radius:10px;padding:10px 12px;margin:8px 0}.split-result b{display:block;font-size:1.15rem}
input.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tp{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;height:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700}
.st.paid{background:#EEE9DA}.st.ready{background:var(--yellow)}.st.done{background:var(--line);color:var(--muted)}
.ready-banner{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--yellow);color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-weight:700;text-align:center;display:none;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.ready-banner.on{display:block}
.err{color:var(--bad);min-height:1.2em}.muted{color:var(--muted)}
.notice{color:var(--muted);margin:20px 0}
.hidden{display:none!important}
.toast{position:fixed;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;text-align:center;display:none}.toast.on{display:block}
@media (max-width:380px){.wrap{padding:10px}.top{padding-left:12px;padding-right:12px}.bar{grid-template-columns:1fr 82px 104px;padding-left:8px;padding-right:8px;gap:6px}.btn{padding-left:9px;padding-right:9px}.btn.sm{min-height:42px}.menu-grid{grid-template-columns:1fr 1fr;gap:8px}.item .n{padding:8px}.item .tap{display:none}#pay-scope{grid-template-columns:1fr}.top .t{padding-left:8px;padding-right:8px}.choice-grid{grid-template-columns:1fr 1fr}.sheet .in{padding-left:12px;padding-right:12px}}
@media (max-width:320px){.menu-grid{grid-template-columns:1fr}.bar{grid-template-columns:1fr 76px 96px}.top b{font-size:1rem}.top small{display:block}.lang{min-width:42px;padding:4px 8px}.choice-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg class="svg-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-4 2.4-6 5.5-6s4.9 2 5.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 14c3.2-.6 5.1 1 5.5 4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c.5-5.2 2.8-8 7-8s6.5 2.8 7 8"/></symbol>
  <symbol id="i-split" viewBox="0 0 24 24"><path d="M5 4v4c0 2.2 1.8 4 4 4h6M5 20v-4c0-2.2 1.8-4 4-4M15 8l4 4-4 4"/></symbol>
  <symbol id="i-counter" viewBox="0 0 24 24"><path d="M3 10h18M5 10v9h14v-9M8 6h8l2 4H6l2-4Z"/><path d="M9 14h6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3v-4a5 5 0 0 0-10 0v4l-2 3Z"/><path d="M10 20h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
</svg>
<div class="ready-banner" id="ready-banner"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<header class="top"><div><b id="brand">言文字</b> <small data-i18n="order">桌邊點餐</small></div><div class="actions"><button class="lang with-icon" id="lang-toggle" type="button" aria-label="Switch language"><svg class="ico" aria-hidden="true"><use href="#i-globe"></use></svg><span id="lang-label">EN</span></button><span class="t" id="table-no">—</span></div></header>
<main class="wrap">
  <div class="card" id="boot"><p class="muted" data-i18n="loading">載入中…</p></div>

  <section id="app" class="hidden">
    <div class="card" id="orders-card"></div>
    <div class="card"><form id="name-form" class="row" style="margin:0 0 6px"><input class="f" id="name-in" data-i18n-placeholder="name_placeholder" placeholder="你的稱呼（讓同桌知道誰點了什麼）" maxlength="20" required style="flex:1;min-width:0"><button class="btn sm" type="submit" data-i18n="confirm">好</button></form><div class="muted" data-i18n="shared_hint">同桌的人掃同一個 QR 就能一起點；用餐完再到櫃檯結帳，可付全桌、各付自己的，或平均分攤。</div></div>
    <div class="menu-status" id="menu-shift"><div><b class="title-icon"><svg class="ico" aria-hidden="true"><use href="#i-clock"></use></svg><span data-i18n="current_menu">目前菜單</span></b><small id="menu-hours">依台北時間顯示目前供應品項</small></div></div>
    <div id="menu"></div>
    <p class="notice" id="alcohol-notice" data-i18n="alcohol" hidden>未滿十八歲禁止飲酒。禁止酒駕。</p>
  </section>
</main>

<div class="bar" id="bar" hidden><div class="s"><b id="bar-total">NT$0</b><small id="bar-count"></small></div><button class="btn ghost with-icon" id="open-cart"><svg class="ico" aria-hidden="true"><use href="#i-cart"></use></svg><span data-i18n="cart">購物車</span></button><button class="btn y with-icon" id="open-pay"><svg class="ico" aria-hidden="true"><use href="#i-receipt"></use></svg><span data-i18n="checkout">用餐完結帳</span></button></div>

<div class="sheet" id="cart"><div class="in"><h3 class="title-icon"><svg class="ico lg" aria-hidden="true"><use href="#i-cart"></use></svg><span data-i18n="table_order">這桌的點餐</span></h3><div id="cart-lines"></div><div class="tot"><span data-i18n="unpaid_total">未結帳合計</span><span id="cart-total"></span></div><div class="row"><button class="btn ghost" data-close data-i18n="continue">繼續點</button><button class="btn y with-icon" id="cart-pay"><svg class="ico" aria-hidden="true"><use href="#i-receipt"></use></svg><span data-i18n="checkout">用餐完結帳</span></button></div></div></div>


<div class="sheet" id="item-detail"><div class="in">
  <div id="detail-body"></div>
  <div class="row"><button class="btn ghost" data-close data-i18n="back_menu">返回菜單</button><button class="btn y" id="detail-add" type="button" data-i18n="add_to_cart">加入購物車</button></div>
</div></div>

<div class="sheet" id="pay"><div class="in">
  <h3 class="title-icon"><svg class="ico lg" aria-hidden="true"><use href="#i-counter"></use></svg><span data-i18n="checkout_title">用餐完再到櫃檯結帳</span></h3>
  <p class="muted" data-i18n="checkout_hint">請先享用餐點；離席前帶著手機到櫃檯，工作人員會依這桌點餐明細結帳。</p>
  <div class="row" id="pay-scope"><label><input type="radio" name="scope" value="all" checked><svg class="ico" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="whole_table">付全桌</span></label><label><input type="radio" name="scope" value="mine"><svg class="ico" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="my_items">只付我的</span></label><label><input type="radio" name="scope" value="split"><svg class="ico" aria-hidden="true"><use href="#i-split"></use></svg><span data-i18n="split_evenly">平均分攤</span></label></div>
  <label class="split-box hidden" id="split-box"><svg class="ico" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="people">分攤人數</span><input id="split-people" type="number" inputmode="numeric" min="2" max="20" value="2"><span data-i18n="people_suffix">人</span></label>
  <div class="tot"><span class="title-icon"><svg class="ico" aria-hidden="true"><use href="#i-counter"></use></svg><span data-i18n="counter_amount">櫃檯結帳金額</span></span><span id="pay-amount"></span></div>
  <div class="split-result hidden" id="split-result"><div class="title-icon"><svg class="ico lg" aria-hidden="true"><use href="#i-split"></use></svg><b id="split-each"></b></div><span class="muted" id="split-note"></span></div>
  <div id="pay-off"><p class="muted" data-i18n="keep_screen">畫面可先保留，結帳時出示給櫃檯確認。</p><div class="row"><button class="btn ghost" data-close data-i18n="back">返回繼續點</button></div></div>
</div></div>

<script src="/menu-lib.js"></script>
<script src="/order-lib.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var icon=function(name){return '<svg class="ico" aria-hidden="true"><use href="#i-'+esc(name)+'"></use></svg>';};
  var toastT;var toast=function(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},4000);};
  var money=function(n){return 'NT$'+Number(n||0).toLocaleString('zh-TW');};
  var qs=new URLSearchParams(location.search),T=qs.get('t')||'',K=qs.get('k')||'';
  var S=null,MENU=[],VENUE=null,CFG={},GUEST,NAME,seenReady={},pollTimer,LANG='zh',CURRENT_ITEM=null,CURRENT_QTY=1;
  try{GUEST=localStorage.getItem('order_guest');NAME=localStorage.getItem('order_name')||'';LANG=localStorage.getItem('order_lang')||'';}catch(e){}
  if(!LANG){var ql=qs.get('lang'),nl=(navigator.language||'').toLowerCase();LANG=ql==='en'||ql==='ja'?ql:(!ql&&/^ja/.test(nl)?'ja':(!ql&&!/^zh/i.test(nl)?'en':'zh'));}
  var tr=function(key,vars){return OrderLib.text(LANG,key,vars);};
  var label=function(obj){return LANG==='en'?(obj.en||obj.zh):LANG==='ja'?(obj.ja||obj.zh):obj.zh;};
  function applyLanguage(){
    document.documentElement.lang=LANG==='en'?'en':(LANG==='ja'?'ja':'zh-Hant');
    document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=tr(el.dataset.i18n);});
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=tr(el.dataset.i18nPlaceholder);});
    $('#lang-label').textContent=LANG==='zh'?'EN':(LANG==='en'?'日本語':'中文');
    if(S){renderMenu();renderState();refreshPayAmount();}
  }
  $('#lang-toggle').onclick=function(){LANG=LANG==='zh'?'en':(LANG==='en'?'ja':'zh');try{localStorage.setItem('order_lang',LANG);}catch(e){}applyLanguage();};
  applyLanguage();
  if(!GUEST){GUEST=Math.random().toString(36).slice(2,14)+Math.random().toString(36).slice(2,6);try{localStorage.setItem('order_guest',GUEST);}catch(e){}}
  var api=function(path,opt){opt=opt||{};return fetch('/api'+path,{method:opt.method||'GET',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok)throw Error(d.error||('伺服器錯誤 '+r.status));return d;});});};
  var fail=function(msg){$('#boot').innerHTML='<p class="err">'+esc(msg)+'</p>';$('#boot').classList.remove('hidden');};

  $('#name-in').value=NAME;
  $('#name-form').onsubmit=function(e){e.preventDefault();NAME=$('#name-in').value.trim().slice(0,20);try{localStorage.setItem('order_name',NAME);}catch(x){}$('#name-in').blur();};
  var needName=function(){if(NAME)return true;$('#name-in').focus();$('#name-in').reportValidity();return false;};

  function renderMenu(){
    VENUE=MenuLib.activeVenue();
    var hours=VENUE==='CAFE'?(LANG==='en'?'at cafe · Serving now':LANG==='ja'?'在咖啡・提供中':'在咖啡・供應中'):VENUE==='BAR'?(LANG==='en'?'3AM · Serving now':LANG==='ja'?'三點水・提供中':'三點水・供應中'):(LANG==='en'?'Kitchen currently closed':LANG==='ja'?'現在は提供時間外です':'目前非供餐時段');
    var venueLabel=MenuLib.VENUE_LABEL[VENUE]||{zh:'言文字',en:'Emoji',ja:'言文字'};
    $('#brand').textContent=label(venueLabel);
    $('#menu-hours').textContent=hours;
    var items=MenuLib.sortItems(MENU.filter(function(it){return it.venue===VENUE;})),html='',venue='',cat='';
    items.forEach(function(it){
      if(it.venue!==venue){if(venue)html+='</div>';venue=it.venue;cat='';var v=MenuLib.VENUE_LABEL[venue]||{zh:venue,en:'',ja:venue};html+='<div class="venue">'+esc(label(v))+'<small>'+esc(LANG==='zh'?v.en:v.zh)+'</small></div><div>';}
      if(it.cat!==cat){cat=it.cat;var c=MenuLib.CAT_LABEL[cat]||{zh:cat,en:cat,ja:cat};html+='<h2>'+esc(label(c))+'</h2><div class="menu-grid">';}
      var next=items[items.indexOf(it)+1];
      var primary=label(it),secondary=LANG==='zh'?it.en:it.zh;
      html+='<button class="item add" data-open-item="'+esc(it.id)+'" aria-label="'+esc(tr('view_detail'))+' '+esc(primary)+'">'+(it.image?'<img src="'+esc(it.image)+'" alt="'+esc(primary)+'" loading="lazy">':'<div class="ph" aria-hidden="true">🍽</div>')+'<div class="n"><b>'+esc(primary)+'</b>'+(secondary?'<small>'+esc(secondary)+'</small>':'')+(it.note?'<small class="note">'+esc(it.note)+'</small>':'')+'<div class="meta"><span class="p">'+money(it.price)+'</span><span class="tap">'+esc(tr('view_detail'))+'</span></div></div></button>';
      if(!next||next.cat!==cat){html+='</div>';}
    });
    if(venue)html+='</div>';
    $('#menu').innerHTML=html||'<p class="muted">'+esc(VENUE?tr('menu_unavailable'):tr('closed_message'))+'</p>';
    $('#alcohol-notice').hidden=!items.some(function(i){return i.alcohol;});
  }

  function optionGroups(it){return OrderLib.optionGroups(it,LANG);}
  function openItem(id){
    CURRENT_ITEM=MENU.find(function(it){return it.id===id;});CURRENT_QTY=1;if(!CURRENT_ITEM)return;
    var primary=label(CURRENT_ITEM),secondary=LANG==='zh'?CURRENT_ITEM.en:CURRENT_ITEM.zh,groups=optionGroups(CURRENT_ITEM);
    var html=(CURRENT_ITEM.image?'<img class="detail-img" src="'+esc(CURRENT_ITEM.image)+'" alt="'+esc(primary)+'">':'')+'<h3>'+esc(primary)+'</h3>'+(secondary?'<p class="muted" style="margin:0 0 6px">'+esc(secondary)+'</p>':'')+'<p class="detail-price">'+money(CURRENT_ITEM.price)+'</p>'+(CURRENT_ITEM.note?'<p class="detail-note">'+esc(CURRENT_ITEM.note)+'</p>':'')+'<div class="opt"><div class="opt-title"><span>'+esc(tr('quantity'))+'</span></div><div class="qty"><button type="button" data-qty="-1">−</button><b id="detail-qty">1</b><button type="button" data-qty="1">＋</button></div></div>';
    html+=groups.map(function(g){return '<div class="opt" data-opt="'+esc(g.key)+'"><div class="opt-title"><span>'+esc(g.label)+'</span><small class="muted">'+esc(tr('required'))+'</small></div><div class="choice-grid">'+g.choices.map(function(c,i){return '<label><input type="radio" name="opt_'+esc(g.key)+'" value="'+esc(c)+'" '+(i===0?'checked':'')+'><span>'+esc(c)+'</span></label>';}).join('')+'</div></div>';}).join('');
    html+='<label class="opt note-field"><div class="opt-title"><span>'+esc(tr('special_request'))+'</span><small class="muted">'+esc(tr('optional'))+'</small></div><textarea id="detail-note" maxlength="80" placeholder="'+esc(tr('special_placeholder'))+'"></textarea></label>';
    $('#detail-body').innerHTML=html;$('#item-detail').classList.add('on');$('#detail-add').disabled=false;$('#detail-add').textContent=tr('add_to_cart');
  }
  function optionNote(){
    var parts=[];optionGroups(CURRENT_ITEM).forEach(function(g){var r=document.querySelector('input[name="opt_'+g.key+'"]:checked');if(r)parts.push(g.label+'：'+r.value);});
    var extra=($('#detail-note')&&$('#detail-note').value.trim())||'';if(extra)parts.push(extra.slice(0,80));return parts.join('；');
  }

  var unpaid=function(){return (S.items||[]).filter(function(l){return !l.order_id;});};
  var mine=function(){return unpaid().filter(function(l){return l.mine;});};
  var sum=function(ls){return ls.reduce(function(a,l){return a+l.price*l.qty;},0);};

  function renderState(){
    $('#table-no').textContent=tr('table')+' '+S.table;
    var u=unpaid();
    $('#bar').hidden=false;$('#bar-total').textContent=money(sum(u));$('#bar-count').textContent=u.length?tr('unpaid_items',{count:u.length}):tr('empty');
    $('#open-pay').disabled=!u.length;$('#cart-pay').disabled=!u.length;
    // 購物車：依人分組
    var groups={},order=[];u.forEach(function(l){var k=l.by+(l.mine?'#me':'');if(!groups[k]){groups[k]={by:l.by,mine:l.mine,lines:[]};order.push(k);}groups[k].lines.push(l);});
    $('#cart-lines').innerHTML=order.length?order.map(function(k){var g=groups[k];return '<div class="who"><span>'+esc(g.by)+(g.mine?'（'+esc(tr('me'))+'）':'')+'</span><span>'+money(sum(g.lines))+'</span></div>'+g.lines.map(function(l){var itemName=LANG==='en'?(l.en||l.zh):LANG==='ja'?(l.ja||l.zh):l.zh;return '<div class="line"><span>'+esc(itemName)+' ×'+l.qty+(l.note?' <span class="by">'+esc(l.note)+'</span>':'')+'</span><span>'+money(l.price*l.qty)+(l.mine?' <button class="x" data-del="'+esc(l.line)+'" aria-label="'+esc(tr('remove'))+'">✕</button>':'')+'</span></div>';}).join('');}).join(''):'<p class="muted">'+esc(tr('no_orders'))+'</p>';
    $('#cart-total').textContent=money(sum(u));
    // 出餐單
    var os=S.orders||[],byId={};(S.items||[]).forEach(function(l){byId[l.line]=l;});
    $('#orders-card').classList.toggle('hidden',!os.length);
    $('#orders-card').innerHTML='<h3 class="title-icon">'+icon('receipt')+'<span>'+esc(tr('paid'))+'</span></h3>'+os.map(function(o){var st={paid:tr('preparing'),ready:tr('ready'),done:tr('done')}[o.status]||o.status,statusIcon=o.status==='paid'?'bell':'check';return '<div class="line"><span><span class="st '+esc(o.status)+'">'+icon(statusIcon)+esc(st)+'</span> '+o.lines.map(function(id){var l=byId[id];return l?esc(LANG==='en'?(l.en||l.zh):LANG==='ja'?(l.ja||l.zh):l.zh)+'×'+l.qty:'';}).filter(Boolean).join(LANG==='en'?', ':'、')+'</span><span>'+money(o.amount)+'</span></div>'+(o.status==='paid'&&CFG.vapid_public_key&&!o._pushed?'<div class="row"><button class="btn ghost sm with-icon" data-push="'+esc(o.id)+'">'+icon('bell')+'<span>'+esc(tr('notification_prompt'))+'</span></button></div>':'');}).join('');
    os.forEach(function(o){if(o.status==='ready'&&!seenReady[o.id]){seenReady[o.id]=true;var b=$('#ready-banner');b.textContent=tr('ready_banner',{table:S.table});b.classList.add('on');try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}beep();setTimeout(function(){b.classList.remove('on');},15000);}});
  }
  function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.4);}catch(e){}}

  function load(){return api('/orders/table?t='+encodeURIComponent(T)+'&k='+encodeURIComponent(K)+'&g='+GUEST).then(function(s){S=s;renderState();});}
  function poll(){clearTimeout(pollTimer);pollTimer=setTimeout(function(){if(document.hidden)return poll();api('/orders/'+S.id+'?g='+GUEST).then(function(s){if(s.status!=='open'){return load();}S=s;renderState();}).catch(function(){}).then(poll);},5000);}

  document.addEventListener('click',function(e){
    var oi=e.target.closest('[data-open-item]');if(oi){openItem(oi.dataset.openItem);return;}
    var qb=e.target.closest('[data-qty]');if(qb){CURRENT_QTY=Math.max(1,Math.min(20,CURRENT_QTY+Number(qb.dataset.qty||0)));$('#detail-qty').textContent=CURRENT_QTY;return;}
    var d=e.target.closest('[data-del]');if(d){api('/orders/'+S.id+'/items/'+d.dataset.del,{method:'DELETE',body:{guest:GUEST}}).then(function(s){S=s;renderState();}).catch(function(err){toast(err.message);});return;}
    var p=e.target.closest('[data-push]');if(p){subscribePush(p.dataset.push,p);return;}
    if(e.target.closest('[data-close]'))document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('on');});
  });
  $('#detail-add').onclick=function(){if(!CURRENT_ITEM)return;NAME=$('#name-in').value.trim().slice(0,20)||NAME;if(!needName())return;try{localStorage.setItem('order_name',NAME);}catch(x){}var btn=this;btn.disabled=true;api('/orders/'+S.id+'/items',{method:'POST',body:{item_id:CURRENT_ITEM.id,qty:CURRENT_QTY,by:NAME,guest:GUEST,note:optionNote()}}).then(function(s){S=s;renderState();btn.textContent='✓ '+tr('added');setTimeout(function(){$('#item-detail').classList.remove('on');btn.textContent=tr('add_to_cart');},450);}).catch(function(err){toast(err.message);if(/已結束/.test(err.message))load();}).then(function(){btn.disabled=false;});};
  $('#open-cart').onclick=function(){$('#cart').classList.add('on');};
  $('#open-pay').onclick=$('#cart-pay').onclick=function(){$('#cart').classList.remove('on');openPay();};

  /* ---- 用餐完櫃檯結帳提醒／AA 分帳 ---- */
  function payScopeLines(){var scope=document.querySelector('input[name=scope]:checked').value;return scope==='mine'?mine():unpaid();}
  function refreshPayAmount(){
    if(!S)return;
    var scope=document.querySelector('input[name=scope]:checked').value,ls=payScopeLines(),isSplit=scope==='split';
    $('#pay-amount').textContent=money(sum(ls));
    $('#split-box').classList.toggle('hidden',!isSplit);$('#split-result').classList.toggle('hidden',!isSplit);
    if(isSplit){
      var people=Math.max(2,Math.min(20,Number($('#split-people').value)||2));$('#split-people').value=people;
      var split=OrderLib.splitBill(sum(ls),people);
      $('#split-each').textContent=tr('split_each')+' '+money(split.base);
      $('#split-note').textContent=split.remainder?tr('split_remainder',{count:split.remainder}):'';
    }
  }
  document.querySelectorAll('input[name=scope]').forEach(function(r){r.onchange=refreshPayAmount;});
  $('#split-people').oninput=refreshPayAmount;
  function openPay(){
    $('#pay').classList.add('on');
    var mineRadio=document.querySelector('input[name=scope][value=mine]'),hasSeparateMine=mine().length&&mine().length<unpaid().length;
    mineRadio.parentNode.style.display=hasSeparateMine?'':'none';
    if(mineRadio.checked&&!hasSeparateMine)document.querySelector('input[name=scope][value=all]').checked=true;
    refreshPayAmount();
  }

  /* ---- 取餐推播（不登入） ---- */
  function subscribePush(orderId,btn){
    if(!('serviceWorker'in navigator)||!('PushManager'in window)){toast(tr('notification_unsupported'));return;}
    btn.disabled=true;
    var vapid=CFG.vapid_public_key,key=Uint8Array.from(atob(vapid.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(vapid.length/4)*4,'=')),function(c){return c.charCodeAt(0);});
    navigator.serviceWorker.register('/event-push-sw.js').then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});});})
      .then(function(sub){return api('/orders/'+S.id+'/push',{method:'POST',body:{order_id:orderId,subscription:sub.toJSON()}});})
      .then(function(){(S.orders||[]).forEach(function(o){if(o.id===orderId)o._pushed=true;});btn.textContent=tr('notification_on');})
      .catch(function(err){toast(tr('notification_error',{message:err.message}));btn.disabled=false;});
  }

  /* ---- 啟動 ---- */
  if(!T||!K)return fail('請掃描桌上的 QR Code 進入點餐。');
  Promise.all([api('/orders/config'),fetch('/api/public').then(function(r){return r.json();}),load()]).then(function(r){
    CFG=r[0];var content=(r[1]&&r[1].content)||{};
    MENU=content.menu?MenuLib.publishedOnly(MenuLib.parseMenuDoc(content.menu)):[];
    $('#boot').classList.add('hidden');$('#app').classList.remove('hidden');
    renderMenu();renderState();poll();
    setInterval(function(){if(MenuLib.activeVenue()!==VENUE)renderMenu();},60000); // 17:00／03:00／08:00 換品牌
    document.addEventListener('visibilitychange',function(){if(!document.hidden)api('/orders/'+S.id+'?g='+GUEST).then(function(s){S=s;renderState();}).catch(function(){});});
  }).catch(function(err){fail(err.message);});
})();
</script>
</body>
</html>
