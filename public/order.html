<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1A17">
<meta name="robots" content="noindex,nofollow">
<title>桌邊點餐｜言文字</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--soft:#3A362E;--muted:#6F6A60;--paper:#FAF8F3;--line:#E4E0D6;--yellow:#FFDE34;--ok:#1F7A4D;--bad:#B3261E}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);padding-bottom:calc(104px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;touch-action:manipulation}input,textarea{font:inherit}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}.ico{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.ico.lg{width:1.35em;height:1.35em}.with-icon{display:inline-flex;align-items:center;justify-content:center;gap:7px}.title-icon{display:inline-flex;align-items:center;gap:8px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:1.15rem}.top .actions{display:flex;align-items:center;gap:8px}.top .t{background:var(--yellow);color:var(--ink);padding:4px 12px;border-radius:999px;font-weight:700;white-space:nowrap}.lang{min-width:48px;min-height:38px;border:1px solid #777;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-weight:700}
.top small{color:#cfc9bb;white-space:nowrap}.top>div:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .actions{flex-shrink:0}.lang{white-space:nowrap;flex-shrink:0}.menu-status[hidden]{display:none}
.wrap{padding:14px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
h2{font-size:1rem;margin:22px 0 8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h3{font-size:1.05rem;margin:0 0 6px}
.venue{font-size:1.3rem;margin:26px 0 4px;font-weight:700}.venue small{color:var(--muted);font-weight:400;margin-left:6px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;flex-direction:column;align-items:stretch;min-width:0;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left}
.item:active{transform:translateY(1px)}
.item img,.item .ph{width:100%;aspect-ratio:4/3;object-fit:cover;flex:none;background:linear-gradient(135deg,#eee9da,#faf8f3);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.8rem}
.item .n{padding:10px 10px 12px;min-width:0}.item .n b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}.item .n small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .n small.note{display:none}
.item .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}.item .p{font-weight:800;white-space:nowrap}.item .tap{font-size:1rem;color:var(--muted)}
.add{border:0;background:transparent;color:inherit;text-align:left}
#name-gate{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow)}#name-gate h3{margin-top:0}
.menu-status{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.menu-status b{font-size:1.05rem}.menu-status small{display:block;color:var(--muted);line-height:1.4}
.menu-status.paused{border-color:#b42318;background:#fff5f3}.menu-status.paused small{color:#b42318;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;z-index:5;box-shadow:0 -6px 22px rgba(0,0,0,.08)}
.bar [hidden]{display:none!important}.bar .btn{min-height:44px;padding-top:8px;padding-bottom:8px}.bar .s{min-width:0}.bar .s b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .s small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 按鈕一律不斷行：小螢幕靠縮內距與字級，不靠折成兩行（折行會把金額擠出可視區） */
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;min-height:48px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}.btn.ghost{background:#fff;color:var(--ink)}.btn.sm{padding:6px 14px}.btn.y{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.sheet{position:fixed;inset:0;background:rgba(27,26,23,.55);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .in{background:var(--paper);width:100%;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
/* 餐點詳情＝獨立頁面：全螢幕蓋住菜單（不是底部彈窗、沒有半透明遮罩），只捲中間內容，「上一步／加入已點清單」固定在底部，小螢幕也一定點得到 */
#item-detail{background:var(--paper);align-items:stretch}
#item-detail .in{display:flex;flex-direction:column;padding:0;overflow:hidden;max-height:none;height:100%;border-radius:0;max-width:640px;margin:0 auto}
#item-detail #detail-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top)) 16px 8px}
#item-detail .sheet-actions{flex:none;margin:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
#item-detail .sheet-actions .btn{flex:1 1 0;min-width:0;white-space:nowrap}
.name-form{margin:0}.name-form .f{min-height:48px;margin-bottom:10px}.name-actions{margin:0;flex-wrap:nowrap}.name-actions .btn{flex:1 1 0;min-width:0;white-space:nowrap}
/* 已點清單：多人一起點、品項一多時整張單比視窗高，「送出點餐／用餐完結帳」同樣固定在底部，不會被捲出畫面點不到 */
#cart .in{display:flex;flex-direction:column;padding:0;overflow:hidden}
#cart .sheet-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px 8px}
#cart .sheet-actions{flex:none;margin:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
#cart .sheet-actions .btn{flex:1 1 0;min-width:0}
body.sheet-open{overflow:hidden}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}.line .by{color:var(--muted)}
.detail-img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:var(--line);margin:6px 0 12px}.detail-note{color:var(--muted);margin:0 0 10px}.detail-price{font-size:1.25rem;font-weight:800;margin:0 0 8px}.opt{margin:14px 0}.opt-title{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice-grid label{display:flex;align-items:center;justify-content:center;min-height:44px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;line-height:1.25}.choice-grid label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fff8cf}.opt[data-opt=temperature] label:has(input:checked){background:#ffe7e2}.opt[data-opt=sugar] label:has(input:checked){background:#fff3bd}.opt[data-opt=ice] label:has(input:checked){background:#e1f2ff}.opt[data-opt=rice] label:has(input:checked){background:#e6f4df}.opt[data-opt=noodle] label:has(input:checked){background:#f0e7ff}.choice-grid input{position:absolute;opacity:0;pointer-events:none}.qty{display:flex;align-items:center;gap:10px}.qty button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:1.2rem}.qty b{min-width:2ch;text-align:center}.note-field textarea{width:100%;min-height:74px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical}
.line .x{border:0;background:none;color:var(--bad);padding:10px 12px;margin:-10px -8px -10px 0;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:1.1rem;cursor:pointer;touch-action:manipulation}
.who{font-weight:700;margin:14px 0 4px;display:flex;justify-content:space-between}
.tot{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#pay-scope{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#pay-scope label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;line-height:1.35}#pay-scope label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.split-box{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}.split-box input{width:72px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.split-result{background:#fff8cf;border-radius:10px;padding:10px 12px;margin:8px 0}.split-result b{display:block;font-size:1.15rem}
.pay-sent{display:flex;align-items:center;gap:8px;background:#eaf7ec;border:1px solid #bfe3c6;border-radius:10px;padding:10px 12px;margin:8px 0;color:#1b5e2a}.pay-sent span{flex:1}
input.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tp{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;height:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700}
.st.paid{background:#EEE9DA}.st.ready{background:var(--yellow)}.st.done{background:var(--line);color:var(--muted)}
/* 已點清單每行的送單狀態：未送出（白底黃框）、已送出（米底）、已出餐（灰字） */
.tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:middle;color:var(--muted)}
.tag.pending{border-color:var(--yellow);background:#fffbe8;color:var(--ink)}.tag.placed{background:#EEE9DA;color:var(--ink)}
/* 別人加了還沒送出的品項：整行黃底，讓人一眼看到「我按送出會連這些一起送」；剛出現的行閃一下 */
.line.others-pending{background:#fff6c2;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px;border-bottom-color:transparent}.line.others-pending .tag.pending{background:var(--yellow);border-color:var(--ink)}
@keyframes line-in{from{background:var(--yellow)}to{background:transparent}}.line.fresh{animation:line-in 1.6s ease-out}.line.others-pending.fresh{animation:none}
.place-hint{color:var(--soft);margin:6px 0 0;padding:6px 10px;background:#fff6c2;border-radius:8px}
/* 有還沒送出的品項時，結帳鍵先收起來（送出去才輪到結帳）：固定只留 2 顆鍵，桌邊常見手機寬度（375–430px）才不會把金額擠到被按鈕蓋住 */
.bar.has-place{grid-template-columns:1fr auto auto}.bar.has-place #open-pay{display:none}
.ready-banner{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--yellow);color:var(--ink);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-weight:700;text-align:center;display:none;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.ready-banner.on{display:block}
.err{color:var(--bad);min-height:1.2em}.muted{color:var(--muted)}
.notice{color:var(--muted);margin:20px 0}
.hidden{display:none!important}
#thanks .btn{margin-top:12px;width:100%}
.toast{position:fixed;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;text-align:center;display:none}.toast.on{display:block}
/* 375px（iPhone SE／mini）：底部列的兩顆鍵用 auto 寬、內距縮小（字級維持 16px 以上），金額欄保有最小寬度不被蓋住 */
@media (max-width:400px){.bar{grid-template-columns:minmax(84px,1fr) auto auto;gap:6px;padding-left:10px;padding-right:10px}.bar .btn{padding:10px 12px}.bar .with-icon{gap:5px}.bar .s b{font-size:1.05rem}.sheet-actions .btn{padding-left:10px;padding-right:10px}}
@media (max-width:380px){.wrap{padding:10px}.top{padding-left:12px;padding-right:12px}.bar{padding-left:8px;padding-right:8px}.btn{padding-left:9px;padding-right:9px}.btn.sm{min-height:42px}.menu-grid{grid-template-columns:1fr 1fr;gap:8px}.item .n{padding:8px}.item .tap{display:none}#pay-scope{grid-template-columns:1fr}.top .t{padding-left:8px;padding-right:8px}.choice-grid{grid-template-columns:1fr 1fr}.sheet .in{padding-left:12px;padding-right:12px}}
/* 320px：底部列按鈕藏圖示只留文字、內距再縮；上一步／加入兩顆鍵各半；語言鍵縮小 */
@media (max-width:320px){.menu-grid{grid-template-columns:1fr}.bar{grid-template-columns:minmax(72px,1fr) auto auto;gap:4px}.bar .btn{padding:9px 9px}.bar .ico{display:none}.top b{font-size:1rem}.top small{display:block}.lang{min-width:42px;padding:4px 8px}.choice-grid{grid-template-columns:1fr}.sheet-actions .btn{padding:10px 8px}.name-actions .btn{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<svg class="svg-sprite" aria-hidden="true" focusable="false">
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></symbol>
  <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-4 2.4-6 5.5-6s4.9 2 5.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 14c3.2-.6 5.1 1 5.5 4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c.5-5.2 2.8-8 7-8s6.5 2.8 7 8"/></symbol>
  <symbol id="i-split" viewBox="0 0 24 24"><path d="M5 4v4c0 2.2 1.8 4 4 4h6M5 20v-4c0-2.2 1.8-4 4-4M15 8l4 4-4 4"/></symbol>
  <symbol id="i-counter" viewBox="0 0 24 24"><path d="M3 10h18M5 10v9h14v-9M8 6h8l2 4H6l2-4Z"/><path d="M9 14h6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3v-4a5 5 0 0 0-10 0v4l-2 3Z"/><path d="M10 20h4"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
</svg>
<div class="ready-banner" id="ready-banner"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<header class="top"><div><b id="brand">言文字</b> <small data-i18n="order">桌邊點餐</small></div><div class="actions"><button class="lang with-icon" id="lang-toggle" type="button" aria-label="Switch language"><svg class="ico" aria-hidden="true"><use href="#i-globe"></use></svg><span id="lang-label">EN</span></button><span class="t" id="table-no">—</span></div></header>
<main class="wrap">
  <div class="card" id="boot"><p class="muted" data-i18n="loading">載入中…</p></div>
  <div class="card hidden" id="thanks"><h3 class="title-icon"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg><span data-i18n="thanks">感謝用餐，期待再次光臨。</span></h3><p class="muted" data-i18n="thanks_hint">這次點餐已結束。若要再點，請重新掃描桌上的 QR。</p><button class="btn y" type="button" id="thanks-again" data-i18n="thanks_again">重新點餐</button></div>

  <section id="app" class="hidden">
    <div class="card" id="name-gate"><h3 class="title-icon"><svg class="ico" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="name_gate_title">先告訴我們怎麼稱呼您</span></h3><p class="muted" style="margin-top:0" data-i18n="shared_hint">同桌的人掃同一個 QR 就能一起點；用餐完再到櫃檯結帳，可全部付款、各付各的，或平均分攤。</p><form id="name-form" class="name-form"><input class="f" id="name-in" data-i18n-placeholder="name_placeholder" placeholder="你的稱呼（讓同桌知道誰點了什麼）" maxlength="20" autocomplete="off"><div class="row name-actions"><button class="btn ghost" type="button" id="name-skip" data-i18n="name_skip">略過</button><button class="btn y" type="submit" data-i18n="name_gate_submit">查看菜單</button></div></form></div>
    <div id="order-content" class="hidden">
      <div class="card" id="orders-card"></div>
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px"><span class="muted"><span data-i18n="ordering_as">點餐稱呼</span>：<b id="name-display"></b></span><button class="btn ghost sm" type="button" id="name-edit-btn" data-i18n="name_edit">更改</button></div>
      <div class="menu-status" id="menu-shift"><div><b class="title-icon"><svg class="ico" aria-hidden="true"><use href="#i-clock"></use></svg><span data-i18n="current_menu">目前菜單</span></b><small id="menu-hours">依台北時間顯示目前供應品項</small></div></div>
      <div id="menu"></div>
      <p class="notice" id="alcohol-notice" data-i18n="alcohol" hidden>未滿十八歲禁止飲酒。禁止酒駕。</p>
    </div>
  </section>
</main>

<!-- 底部列：有還沒送出的品項→主鍵是「送出點餐」（黃底）、結帳退為白底；全部送出了→主鍵回「用餐完結帳」 -->
<div class="bar" id="bar" hidden><div class="s"><b id="bar-total">NT$0</b><small id="bar-count"></small></div><button class="btn ghost with-icon" id="open-cart"><svg class="ico" aria-hidden="true"><use href="#i-cart"></use></svg><span data-i18n="cart">已點清單</span></button><button class="btn y with-icon" id="bar-place" hidden><svg class="ico" aria-hidden="true"><use href="#i-bell"></use></svg><span data-i18n="place">送出點餐</span></button><button class="btn y with-icon" id="open-pay"><svg class="ico" aria-hidden="true"><use href="#i-receipt"></use></svg><span data-i18n="checkout">用餐完結帳</span></button></div>

<div class="sheet" id="cart"><div class="in">
  <div class="sheet-body" id="cart-body"><h3 class="title-icon"><svg class="ico lg" aria-hidden="true"><use href="#i-cart"></use></svg><span data-i18n="table_order">這桌的點餐</span></h3><div id="cart-lines"></div><div class="tot"><span data-i18n="unpaid_total">未結帳合計</span><span id="cart-total"></span></div><p class="place-hint" id="place-hint" hidden></p><p class="muted" id="pay-reminder" data-i18n="pay_reminder" hidden>離席前請到櫃檯結帳，工作人員會依這桌的明細收款。</p></div>
  <div class="row sheet-actions"><button class="btn ghost" data-close data-i18n="continue">繼續點</button><button class="btn y with-icon" id="cart-place" hidden><svg class="ico" aria-hidden="true"><use href="#i-bell"></use></svg><span data-i18n="place">送出點餐</span></button><button class="btn y with-icon" id="cart-pay"><svg class="ico" aria-hidden="true"><use href="#i-receipt"></use></svg><span data-i18n="checkout">用餐完結帳</span></button></div>
</div></div>


<div class="sheet" id="item-detail"><div class="in">
  <div id="detail-body"></div>
  <div class="row sheet-actions"><button class="btn ghost with-icon" type="button" data-close><svg class="ico" aria-hidden="true"><use href="#i-back"></use></svg><span data-i18n="back_step">上一步</span></button><button class="btn y" id="detail-add" type="button" data-i18n="add_to_cart">加入已點清單</button></div>
</div></div>

<div class="sheet" id="pay"><div class="in">
  <h3 class="title-icon"><svg class="ico lg" aria-hidden="true"><use href="#i-counter"></use></svg><span data-i18n="checkout_title">用餐完再到櫃檯結帳</span></h3>
  <p class="muted" data-i18n="checkout_hint">請先享用餐點；離席前帶著手機到櫃檯，工作人員會依這桌點餐明細結帳。</p>
  <div class="row" id="pay-scope"><label><input type="radio" name="scope" value="all" checked><svg class="ico" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="whole_table">全部付款</span></label><label><input type="radio" name="scope" value="mine"><svg class="ico" aria-hidden="true"><use href="#i-user"></use></svg><span data-i18n="my_items">各付各的</span></label><label><input type="radio" name="scope" value="split"><svg class="ico" aria-hidden="true"><use href="#i-split"></use></svg><span data-i18n="split_evenly">平均分攤</span></label></div>
  <p class="muted" id="pay-scope-hint"></p>
  <label class="split-box hidden" id="split-box"><svg class="ico" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="people">分攤人數</span><input id="split-people" type="number" inputmode="numeric" min="2" max="20" value="2"><span data-i18n="people_suffix">人</span></label>
  <div class="tot"><span class="title-icon"><svg class="ico" aria-hidden="true"><use href="#i-counter"></use></svg><span data-i18n="counter_amount">櫃檯結帳金額</span></span><span id="pay-amount"></span></div>
  <div class="split-result hidden" id="split-result"><div class="title-icon"><svg class="ico lg" aria-hidden="true"><use href="#i-split"></use></svg><b id="split-each"></b></div><span class="muted" id="split-note"></span></div>
  <div id="pay-off"><p class="muted" data-i18n="keep_screen">畫面可先保留，結帳時出示給櫃檯確認。</p><div class="row"><button class="btn y with-icon" type="button" id="pay-notify"><svg class="ico" aria-hidden="true"><use href="#i-counter"></use></svg><span data-i18n="notify_counter">通知櫃檯我要結帳</span></button><button class="btn ghost" data-close data-i18n="back">返回繼續點</button></div><div class="pay-sent hidden" id="pay-sent"><svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg><span id="pay-sent-text"></span><button class="btn ghost sm" type="button" id="pay-cancel" data-i18n="notify_cancel">取消</button></div></div>
</div></div>

<script src="/menu-lib.js"></script>
<script src="/order-lib.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var icon=function(name){return '<svg class="ico" aria-hidden="true"><use href="#i-'+esc(name)+'"></use></svg>';};
  var toastT;var toast=function(m,ms){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},ms||4000);};
  var money=function(n){return 'NT$'+Number(n||0).toLocaleString('zh-TW');};
  var qs=new URLSearchParams(location.search),T=qs.get('t')||'',K=qs.get('k')||'';
  var S=null,MENU=[],MENU_DOC=null,VENUE=null,CFG={},GUEST,NAME,seenReady={},pollTimer,LANG='zh',CURRENT_ITEM=null,CURRENT_QTY=1,PAUSED=null;
  try{GUEST=localStorage.getItem('order_guest');NAME=localStorage.getItem('order_name')||'';LANG=localStorage.getItem('order_lang')||'';}catch(e){}
  if(!LANG){var ql=qs.get('lang'),nl=(navigator.language||'').toLowerCase();LANG=ql==='en'||ql==='ja'?ql:(!ql&&/^ja/.test(nl)?'ja':(!ql&&!/^zh/i.test(nl)?'en':'zh'));}
  var tr=function(key,vars){return OrderLib.text(LANG,key,vars);};
  var label=function(obj){return LANG==='en'?(obj.en||obj.zh):LANG==='ja'?(obj.ja||obj.zh):obj.zh;};
  var noteOf=function(it){return LANG==='ja'&&it.note_ja?it.note_ja:it.note;};
  function applyLanguage(){
    document.documentElement.lang=LANG==='en'?'en':(LANG==='ja'?'ja':'zh-Hant');
    document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=tr(el.dataset.i18n);});
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=tr(el.dataset.i18nPlaceholder);});
    $('#lang-label').textContent=LANG==='zh'?'EN':(LANG==='en'?'日本語':'中文');
    if(S){renderMenu();renderState();refreshPayAmount();}
  }
  $('#lang-toggle').onclick=function(){LANG=LANG==='zh'?'en':(LANG==='en'?'ja':'zh');try{localStorage.setItem('order_lang',LANG);}catch(e){}applyLanguage();};
  applyLanguage();
  if(!GUEST){GUEST=Math.random().toString(36).slice(2,14)+Math.random().toString(36).slice(2,6);try{localStorage.setItem('order_guest',GUEST);}catch(e){}}
  var api=function(path,opt){opt=opt||{};return fetch('/api'+path,{method:opt.method||'GET',headers:opt.body?{'Content-Type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){var e=Error(d.error||('伺服器錯誤 '+r.status));e.status=r.status;throw e;}return d;});});};
  var fail=function(msg){$('#boot').innerHTML='<p class="err">'+esc(msg)+'</p>';$('#boot').classList.remove('hidden');};

  // 先輸入稱呼才看得到菜單：掃碼進來先過這關，點餐那一刻就不用再補填
  $('#name-in').value=NAME;
  function showGate(){$('#name-gate').classList.remove('hidden');$('#name-in').value=NAME;$('#name-in').focus();}
  function hideGate(){$('#name-gate').classList.add('hidden');}
  // 確認稱呼的那一下是使用者的點擊：順便把 iOS 的音效解鎖（之後出餐提示音才響得出來）
  function setName(v){
    NAME=v;try{localStorage.setItem('order_name',NAME);}catch(x){}
    $('#name-in').blur();hideGate();unlockAudio();
    $('#order-content').classList.remove('hidden');$('#name-display').textContent=NAME;
    if(S)renderState();
  }
  $('#name-form').onsubmit=function(e){
    e.preventDefault();
    var v=$('#name-in').value.trim().slice(0,20);if(!v)return;
    setName(v);
  };
  // 略過：以「桌號＋流水號」命名（同桌第幾位掃進來），例：A1-3；流水號＝這桌目前已出現的稱呼數＋1
  $('#name-skip').onclick=function(){
    var seen={};(S&&S.items||[]).forEach(function(l){if(l.by)seen[l.by]=1;});
    var n=Object.keys(seen).length+1,base=(S&&S.table)||T||'';
    var v=base+'-'+n;while(seen[v]){n++;v=base+'-'+n;}
    setName(v.slice(0,20));
  };
  $('#name-edit-btn').onclick=function(){showGate();};
  var needName=function(){if(NAME)return true;showGate();return false;};

  function renderMenu(){
    VENUE=MenuLib.activeVenue();
    // 估清／供應期間每次重繪都重算：店家按「今日估清」後，客人下一次更新菜單就點不到
    MENU=MENU_DOC?MenuLib.orderableOnly(MENU_DOC):[];
    var hours=VENUE==='CAFE'?(LANG==='en'?'at cafe · Serving now':LANG==='ja'?'在咖啡・提供中':'在咖啡・供應中'):VENUE==='BAR'?(LANG==='en'?'3AM · Serving now':LANG==='ja'?'三點水・提供中':'三點水・供應中'):(LANG==='en'?'Kitchen currently closed':LANG==='ja'?'現在は提供時間外です':'目前非供餐時段');
    var venueLabel=MenuLib.VENUE_LABEL[VENUE]||{zh:'言文字',en:'Emoji',ja:'言文字'};
    $('#brand').textContent=label(venueLabel);
    $('#menu-hours').textContent=PAUSED?PAUSED:hours;   // 店家暫停點餐：文案由後台設定，直接顯示
    $('#menu-shift').classList.toggle('paused',!!PAUSED);
    $('#menu-shift').hidden=!(PAUSED||!VENUE);   // 正常供應時不顯示「目前菜單」，只在暫停／非供餐時提示
    var items=MenuLib.sortItems(MENU.filter(function(it){return it.venue===VENUE;})),html='',venue='',cat='';
    items.forEach(function(it){
      if(it.venue!==venue){if(venue)html+='</div>';venue=it.venue;cat='';var v=MenuLib.VENUE_LABEL[venue]||{zh:venue,en:'',ja:venue};html+='<div class="venue">'+esc(label(v))+'<small>'+esc(LANG==='zh'?v.en:v.zh)+'</small></div><div>';}
      if(it.cat!==cat){cat=it.cat;var c=MenuLib.CAT_LABEL[cat]||{zh:cat,en:cat,ja:cat};html+='<h2>'+esc(label(c))+'</h2><div class="menu-grid">';}
      var next=items[items.indexOf(it)+1];
      var primary=label(it),secondary=LANG==='zh'?it.en:it.zh;
      html+='<button class="item add" data-open-item="'+esc(it.id)+'" aria-label="'+esc(tr('view_detail'))+' '+esc(primary)+'">'+(it.image?'<img src="'+esc(it.image)+'" alt="'+esc(primary)+'" loading="lazy">':'<div class="ph" aria-hidden="true">🍽</div>')+'<div class="n"><b>'+esc(primary)+'</b>'+(secondary?'<small>'+esc(secondary)+'</small>':'')+(noteOf(it)?'<small class="note">'+esc(noteOf(it))+'</small>':'')+'<div class="meta"><span class="p">'+money(it.price)+'</span><span class="tap">'+esc(tr('view_detail'))+'</span></div></div></button>';
      if(!next||next.cat!==cat){html+='</div>';}
    });
    if(venue)html+='</div>';
    $('#menu').innerHTML=html||'<p class="muted">'+esc(VENUE?tr('menu_unavailable'):tr('closed_message'))+'</p>';
    $('#alcohol-notice').hidden=!items.some(function(i){return i.alcohol;});
  }

  function optionGroups(it){return OrderLib.optionGroups(it,LANG);}
  function openItem(id){
    CURRENT_ITEM=MENU.find(function(it){return it.id===id;});CURRENT_QTY=1;if(!CURRENT_ITEM)return;
    var primary=label(CURRENT_ITEM),secondary=LANG==='zh'?CURRENT_ITEM.en:CURRENT_ITEM.zh,groups=optionGroups(CURRENT_ITEM);
    var html=(CURRENT_ITEM.image?'<img class="detail-img" src="'+esc(CURRENT_ITEM.image)+'" alt="'+esc(primary)+'">':'')+'<h3>'+esc(primary)+'</h3>'+(secondary?'<p class="muted" style="margin:0 0 6px">'+esc(secondary)+'</p>':'')+'<p class="detail-price">'+money(CURRENT_ITEM.price)+'</p>'+(noteOf(CURRENT_ITEM)?'<p class="detail-note">'+esc(noteOf(CURRENT_ITEM))+'</p>':'')+'<div class="opt"><div class="opt-title"><span>'+esc(tr('quantity'))+'</span></div><div class="qty"><button type="button" data-qty="-1">−</button><b id="detail-qty">1</b><button type="button" data-qty="1">＋</button></div></div>';
    html+=groups.map(function(g){return '<div class="opt" data-opt="'+esc(g.key)+'"><div class="opt-title"><span>'+esc(g.label)+'</span><small class="muted">'+esc(tr('required'))+'</small></div><div class="choice-grid">'+g.choices.map(function(c,i){return '<label><input type="radio" name="opt_'+esc(g.key)+'" value="'+esc(c)+'" '+(i===0?'checked':'')+'><span>'+esc(c)+'</span></label>';}).join('')+'</div></div>';}).join('');
    html+='<label class="opt note-field"><div class="opt-title"><span>'+esc(tr('special_request'))+'</span><small class="muted">'+esc(tr('optional'))+'</small></div><textarea id="detail-note" maxlength="80" placeholder="'+esc(tr('special_placeholder'))+'"></textarea></label>';
    $('#detail-body').innerHTML=html;$('#detail-body').scrollTop=0;openSheet('#item-detail');$('#detail-add').disabled=!!PAUSED;$('#detail-add').textContent=PAUSED?PAUSED:tr('add_to_cart');
    function syncOptions(){var picks={};groups.forEach(function(g){var r=document.querySelector('input[name="opt_'+g.key+'"]:checked');if(r)picks[g.key]=r.value;});var active=OrderLib.activeOptionGroups(groups,picks);groups.forEach(function(g){var el=document.querySelector('#detail-body [data-opt="'+g.key+'"]');if(el)el.hidden=active.indexOf(g)<0;});}
    document.querySelectorAll('#detail-body [data-opt] input').forEach(function(r){r.onchange=syncOptions;});syncOptions();
  }
  // 餐點詳情是「獨立頁面」：全螢幕蓋住菜單（不是底部彈窗），內容自己捲；開頁時 pushState，手機返回手勢＝上一步，
  // 回到菜單時整頁沒動過所以捲動位置保留。已點清單／結帳維持底部彈窗。
  var SHEET_OPEN=null;
  function openSheet(sel){
    if(SHEET_OPEN===sel)return;
    if(!SHEET_OPEN){try{history.pushState({sheet:sel},'');}catch(e){}}
    SHEET_OPEN=sel;document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('on');});
    $(sel).classList.add('on');document.body.classList.add('sheet-open');
  }
  function closeSheets(viaHistory){
    document.querySelectorAll('.sheet').forEach(function(s){s.classList.remove('on');});document.body.classList.remove('sheet-open');
    var was=SHEET_OPEN;SHEET_OPEN=null;
    if(was&&!viaHistory&&history.state&&history.state.sheet){try{history.back();}catch(e){}}
  }
  window.addEventListener('popstate',function(){if(SHEET_OPEN)closeSheets(true);});
  // 暫停點餐（公休、最後點餐、包場）：每 30 秒問一次；加菜被擋（423）時也同步狀態
  function loadPause(){return api('/orders/pause').then(function(p){var was=PAUSED;PAUSED=p.paused||null;if(was!==PAUSED){renderMenu();if(PAUSED)toast(PAUSED);}}).catch(function(){});}
  function loadMenuDoc(){return fetch('/api/public').then(function(r){return r.json();}).then(function(d){var raw=(d&&d.content&&d.content.menu)||'';if(raw!==(MENU_DOC&&MENU_DOC.__raw)){MENU_DOC=MenuLib.parseMenuDoc(raw);MENU_DOC.__raw=raw;renderMenu();}}).catch(function(){});}
  function optionNote(){
    var picks={};optionGroups(CURRENT_ITEM).forEach(function(g){var r=document.querySelector('input[name="opt_'+g.key+'"]:checked');if(r)picks[g.key]=r.value;});
    var parts=[];OrderLib.activeOptionGroups(optionGroups(CURRENT_ITEM),picks).forEach(function(g){parts.push(g.label+'：'+(picks[g.key]||g.choices[0]));});
    var extra=($('#detail-note')&&$('#detail-note').value.trim())||'';if(extra)parts.push(extra.slice(0,80));return parts.join('；');
  }

  var unpaid=function(){return (S.items||[]).filter(function(l){return !l.order_id;});};
  var mine=function(){return unpaid().filter(function(l){return l.mine;});};
  var pending=function(){return unpaid().filter(function(l){return !l.placed_at;});};   // 加了還沒送出的
  var othersPending=function(){return pending().filter(function(l){return !l.mine;});};   // 別人加了還沒送出的（我按送出會一起送）
  var itemName=function(l){return LANG==='en'?(l.en||l.zh):LANG==='ja'?(l.ja||l.zh):l.zh;};
  var joinItems=function(ls){return ls.map(function(l){return itemName(l)+'×'+l.qty;}).join(LANG==='en'?', ':'、');};
  // 「小華 2 項、阿明 1 項」
  var othersSummary=function(ls){var by={},order=[];ls.forEach(function(l){if(!by[l.by]){by[l.by]=0;order.push(l.by);}by[l.by]+=1;});return order.map(function(n){return n+' '+tr('n_items',{count:by[n]});}).join(LANG==='en'?', ':'、');};
  // 別人剛加／剛移除的品項：吐司提示＋該行閃一下（第一次載入只記錄）
  var KNOWN=null,FRESH={};
  function diffOthers(prev,next){
    if(!prev)return;
    var was={},now={};prev.forEach(function(l){if(!l.order_id)was[l.line]=l;});next.forEach(function(l){if(!l.order_id)now[l.line]=l;});
    var added=[],removed=[];
    Object.keys(now).forEach(function(k){if(!was[k]&&!now[k].mine)added.push(now[k]);});
    Object.keys(was).forEach(function(k){if(!now[k]&&!was[k].mine&&!was[k].placed_at)removed.push(was[k]);});
    added.forEach(function(l){FRESH[l.line]=true;});if(added.length)setTimeout(function(){added.forEach(function(l){delete FRESH[l.line];});},2000);
    var byName=function(ls,key){var g={},o=[];ls.forEach(function(l){if(!g[l.by]){g[l.by]=[];o.push(l.by);}g[l.by].push(l);});return o.map(function(n){return tr(key,{name:n,items:joinItems(g[n])});}).join('\n');};
    var msg=[added.length?byName(added,'someone_added'):'',removed.length?byName(removed,'someone_removed'):''].filter(Boolean).join('\n');
    if(msg)toast(msg,3500);
  }
  function applyState(s){var prev=S&&S.items;S=s;diffOthers(prev,s.items||[]);renderState();}
  var sum=function(ls){return ls.reduce(function(a,l){return a+l.price*l.qty;},0);};

  function renderState(){
    $('#table-no').textContent=tr('table')+' '+S.table;
    var u=unpaid(),p=pending();
    $('#bar').hidden=!NAME;$('#bar-total').textContent=money(sum(u));$('#bar-count').textContent=p.length?tr('pending_items',{count:p.length}):u.length?tr('unpaid_items',{count:u.length}):tr('empty');
    $('#open-pay').disabled=!u.length;$('#cart-pay').disabled=!u.length;
    // 有還沒送出的品項：主鍵變「送出點餐」，結帳退為白底（送出去才會進廚房）
    $('#bar').classList.toggle('has-place',p.length>0);$('#bar-place').hidden=!p.length;$('#cart-place').hidden=!p.length;
    // 送出鍵寫清楚會送幾項、有沒有包到別人的：「送出 5 項（含小華 2 項）」
    var op=othersPending(),placeText=op.length?tr('place_with_others',{count:p.length,others:othersSummary(op)}):tr('place_n',{count:p.length});
    ['#bar-place','#cart-place'].forEach(function(id){var el=$(id+' span[data-i18n]')||$(id+' span');if(el)el.textContent=placeText;});
    var hint=$('#place-hint');if(hint){hint.hidden=!op.length;hint.textContent=tr('others_pending_hint');}
    // 已點清單：依人分組；每行標示未送出／已送出／已出餐
    var tag=function(l){return l.served_at?'<span class="tag">'+esc(tr('served'))+'</span>':l.placed_at?'<span class="tag placed">'+esc(tr('placed'))+'</span>':'<span class="tag pending">'+esc(tr('not_sent'))+'</span>';};
    var groups={},order=[];u.forEach(function(l){var k=l.by+(l.mine?'#me':'');if(!groups[k]){groups[k]={by:l.by,mine:l.mine,lines:[]};order.push(k);}groups[k].lines.push(l);});
    $('#cart-lines').innerHTML=order.length?order.map(function(k){var g=groups[k];return '<div class="who"><span>'+esc(g.by)+(g.mine?'（'+esc(tr('me'))+'）':'')+'</span><span>'+money(sum(g.lines))+'</span></div>'+g.lines.map(function(l){var itemName=LANG==='en'?(l.en||l.zh):LANG==='ja'?(l.ja||l.zh):l.zh;var cls='line'+(!l.mine&&!l.placed_at?' others-pending':'')+(FRESH[l.line]?' fresh':'');return '<div class="'+cls+'"><span>'+esc(itemName)+' ×'+l.qty+tag(l)+(l.note?' <span class="by">'+esc(l.note)+'</span>':'')+'</span><span>'+money(l.price*l.qty)+(l.mine&&!l.placed_at?' <button class="x" data-del="'+esc(l.line)+'" aria-label="'+esc(tr('remove'))+'">✕</button>':'')+'</span></div>';}).join('');}).join(''):'<p class="muted">'+esc(tr('no_orders'))+'</p>';
    $('#cart-total').textContent=money(sum(u));
    // 有已送出但未結帳的品項：已點清單固定提醒離席前到櫃檯結帳
    $('#pay-reminder').hidden=!u.some(function(l){return l.placed_at;});
    if(SHEET_OPEN==='#pay')renderPayRequest();   // 輪詢到櫃檯已收款（需求消失）時同步畫面
    // 出餐單
    var os=S.orders||[],byId={};(S.items||[]).forEach(function(l){byId[l.line]=l;});
    $('#orders-card').classList.toggle('hidden',!os.length);
    $('#orders-card').innerHTML='<h3 class="title-icon">'+icon('receipt')+'<span>'+esc(tr('paid'))+'</span></h3>'+os.map(function(o){var st={paid:tr('preparing'),ready:tr('ready'),done:tr('done')}[o.status]||o.status,statusIcon=o.status==='paid'?'bell':'check';return '<div class="line"><span><span class="st '+esc(o.status)+'">'+icon(statusIcon)+esc(st)+'</span> '+o.lines.map(function(id){var l=byId[id];return l?esc(LANG==='en'?(l.en||l.zh):LANG==='ja'?(l.ja||l.zh):l.zh)+'×'+l.qty:'';}).filter(Boolean).join(LANG==='en'?', ':'、')+'</span><span>'+money(o.amount)+'</span></div>'+(o.status==='paid'&&CFG.vapid_public_key&&!o._pushed?'<div class="row"><button class="btn ghost sm with-icon" data-push="'+esc(o.id)+'">'+icon('bell')+'<span>'+esc(tr('notification_prompt'))+'</span></button></div>':'');}).join('');
    os.forEach(function(o){if(o.status==='ready'&&!seenReady[o.id]){seenReady[o.id]=true;notifyGuest(tr('ready_banner',{table:S.table}));}});
    // 桌邊送單出餐（品項層級）：POS 按某一道「出餐」→ 輪詢到該行新出現 served_at → 頁內橫幅＋提示音＋系統通知（有授權才會響）
    var newlyServed=[];(S.items||[]).forEach(function(l){if(l.served_at&&!l.order_id&&!seenServed[l.line]){seenServed[l.line]=true;if(SERVED_READY)newlyServed.push(l);}});
    SERVED_READY=true;   // 第一次載入只記錄、不通知（之前就出過的不該再響）
    if(newlyServed.length){var names=newlyServed.map(function(l){return (LANG==='en'?(l.en||l.zh):LANG==='ja'?(l.ja||l.zh):l.zh)+'×'+l.qty;}).join(LANG==='en'?', ':'、');notifyGuest(tr('served_banner',{table:S.table,items:names}));}
  }
  var seenServed={},SERVED_READY=false,AUDIO_CTX=null;
  // iOS 要先在使用者點擊時建立／恢復 AudioContext，之後才准播聲音；確認稱呼時叫一次
  function unlockAudio(){try{AUDIO_CTX=AUDIO_CTX||new (window.AudioContext||window.webkitAudioContext)();if(AUDIO_CTX.state==='suspended')AUDIO_CTX.resume();var b=AUDIO_CTX.createBuffer(1,1,22050),s=AUDIO_CTX.createBufferSource();s.buffer=b;s.connect(AUDIO_CTX.destination);s.start(0);}catch(e){}}
  function beep(){try{var c=AUDIO_CTX||new (window.AudioContext||window.webkitAudioContext)();AUDIO_CTX=c;if(c.state==='suspended')c.resume();var t=c.currentTime;[0,.25].forEach(function(d){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=d?1175:880;g.gain.value=.15;o.start(t+d);o.stop(t+d+.2);});}catch(e){}}
  // 頁內通知：黃色橫幅 15 秒＋震動＋提示音；有系統通知授權（Android／加入主畫面的 iOS）再多發一則，拒絕授權也照樣看得到橫幅
  function notifyGuest(text){
    var b=$('#ready-banner');b.textContent=text;b.classList.add('on');
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    beep();setTimeout(function(){b.classList.remove('on');},15000);
    try{if('Notification'in window&&Notification.permission==='granted'&&document.hidden)new Notification(tr('order'),{body:text,tag:'tth-serve'});}catch(e){}
  }
  // 一進桌邊點餐就請求通知權限（文件決議）；瀏覽器不支援或被拒絕都不影響頁內通知
  function askNotify(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(function(){});}catch(e){}}

  // 同裝置結帳後鎖定：這支手機的場結束後，舊分頁／書籤不再打 /orders/table（會自動開新場或併進下一組）
  var ENDED_KEY='order_ended_'+T;
  function endedId(){try{return localStorage.getItem(ENDED_KEY)||'';}catch(e){return '';}}
  function setEnded(id){try{if(id)localStorage.setItem(ENDED_KEY,id);}catch(e){}}
  function clearEnded(){try{localStorage.removeItem(ENDED_KEY);}catch(e){}}
  function showThanks(){
    if(ES){ES.close();ES=null;}S=null;clearTimeout(pollTimer);
    closeSheets(true);$('#bar').hidden=true;$('#app').classList.add('hidden');$('#boot').classList.add('hidden');
    $('#thanks').classList.remove('hidden');
  }
  function sessionClosed(s){setEnded((s&&s.id)||(S&&S.id)||'1');showThanks();}

  function load(){
    if(endedId()){showThanks();return Promise.resolve(null);}
    return api('/orders/table?t='+encodeURIComponent(T)+'&k='+encodeURIComponent(K)+'&g='+GUEST).then(function(s){var sid=S&&S.id;applyState(s);if(s.id!==sid)live();return s;});
  }
  function refresh(){if(!S)return Promise.resolve();return api('/orders/'+S.id+'?g='+GUEST).then(function(s){if(s.status!=='open'){sessionClosed(s);return;}applyState(s);}).catch(function(){});}
  // 即時同步：SSE 連上就推目前狀態，之後同桌任何異動（別人加點、送單、出餐、櫃檯收款）伺服器立刻推；瀏覽器自動重連。
  // 沒有 EventSource 或連不上時退回輪詢；SSE 正常時仍每 30 秒拉一次當保險（代理斷線但瀏覽器沒察覺）
  var ES=null,LIVE_OK=false;
  function live(){
    if(ES){ES.close();ES=null;}LIVE_OK=false;
    if(!('EventSource'in window)||!S)return;
    ES=new EventSource('/api/orders/'+encodeURIComponent(S.id)+'/live?g='+encodeURIComponent(GUEST));
    ES.addEventListener('session',function(e){LIVE_OK=true;try{var s=JSON.parse(e.data);if(s.status!=='open'){ES.close();ES=null;return sessionClosed(s);}applyState(s);}catch(x){}});
    ES.onerror=function(){LIVE_OK=false;};   // 瀏覽器會自己重連；期間 poll 以 5 秒補上
  }
  function poll(){clearTimeout(pollTimer);if(!S)return;pollTimer=setTimeout(function(){if(document.hidden||!S)return poll();refresh().then(poll);},LIVE_OK?30000:5000);}

  document.addEventListener('click',function(e){
    var oi=e.target.closest('[data-open-item]');if(oi){openItem(oi.dataset.openItem);return;}
    var qb=e.target.closest('[data-qty]');if(qb){CURRENT_QTY=Math.max(1,Math.min(20,CURRENT_QTY+Number(qb.dataset.qty||0)));$('#detail-qty').textContent=CURRENT_QTY;return;}
    var d=e.target.closest('[data-del]');if(d){api('/orders/'+S.id+'/items/'+d.dataset.del,{method:'DELETE',body:{guest:GUEST}}).then(function(s){applyState(s);}).catch(function(err){toast(err.message);});return;}
    var p=e.target.closest('[data-push]');if(p){subscribePush(p.dataset.push,p);return;}
    if(e.target.closest('[data-close]')||e.target.classList.contains('sheet'))closeSheets();   // 按「返回」或點遮罩外側都關閉
  });
  $('#detail-add').onclick=function(){if(!CURRENT_ITEM)return;if(!needName())return;var btn=this;btn.disabled=true;unlockAudio();api('/orders/'+S.id+'/items',{method:'POST',body:{item_id:CURRENT_ITEM.id,qty:CURRENT_QTY,by:NAME,guest:GUEST,note:optionNote()}}).then(function(s){applyState(s);btn.textContent='✓ '+tr('added');setTimeout(function(){closeSheets();btn.textContent=tr('add_to_cart');},450);}).catch(function(err){toast(err.message);if(/已結束/.test(err.message))sessionClosed();if(err.status===423){PAUSED=err.message;renderMenu();}if(/售完|下架/.test(err.message))loadMenuDoc();}).then(function(){btn.disabled=!!PAUSED;});};
  $('#open-cart').onclick=function(){$('#cart-body').scrollTop=0;openSheet('#cart');};
  $('#open-pay').onclick=$('#cart-pay').onclick=function(){$('#cart').classList.remove('on');openPay();};
  // 送出點餐：整桌還沒送的一起進出餐看板（不結帳）；送出後已點清單標「已送出」、不能再自己刪
  var placing=false;
  $('#bar-place').onclick=$('#cart-place').onclick=function(){if(placing||!pending().length)return;
    var op=othersPending();if(op.length&&!confirm(tr('place_confirm',{others:joinItems(op)})))return;
    placing=true;var btns=[$('#bar-place'),$('#cart-place')];btns.forEach(function(b){b.disabled=true;});
    api('/orders/'+S.id+'/place',{method:'POST',body:{guest:GUEST}}).then(function(s){applyState(s);closeSheets();toast(tr('place_done'),6000);try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}})
      .catch(function(err){toast(err.message);if(/已結束/.test(err.message))sessionClosed();if(err.status===423){PAUSED=err.message;renderMenu();}})
      .then(function(){placing=false;btns.forEach(function(b){b.disabled=false;});});};

  /* ---- 用餐完櫃檯結帳提醒／AA 分帳 ---- */
  function payScopeLines(){var scope=document.querySelector('input[name=scope]:checked').value;return scope==='mine'?mine():unpaid();}
  function refreshPayAmount(){
    if(!S)return;
    var scope=document.querySelector('input[name=scope]:checked').value,ls=payScopeLines(),isSplit=scope==='split';
    $('#pay-amount').textContent=money(sum(ls));
    $('#pay-scope-hint').textContent=scope==='mine'?tr('my_items_hint'):isSplit?tr('split_hint'):'';
    $('#split-box').classList.toggle('hidden',!isSplit);$('#split-result').classList.toggle('hidden',!isSplit);
    if(isSplit){
      var people=Math.max(2,Math.min(20,Number($('#split-people').value)||2));$('#split-people').value=people;
      var split=OrderLib.splitBill(sum(ls),people);
      $('#split-each').textContent=tr('split_each')+' '+money(split.base);
      $('#split-note').textContent=split.remainder?tr('split_remainder',{count:split.remainder}):'';
    }
  }
  document.querySelectorAll('input[name=scope]').forEach(function(r){r.onchange=refreshPayAmount;});
  $('#split-people').oninput=refreshPayAmount;
  // 通知櫃檯：把現在選的範圍送到 POS。全部付款／各付各的＝櫃檯桌號畫面一點就勾好那幾項；平均分攤＝帶人數，櫃檯依人數分次收款（每人一張單）
  function renderPayRequest(){
    var pr=S&&S.pay_request;
    $('#pay-sent').classList.toggle('hidden',!pr);$('#pay-notify').hidden=!!pr;
    if(pr){var ls=unpaid().filter(function(l){return pr.lines.indexOf(l.line)>=0;});$('#pay-sent-text').textContent=pr.scope==='split'&&pr.people?tr('notify_sent_split',{people:pr.people,each:money(OrderLib.splitBill(sum(ls),pr.people).base)}):tr('notify_sent',{amount:money(sum(ls)),count:ls.length});}
  }
  $('#pay-notify').onclick=function(){
    var scope=document.querySelector('input[name=scope]:checked').value,ls=scope==='mine'?mine():unpaid();
    if(!ls.length)return;var btn=this;btn.disabled=true;
    var people=scope==='split'?Math.max(2,Math.min(20,Number($('#split-people').value)||2)):undefined;
    api('/orders/'+S.id+'/pay-request',{method:'POST',body:{guest:GUEST,name:NAME,scope:scope==='mine'?'mine':scope==='split'?'split':'all',people:people,lines:scope==='mine'?ls.map(function(l){return l.line;}):[]}})
      .then(function(s){S=s;renderState();renderPayRequest();toast(tr('notify_done'),5000);try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}})
      .catch(function(err){toast(err.message);if(/已結束/.test(err.message))sessionClosed();}).then(function(){btn.disabled=false;});
  };
  $('#pay-cancel').onclick=function(){api('/orders/'+S.id+'/pay-request',{method:'DELETE',body:{guest:GUEST}}).then(function(s){S=s;renderState();renderPayRequest();}).catch(function(err){toast(err.message);});};
  function openPay(){
    openSheet('#pay');
    var mineRadio=document.querySelector('input[name=scope][value=mine]'),hasSeparateMine=mine().length&&mine().length<unpaid().length;
    mineRadio.parentNode.style.display=hasSeparateMine?'':'none';
    if(mineRadio.checked&&!hasSeparateMine)document.querySelector('input[name=scope][value=all]').checked=true;
    refreshPayAmount();renderPayRequest();
  }

  /* ---- 取餐推播（不登入） ---- */
  function subscribePush(orderId,btn){
    if(!('serviceWorker'in navigator)||!('PushManager'in window)){toast(tr('notification_unsupported'));return;}
    btn.disabled=true;
    var vapid=CFG.vapid_public_key,key=Uint8Array.from(atob(vapid.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(vapid.length/4)*4,'=')),function(c){return c.charCodeAt(0);});
    navigator.serviceWorker.register('/event-push-sw.js').then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});});})
      .then(function(sub){return api('/orders/'+S.id+'/push',{method:'POST',body:{order_id:orderId,subscription:sub.toJSON()}});})
      .then(function(){(S.orders||[]).forEach(function(o){if(o.id===orderId)o._pushed=true;});btn.textContent=tr('notification_on');})
      .catch(function(err){toast(tr('notification_error',{message:err.message}));btn.disabled=false;});
  }

  function bootApp(r){
    if(endedId()||!S){if(endedId())showThanks();return;}
    CFG=r[0];var content=(r[1]&&r[1].content)||{};PAUSED=(r[3]&&r[3].paused)||null;
    MENU_DOC=MenuLib.parseMenuDoc(content.menu||'');MENU_DOC.__raw=content.menu||'';
    $('#thanks').classList.add('hidden');$('#boot').classList.add('hidden');$('#app').classList.remove('hidden');
    if(NAME){hideGate();$('#order-content').classList.remove('hidden');$('#name-display').textContent=NAME;}else{showGate();}
    askNotify();
    renderMenu();renderState();live();poll();
  }
  $('#thanks-again').onclick=function(){
    clearEnded();$('#thanks').classList.add('hidden');$('#boot').classList.remove('hidden');
    Promise.all([api('/orders/config'),fetch('/api/public').then(function(r){return r.json();}),load(),api('/orders/pause').catch(function(){return {};})]).then(bootApp).catch(function(err){fail(err.message);});
  };
  /* ---- 啟動 ---- */
  if(!T||!K)return fail('請掃描桌上的 QR Code 進入點餐。');
  if(endedId())showThanks();
  else Promise.all([api('/orders/config'),fetch('/api/public').then(function(r){return r.json();}),load(),api('/orders/pause').catch(function(){return {};})]).then(bootApp).catch(function(err){fail(err.message);});
  setInterval(function(){if(S&&MenuLib.activeVenue()!==VENUE)renderMenu();},60000); // 17:00／03:00／08:00 換品牌
  setInterval(function(){if(S)loadPause();},30000);setInterval(function(){if(S)loadMenuDoc();},60000);   // 暫停點餐、估清／特餐隨店家設定更新
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S){refresh();if(!ES||ES.readyState===2)live();}});
})();
</script>
