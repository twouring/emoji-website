<style>
:root{--paper:#FBFAF6;--card:#fff;--ink:#1B1A17;--muted:#6B6558;--line:#E4E0D6;--accent:#FFDE34;--danger:#9F2A1E}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.7}.skip-link{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:100}.skip-link:focus{left:8px}.wrap{width:min(100%,720px);margin:auto;padding:0 20px}.reserve-hero{padding:42px 0 18px}.reserve-hero h1{font-family:"Noto Serif TC",serif;font-size:clamp(2rem,9vw,3.4rem);line-height:1.12;margin:0;letter-spacing:.03em}.reserve-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px -48px rgba(27,26,23,.45);padding:22px;margin:18px 0 40px}.grid{display:grid;gap:14px}.field{display:grid;gap:6px}.field span,.legend{font-weight:700}.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #D8D2C5;border-radius:14px;padding:13px 14px;min-height:50px;appearance:none}.field textarea{resize:vertical;min-height:88px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot-group{margin-top:10px}.slot-group h3{font-size:1rem;margin:0 0 8px;color:#3A362E}.slot-group h3 small{font-size:1rem;font-weight:400;color:var(--muted);margin-left:6px}.chip{position:relative}.chip input{position:absolute;opacity:0;inset:0}.chip span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #D8D2C5;border-radius:12px;background:#fff;font-weight:700;font-variant-numeric:tabular-nums}.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}.chip input:disabled+span{opacity:.35;text-decoration:line-through}.chip input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}.chips--party{grid-template-columns:repeat(6,1fr)}.hint{font-size:1rem;color:var(--muted);margin:0}.hint a{color:var(--ink);font-weight:700}.actions{display:grid;gap:10px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;min-height:54px;padding:14px 18px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.btn-primary{background:var(--accent);color:var(--ink)}.btn-primary:disabled{opacity:.55;cursor:wait}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.status{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;display:none}.status.ok{display:block;background:#EAF4E7;color:#24512B}.status.err{display:block;background:#FBEDEB;color:var(--danger)}.done{display:none;text-align:left}.done h2{font-family:"Noto Serif TC",serif;font-size:1.8rem;line-height:1.25;margin:4px 0 10px}.done .summary{background:#F4F1EA;border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0 0}.chips--purpose{grid-template-columns:repeat(3,1fr)}.chips--purpose .chip span{min-height:52px;padding:6px 8px;text-align:center;line-height:1.35;word-break:keep-all}.chips--date{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x proximity}.chips--date::-webkit-scrollbar{display:none}.chips--date .chip{flex:0 0 74px;scroll-snap-align:start}.chips--date .chip span{flex-direction:column;min-height:62px;line-height:1.25}.chip span small{display:block;font-size:1rem;font-weight:400;color:inherit;opacity:.75}.venue-info{margin:2px 0 0;padding:10px 14px;border-radius:12px;background:#F4F1EA;color:#3A362E;font-size:1rem;line-height:1.6}.date-more{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted)}.date-more input{flex:1;min-height:46px}.reserve-card .actions{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 18px);padding-top:18px;margin-top:0}.reserve-card .btn-primary{white-space:normal;line-height:1.35}.done .actions{position:static;background:none}.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.legend{display:flex;align-items:center;gap:8px}.chips--purpose .chip span{flex-direction:column;gap:6px;min-height:84px}.chips--purpose .ico{width:32px;height:32px}.slot-group h3{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}.slot-group h3 small{margin-left:0}.slot-group h3 .ico{width:20px;height:20px;color:var(--muted)}.reserve-hero .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}.reserve-hero h1{word-break:keep-all;min-width:0}.hero-art{width:clamp(120px,36vw,240px);height:auto;flex:none;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.done h2{display:flex;align-items:center;gap:10px}.done h2 .ico{width:32px;height:32px}.btn .ico{margin-right:8px}@media(max-width:520px){.wrap{padding:0 16px}.reserve-hero{padding-top:28px}.reserve-card{border-radius:20px;padding:18px;margin-bottom:28px}.chips{grid-template-columns:repeat(3,1fr)}.chips--party{grid-template-columns:repeat(3,1fr)}.reserve-hero h1{font-size:2.45rem}.chips--purpose{grid-template-columns:repeat(2,1fr)}}@media(max-width:360px){.reserve-hero h1{font-size:2.1rem}.hero-art{width:120px}}

<body>
<a href="#content" class="skip-link">Skip to content</a>
<!--SITE_HEADER-->
<main id="content">
<section class="reserve-hero">
  <div class="wrap">
    <h1>Book a table</h1>
  </div>
</section>
<section class="wrap">
  <div class="reserve-card">
    <form id="reserveForm" novalidate>
      <div class="grid">
        <div class="field"><span class="legend">What brings you in?</span>
          <div class="chips chips--purpose" id="purposeChips" role="radiogroup" aria-label="Occasion"></div>
          <p class="venue-info" id="venueInfo" aria-live="polite"></p>
        </div>
        <div class="field"><span class="legend">Which day?</span>
          <div class="chips chips--date" id="dateChips" role="radiogroup" aria-label="Date"></div>
          <label class="date-more">Another date<input name="date" type="date" required></label>
        </div>
        <div class="field"><span class="legend">What time?</span>
          <div id="slotGroups" role="radiogroup" aria-label="Time slot"></div>
        </div>
        <div class="field"><span class="legend">How many?</span><div class="chips chips--party" role="radiogroup" aria-label="Guests"><label class="chip"><input type="radio" name="party_size" value="1" required><span>1</span></label><label class="chip"><input type="radio" name="party_size" value="2" required><span>2</span></label><label class="chip"><input type="radio" name="party_size" value="3" required><span>3</span></label><label class="chip"><input type="radio" name="party_size" value="4" required><span>4</span></label><label class="chip"><input type="radio" name="party_size" value="5" required><span>5</span></label><label class="chip"><input type="radio" name="party_size" value="6" required><span>6</span></label></div><p class="hint">For 7 or more, please call <a href="tel:+886921102067">+886 921 102 067</a></p></div>
        <label class="field"><span>Name</span><input name="name" autocomplete="name" maxlength="80" required placeholder="e.g. Alex Chen"></label>
        <label class="field"><span>Mobile</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="32" required placeholder="+886 912 345 678"></label>
        <label class="field"><span>Email (for your confirmation)</span><input name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"></label>
        <label class="field"><span>Notes (optional)</span><textarea name="note" maxlength="500" placeholder="e.g. high chair, birthday, no beef"></textarea></label>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Book now</button>
      </div>
      <div id="reserveStatus" class="status" role="status" aria-live="polite"></div>
    </form>
    <div id="reserveDone" class="done" aria-live="polite">
      <h2>You’re booked</h2>
      <p>Confirmation sent. We hold your table for 10 minutes after your booking time — running late? Give us a call.</p>
      <div class="summary" id="reserveSummary"></div>
      <div class="actions"><a class="btn btn-primary" href="https://maps.app.goo.gl/aFdoEB3RhweCqLbQ9" target="_blank" rel="noopener">Open in Google Maps</a><a class="btn btn-ghost" href="tel:+886921102067">Call +886 921 102 067</a></div>
    </div>
  </div>
</section>
</main>
<!--SITE_FOOTER-->
</body>
</html>
