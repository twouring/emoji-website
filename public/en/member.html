<style>
  /* member 專頁：沿用 CIS token，僅補版面；頂欄改共用 site-nav */
  .m-wrap{max-width:440px;margin:0 auto;padding:24px 18px 96px;min-height:calc(100vh - 70px)}
  @media (min-width:720px){
    .m-wrap{max-width:720px;padding:40px 24px 96px}
  }
  .m-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:40px 36px}
  .m-hi{font-family:var(--serif);font-size:1.7rem;font-weight:500;margin-bottom:.2em}
  .m-sub{color:var(--muted);margin-bottom:2rem}
  .m-row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
  .m-row b{font-weight:500}
  .m-row span{color:var(--ink-soft)}
  .m-sec-title{font-family:var(--serif);font-size:1.15rem;margin:2.4rem 0 .8rem}
  .m-upd{padding:14px 0;border-top:1px solid var(--line)}
  .m-upd h4{font-weight:500;font-size:1rem;margin-bottom:.2em}
  .m-upd time{color:var(--muted);font-size:1rem}
  .m-upd p{color:var(--ink-soft);font-size:1rem;margin-top:.4em;white-space:pre-wrap}
  .m-empty{color:var(--muted);padding:14px 0;border-top:1px solid var(--line)}
  .m-ev{padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .m-ev h4{font-weight:500;font-size:1rem;margin-bottom:.2em}
  .m-ev .meta{color:var(--muted);font-size:1rem}
  .m-ev p{color:var(--ink-soft);font-size:1rem;margin-top:.4em;white-space:pre-wrap}
  .m-ev .act{flex:0 0 auto;align-self:center}
  .m-ev .full{color:var(--muted);font-size:1rem}
  .m-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:2.4rem}
  .m-google{display:inline-flex;align-items:center;gap:.7em}
  .m-google svg{width:20px;height:20px}
  .m-center{text-align:center}
  .m-card>.m-center::before{content:"";display:block;width:88px;height:88px;margin:0 auto 18px;background:url('/cis/assets/moji/moji-mark.svg') center/contain no-repeat}
  .m-note{color:var(--muted);font-size:1rem;margin-top:1.2rem}
  .m-access{margin:1.4rem 0 0;padding:18px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper)}
  .m-access-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .m-access h3{font-family:var(--serif);font-size:1.15rem;margin:0 0 .25rem}
  .m-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.28em .75em;color:var(--ink-soft);font-size:1rem;background:var(--paper)}
  .m-pill.on{border-color:var(--ink);color:var(--ink);background:var(--paper)}
  .m-access-list{margin:.9rem 0 0;padding-left:1.15rem;color:var(--ink-soft);font-size:1rem}
  .m-access-list li{margin:.32rem 0}
  .m-qr{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
  .m-qr img{display:block;margin:.8rem auto 0;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
  .m-token{display:block;margin-top:.6rem;padding:.8rem;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink-soft);font-size:1rem;line-height:1.45;word-break:break-all;white-space:pre-wrap}
  /* 創始會員勳章（CIS：印章＋唯一黃） */
  .m-badge{display:inline-flex;align-items:center;gap:.65em;margin:.2rem 0 1.6rem;padding:.5em .95em .5em .55em;
    border:1px solid var(--ink);border-radius:999px;background:rgba(255,222,52,.18)}
  .m-badge .m-seal{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
    background:#FFDE34;color:#1B1A17;font-family:var(--serif);font-weight:700;font-size:1rem;border:1px solid #1B1A17}
  .m-badge .m-bt{line-height:1.25}
  .m-badge .m-bt b{font-family:var(--serif);font-weight:700;letter-spacing:.04em}
  .m-badge .m-bt small{display:block;color:var(--muted);font-size:1rem;letter-spacing:.02em}
  .m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
  .m-eyebrow{font-size:1rem;letter-spacing:.14em;color:var(--muted)}
  .m-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:5px 7px 5px 10px;
    border:1px solid var(--ink);border-radius:999px;background:var(--card);font-size:1rem;font-weight:600;
    cursor:pointer;font-family:inherit;color:inherit}
  .m-chip:disabled{opacity:.55;cursor:default}
  .m-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);border:1px solid var(--ink)}
  .m-chip .dot.on{background:var(--accent)}
  .m-chip .qr-ico{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);background:var(--paper);
    display:grid;place-items:center}
  .m-notice{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--radius-sm);padding:12px 14px;background:var(--paper-alt);
    margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .m-panel{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;background:var(--card);
    position:relative;overflow:hidden;margin-bottom:14px}
  .m-panel::after{display:none}
  .m-progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .m-progress>i{display:block;height:100%;background:var(--ink);border-radius:99px}
  .m-meta{display:flex;justify-content:space-between;gap:10px;font-size:1rem;color:var(--muted);margin-bottom:14px}
  .m-stat-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:8px;margin-bottom:12px}
  .m-stat{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 12px;text-align:center;background:var(--paper)}
  .m-stat--hi{border-color:var(--ink);background:var(--paper-alt)}
  .m-stat b{display:block;font-family:var(--latin);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
  .m-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .m-btn-row .btn{justify-content:center;width:100%;box-sizing:border-box}
  .m-quiet{opacity:.75;margin:22px 0}
  .m-overlay{position:fixed;inset:0;background:rgba(27,26,23,.9);color:var(--paper);z-index:80;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .m-overlay[hidden]{display:none!important}
  .m-overlay .x{position:absolute;top:16px;right:18px;border:0;background:transparent;color:inherit;
    font-size:1.6rem;cursor:pointer;opacity:.7}
  .m-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;
    background:var(--ink);color:var(--paper);padding:.75em 1.2em;border-radius:var(--radius-sm);
    font-size:1rem;max-width:min(420px,92vw);box-shadow:var(--shadow)}
  .m-toast[hidden]{display:none!important}
  .m-drawer{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-top:12px;background:var(--paper)}
  .m-drawer[hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){
    .m-chip .dot.on{animation:none}
  }
</style>

  const T = I18N[LANG] || I18N.zh;
  const card = document.getElementById('card');
  const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('m-toast');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  }
  let qrTimer = null;
  let qrEnabled = false;

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('token')) {
    localStorage.setItem(KEY, hash.get('token'));
    history.replaceState(null, '', location.pathname + location.search);
  }
  const token = localStorage.getItem(KEY);

  const loginBtn = redirect =>
    `<a class="btn btn--solid m-google" href="${FELLOW}/auth/google?redirect=${encodeURIComponent(redirect)}">
       <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.3 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.5 28.3c-.5-1.4-.8-2.9-.8-4.3s.3-3 .8-4.3l-7.9-6.1C1 16.9 0 20.3 0 24s1 7.1 2.6 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.1-5.5c-2 1.3-4.6 2.1-7.9 2.1-6.4 0-11.7-3.7-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
       ${T.loginBtn}
     </a>`;

  const planName = p => T.plans[p] || p || T.plans.fallback;

  function fmtTime(v) {
    if (!v) return '';
    const d = new Date(v);
    if (Number.isNaN(+d)) return String(v);
    return d.toLocaleString(T.locale, {
      timeZone: 'Asia/Taipei',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false,
    });
  }

  function entitlementLine(e, pending) {
    if (pending) return `${esc(planName(e.plan))}：${T.pendingActivate}`;
    const range = [fmtTime(e.starts_at), fmtTime(e.ends_at)].filter(Boolean).join(' – ');
    return `${esc(planName(e.plan))}${range ? '：' + esc(range) : ''}`;
  }

  const QR_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 17h3v4h-4v-3h4M18 14h3v3"></path></svg>';

  // sync with lib/member-ui.js
  function parseTime(v) {
    if (!v) return null;
    const d = new Date(v);
    return Number.isNaN(+d) ? null : d;
  }
  function pickNextEvent(events, now = new Date()) {
    const list = Array.isArray(events) ? events : [];
    const upcoming = list
      .map((e) => ({ e, t: parseTime(e.starts_at) }))
      .filter((x) => x.t && x.t > now)
      .sort((a, b) => a.t - b.t);
    const registered = upcoming.find((x) => x.e.registered);
    if (registered) return registered.e;
    return upcoming.length ? upcoming[0].e : null;
  }
  /** @param {{ active: boolean, planLabel: string, pending: boolean, hadEntitlement: boolean }} s */
  function membershipStatusTitle(s, T) {
    if (s.active) return T.statusActive(s.planLabel || T.plansFallback || '');
    if (s.pending) return T.statusPending;
    if (s.hadEntitlement) return T.statusExpired;
    return T.statusNone;
  }

  function fmtDate(d) {
    if (!d) return '';
    return d.toLocaleDateString(T.locale, {
      timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    });
  }

  function renderNotice(events) {
    const ev = pickNextEvent(events);
    if (!ev) return '';
    return `<section class="m-notice" aria-label="${esc(T.nextEvent)}">
      <div>
        <div class="m-eyebrow" style="letter-spacing:.14em">${esc(T.nextEvent)}</div>
        <div style="font-family:var(--serif);font-size:1.05rem;font-weight:600;margin-top:2px">${esc(ev.title)}</div>
        <div class="m-note" style="margin:2px 0 0">${esc(ev.starts_at || T.timeTbd)}${ev.location ? ' · ' + esc(ev.location) : ''}${ev.registered ? ' · ' + esc(T.registered) : ''}</div>
      </div>
      <a class="btn btn--solid" href="#m-events" style="padding:.55em 1em;font-size:1rem">${esc(T.viewEvent)}</a>
    </section>`;
  }

  function renderStatus(data) {
    const access = data.access || {};
    const activeEntitlements = Array.isArray(access.activeEntitlements) ? access.activeEntitlements : [];
    const pending = Array.isArray(access.pending) ? access.pending : [];
    const entitlements = Array.isArray(access.entitlements) ? access.entitlements : [];
    const c = (data.commitments || [])[0];
    const active = !!access.active;
    const primaryEnt = activeEntitlements[0] || pending[0] || null;
    const planLabel = primaryEnt ? planName(primaryEnt.plan) : (c ? planName('founding') : '');
    const hadEntitlement = entitlements.length > 0 || !!c;
    const title = membershipStatusTitle({ active, planLabel, pending: pending.length > 0, hadEntitlement }, T);

    let startsAt = null, endsAt = null;
    if (activeEntitlements[0] && activeEntitlements[0].starts_at && activeEntitlements[0].ends_at) {
      startsAt = parseTime(activeEntitlements[0].starts_at);
      endsAt = parseTime(activeEntitlements[0].ends_at);
    } else if (c && c.start_date && c.maturity_date) {
      startsAt = parseTime(c.start_date);
      endsAt = parseTime(c.maturity_date);
    }

    const now = new Date();
    let progressHtml = '';
    let leftMeta = '';
    if (startsAt && endsAt && endsAt > startsAt) {
      const pct = Math.min(100, Math.max(0, ((now - startsAt) / (endsAt - startsAt)) * 100));
      const daysLeft = Math.max(0, Math.ceil((endsAt - now) / 86400000));
      progressHtml = `<div class="m-progress"><i style="width:${pct.toFixed(1)}%"></i></div>`;
      leftMeta = daysLeft > 0 ? T.daysLeft(daysLeft) : T.statusExpired;
    } else if (pending.length) {
      leftMeta = T.pendingActivate;
    }

    const periodText = startsAt && endsAt ? `${fmtDate(startsAt)} – ${fmtDate(endsAt)}` : '';
    const rightMeta = [planLabel, periodText].filter(Boolean).join(' · ');
    const metaHtml = (leftMeta || rightMeta)
      ? `<div class="m-meta"><span>${esc(leftMeta)}</span><span>${esc(rightMeta)}</span></div>`
      : '';

    const certLine = c && c.cert_no ? ` · No. ${esc(c.cert_no)}` : '';
    const primaryLabel = (!active && !pending.length && !hadEntitlement) ? T.buyMembership : T.renewUpgrade;

    const plansDrawerRows = ['founding', 'day_4h', 'day_12h', 'month', 'quarter', 'year'].map((id) => {
      if (id === 'founding') {
        return `<div class="m-row"><b>${esc(T.plans.founding)}</b><span><a href="${FELLOW_PATH}" style="text-decoration:underline;text-underline-offset:3px">${esc(T.joinFounder)}</a></span></div>`;
      }
      return `<div class="m-row"><b>${esc(T.plans[id])}</b><span><button type="button" class="btn btn--ghost" data-plan="${id}" style="padding:.35em .9em;font-size:1rem">${esc(T.buyPlanBtn(PLAN_PRICES[id]))}</button></span></div>`;
    }).join('');

    return `<section class="m-panel" aria-label="${esc(T.statusLabel)}">
      <div class="m-eyebrow">${esc(T.statusLabel)}${certLine}</div>
      <div style="font-family:var(--serif);font-size:1.2rem;font-weight:600;margin:.2em 0 .7em">${esc(title)}</div>
      ${progressHtml}
      ${metaHtml}
      <div class="m-btn-row">
        <button type="button" class="btn btn--solid" id="m-plans-primary">${esc(primaryLabel)}</button>
        <button type="button" class="btn btn--ghost" id="m-plans-toggle">${esc(T.planDetails)}</button>
      </div>
      <div class="m-drawer" id="m-plans-drawer" hidden>${plansDrawerRows}</div>
    </section>`;
  }

  function renderAccessChip(data) {
    const access = data.access || {};
    const activeEntitlements = Array.isArray(access.activeEntitlements) ? access.activeEntitlements : [];
    const pending = Array.isArray(access.pending) ? access.pending : [];
    const canIssue = activeEntitlements.length || pending.length;
    const active = !!access.active;
    const label = active ? T.activeShort : (pending.length ? T.pendingShort : T.inactiveShort);
    return `<button type="button" class="m-chip" id="m-access-chip" aria-label="${esc(T.accessLabel)}"${canIssue ? '' : ' data-blocked="1"'}>
      <span class="dot${active ? ' on' : ''}"></span>
      <span>${esc(label)}</span>
      <span class="qr-ico">${QR_ICON}</span>
    </button>`;
  }

  function openQrOverlay() {
    const ov = document.getElementById('m-qr-overlay');
    if (!ov) return;
    ov.hidden = false;
    startQrRefresh(true);
  }
  function closeQrOverlay() {
    const ov = document.getElementById('m-qr-overlay');
    if (ov) ov.hidden = true;
    stopQrRefresh();
  }
  const qrOverlayEl = document.getElementById('m-qr-overlay');
  const qrCloseBtn = document.getElementById('m-qr-close');
  if (qrCloseBtn) qrCloseBtn.onclick = closeQrOverlay;
  if (qrOverlayEl) qrOverlayEl.addEventListener('click', e => { if (e.target === qrOverlayEl) closeQrOverlay(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && qrOverlayEl && !qrOverlayEl.hidden) closeQrOverlay();
  });

  function stopQrRefresh() {
    qrEnabled = false;
    if (qrTimer) clearInterval(qrTimer);
    qrTimer = null;
  }

  function qrDataUrl(text) {
    return new Promise((resolve, reject) => {
      if (!window.QRCode || typeof window.QRCode.toDataURL !== 'function') {
        reject(new Error('QRCode unavailable'));
        return;
      }
      window.QRCode.toDataURL(text, { width: 200, margin: 1 }, (err, url) => {
        if (err) reject(err); else resolve(url);
      });
    });
  }

  async function refreshQr() {
    const img = document.getElementById('m-qr-overlay-img');
    const meta = document.getElementById('m-qr-overlay-meta');
    if (!img || !meta || !qrEnabled) return;
    try {
      const r = await fetch(FELLOW + '/api/me/access-qr', { headers: { authorization: 'Bearer ' + token } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        img.style.display = 'none';
        meta.textContent = d.error || T.qrFail;
        return;
      }
      img.style.display = '';
      img.src = await qrDataUrl(d.token);
      const exp = d.exp ? fmtTime(d.exp * 1000) : '';
      meta.textContent = `${planName(d.plan)}${d.pending_activation ? T.qrPending : ''}${exp ? T.qrUntil + exp : ''}`;
    } catch (e) {
      if (img) img.style.display = 'none';
      if (meta) meta.textContent = T.qrOffline;
    }
  }

  function startQrRefresh(enabled) {
    stopQrRefresh();
    if (!enabled) return;
    qrEnabled = true;
    refreshQr();
    qrTimer = setInterval(refreshQr, 30000);
  }

  function renderLoggedOut() {
    stopQrRefresh();
    card.innerHTML = `
      <div class="m-center">
        <h1 class="m-hi">${T.loginTitle}</h1>
        <p class="m-sub">${T.loginSub}</p>
        ${loginBtn(location.origin + MEMBER_PATH + location.search)}
        <p class="m-note">${T.loginNote}</p>
      </div>`;
  }

  function renderFoundingLine(c) {
    if (c) {
      return `<p class="m-quiet">${esc(T.badgeName)}${c.cert_no ? ' · No. ' + esc(c.cert_no) : ''}</p>`;
    }
    return `<p class="m-quiet">${esc(T.notFounder)}
      <a href="${FELLOW_PATH}" style="text-decoration:underline;text-underline-offset:3px">${esc(T.joinFounder)}</a></p>`;
  }

  function renderMember(data) {
    const me = data.me || {};
    const c = (data.commitments || [])[0];

    const updates = (data.updates || []).map(u => `
      <div class="m-upd"><h4>${esc(u.title)}</h4><time>${esc(u.published_at)}｜${esc(u.type)}</time>
        ${u.content ? `<p>${esc(u.content)}</p>` : ''}</div>`).join('')
      || `<div class="m-empty">${T.noUpdates}</div>`;

    const events = (data.events || []).map(e => {
      const full = e.capacity > 0 && e.reg_count >= e.capacity && !e.registered;
      const cap = e.capacity > 0 ? T.cap(e.reg_count, e.capacity) : T.regCount(e.reg_count);
      const btn = e.registered
        ? `<button class="btn btn--ghost" data-unreg="${e.id}">${T.cancelReg}</button>`
        : full ? `<span class="full">${T.full}</span>`
        : `<button class="btn btn--solid" data-reg="${e.id}">${T.register}</button>`;
      return `<div class="m-ev">
        <div><h4>${esc(e.title)}${e.registered ? '　<span style="color:var(--muted);font-size:1rem">' + T.registered + '</span>' : ''}</h4>
          <div class="meta">${esc(e.starts_at || T.timeTbd)}${e.location ? '｜' + esc(e.location) : ''}　·　${cap}</div>
          ${e.description ? `<p>${esc(e.description)}</p>` : ''}</div>
        <div class="act">${btn}</div></div>`;
    }).join('') || `<div class="m-empty">${T.noEvents}</div>`;

    card.innerHTML = `
      <div class="m-head">
        <div>
          <h1 class="m-hi">${T.welcome(esc(me.name))}</h1>
          <p class="m-sub" style="margin-bottom:0">${esc(me.email || '')}</p>
          <button type="button" class="btn btn--ghost" id="m-profile-toggle" style="margin-top:.6rem;padding:.35em .9em;font-size:1rem">${esc(T.editProfile)}</button>
        </div>
        ${renderAccessChip(data)}
      </div>
      <div class="m-drawer" id="m-profile-drawer" hidden>
        <label style="display:block;font-size:1rem;color:var(--muted);margin-bottom:10px">Email
          <input type="text" value="${esc(me.email || '')}" readonly disabled
            style="display:block;width:100%;margin-top:.35em;padding:.6em .75em;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink-soft);font-size:1rem;box-sizing:border-box">
        </label>
        <label style="display:block;font-size:1rem;color:var(--muted)">${esc(T.nameLabel)}
          <input type="text" id="m-profile-name" value="${esc(me.name || '')}" maxlength="80" autocomplete="name"
            style="display:block;width:100%;margin-top:.35em;padding:.6em .75em;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-size:1rem;box-sizing:border-box">
        </label>
        <label style="display:block;font-size:1rem;color:var(--muted);margin-top:10px">${esc(T.phoneLabel)}
          <input type="tel" id="m-profile-phone" value="${esc(me.phone || '')}" maxlength="40" autocomplete="tel"
            style="display:block;width:100%;margin-top:.35em;padding:.6em .75em;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);font-size:1rem;box-sizing:border-box">
        </label>
        <button type="button" class="btn btn--ghost" id="m-profile-save" style="margin-top:12px;padding:.45em 1em;font-size:1rem">${esc(T.saveName)}</button>
      </div>
      ${data.role === 'admin' ? `<div style="margin:0 0 1.4rem"><a class="btn btn--solid" href="/admin">${T.goAdmin}</a></div>` : ''}
      ${renderNotice(data.events)}
      ${renderStatus(data)}
      <div class="m-quiet" id="m-events">
        <h3 class="m-sec-title">${T.eventsTitle}</h3>
        <div>${events}</div>
      </div>
      <div class="m-quiet">
        <h3 class="m-sec-title">${T.updatesTitle}</h3>
        <div>${updates}</div>
      </div>
      ${renderFoundingLine(c)}
      <div class="m-actions">
        <button class="btn btn--ghost" id="logout">${T.logout}</button>
      </div>`;
    if (me.name) try { localStorage.setItem('tth_name', me.name); } catch (e) {}
    document.getElementById('logout').onclick = () => {
      localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); location.reload();
    };
    card.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => regEvent(b.dataset.reg, 'POST', b));
    card.querySelectorAll('[data-unreg]').forEach(b => b.onclick = () => regEvent(b.dataset.unreg, 'DELETE', b));
    card.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => buyPlan(b.dataset.plan, b));
    const chip = document.getElementById('m-access-chip');
    if (chip) chip.onclick = () => {
      if (chip.dataset.blocked === '1') { showToast(T.needPlan); return; }
      openQrOverlay();
    };
    const profileToggle = document.getElementById('m-profile-toggle');
    const profileDrawer = document.getElementById('m-profile-drawer');
    if (profileToggle && profileDrawer) profileToggle.onclick = () => { profileDrawer.hidden = !profileDrawer.hidden; };
    const profileSave = document.getElementById('m-profile-save');
    if (profileSave) profileSave.onclick = async () => {
      profileSave.disabled = true;
      try {
        const r = await fetch(FELLOW + '/api/me/profile', {
          method: 'POST',
          headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('m-profile-name').value, phone: document.getElementById('m-profile-phone').value }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { showToast(d.error || T.profileFail); profileSave.disabled = false; return; }
        try { localStorage.setItem('tth_name', d.me.name); } catch (e) {}
        showToast(T.profileSaved);
        await main();
      } catch (e) { showToast(T.netFail); profileSave.disabled = false; }
    };
    const plansToggle = document.getElementById('m-plans-toggle');
    const plansPrimary = document.getElementById('m-plans-primary');
    const plansDrawer = document.getElementById('m-plans-drawer');
    const togglePlansDrawer = () => { if (plansDrawer) plansDrawer.hidden = !plansDrawer.hidden; };
    if (plansToggle) plansToggle.onclick = togglePlansDrawer;
    if (plansPrimary) plansPrimary.onclick = togglePlansDrawer;
    if (qrOverlayEl && !qrOverlayEl.hidden) startQrRefresh(true);
  }

  async function buyPlan(plan, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(FELLOW + '/api/me/plans/checkout', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify({ plan, lang: LANG }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { showToast(d.error || T.buyFail); btn.disabled = false; return; }
      location.href = d.url;
    } catch (e) {
      showToast(T.netFail);
      btn.disabled = false;
    }
  }

  async function fulfillPlanIfNeeded() {
    const q = new URLSearchParams(location.search);
    if (q.get('plan_canceled') === '1') {
      q.delete('plan_canceled');
      history.replaceState(null, '', location.pathname + (q.size ? '?' + q : '') + location.hash);
      showToast(T.planCanceled);
      return;
    }
    if (q.get('plan_paid') !== '1') return;
    const s = q.get('s');
    if (!s || !token) throw new Error(T.opFail);
    showToast(T.planVerifying);
    const r = await fetch(FELLOW + '/api/me/plans/verify', {
      method: 'POST',
      headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: s }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.ok !== true) throw Object.assign(new Error(d.error || T.opFail), { status: r.status });
    ['plan_paid', 's'].forEach(key => q.delete(key));
    history.replaceState(null, '', location.pathname + (q.size ? '?' + q : '') + location.hash);
    showToast(T.planPaid);
  }

  async function regEvent(id, method, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(FELLOW + '/api/events/' + id + '/register', {
        method, headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { showToast(d.error || T.opFail); btn.disabled = false; return; }
      showToast(method === 'DELETE' ? T.unregOk : T.regOk);
      main();
    } catch (e) { showToast(T.tempFail); btn.disabled = false; }
  }

  async function main() {
    if (!token) return renderLoggedOut();
    try {
      await fulfillPlanIfNeeded();
      const r = await fetch(FELLOW + '/api/state', { headers: { authorization: 'Bearer ' + token } });
      if (!r.ok) throw Object.assign(new Error('state ' + r.status), { status: r.status });
      const data = await r.json();
      data.commitments = (data.commitments || []).filter(c => c.user_id === data.me?.id);
      renderMember(data);
    } catch (e) {
      if (e.status === 401) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); return renderLoggedOut(); }
      stopQrRefresh();
      card.innerHTML = `<p class="m-center" style="color:var(--muted)">
        ${T.sysFail}<br>
        <button class="btn btn--ghost" style="margin-top:1.2rem" onclick="location.reload()">${T.reload}</button></p>`;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshQr();
  });
  // set document title by lang
  if (LANG === 'en') document.title = 'Member area · emoji — Taiwan Talent Hub';
  else if (LANG === 'ja') document.title = '会員エリア｜言文字｜台湾タレントハブ';
  else document.title = '會員專區 · 言文字｜台灣人才聚落';
  const loading = card.querySelector('p');
  if (loading) loading.textContent = T.loading;
  main();
</script>
</body>
</html>
