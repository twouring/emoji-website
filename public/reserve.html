<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>document.documentElement.className='js'</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1A17">
<title>訂位｜言文字｜台灣人才聚落</title>
<meta name="description" content="在咖啡、三點水線上訂位。選日期、時段、人數，30 秒完成。">
<link rel="canonical" href="https://www.emoji.tw/reserve">
<meta property="og:site_name" content="言文字｜台灣人才聚落 Taiwan Talent Hub">
<meta property="og:title" content="訂位｜言文字｜台灣人才聚落">
<meta property="og:description" content="選日期、時段、人數，30 秒完成訂位。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.emoji.tw/reserve">
<meta property="og:image" content="https://www.emoji.tw/og-cover.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nav.css">
<script defer src="/nav.js"></script>
<style>
:root{--paper:#FBFAF6;--card:#fff;--ink:#1B1A17;--muted:#6B6558;--line:#E4E0D6;--accent:#FFDE34;--danger:#9F2A1E}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.7}.skip-link{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:100}.skip-link:focus{left:8px}.wrap{width:min(100%,720px);margin:auto;padding:0 20px}.reserve-hero{padding:42px 0 18px}.reserve-hero h1{font-family:"Noto Serif TC",serif;font-size:clamp(2rem,9vw,3.4rem);line-height:1.12;margin:0;letter-spacing:.03em}.reserve-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 70px -48px rgba(27,26,23,.45);padding:22px;margin:18px 0 40px}.grid{display:grid;gap:14px}.field{display:grid;gap:6px}.field span,.legend{font-weight:700}.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #D8D2C5;border-radius:14px;padding:13px 14px;min-height:50px;appearance:none}.field textarea{resize:vertical;min-height:88px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot-group{margin-top:10px}.slot-group h3{font-size:1rem;margin:0 0 8px;color:#3A362E}.slot-group h3 small{font-weight:400;color:var(--muted);margin-left:6px}.chip{position:relative}.chip input{position:absolute;opacity:0;inset:0}.chip span{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #D8D2C5;border-radius:12px;background:#fff;font-weight:700;font-variant-numeric:tabular-nums}.chip input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--paper)}.chip input:disabled+span{opacity:.35;text-decoration:line-through}.chip input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}.chips--party{grid-template-columns:repeat(6,1fr)}.hint{font-size:1rem;color:var(--muted);margin:0}.hint a{color:var(--ink);font-weight:700}.actions{display:grid;gap:10px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;min-height:54px;padding:14px 18px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.btn-primary{background:var(--accent);color:var(--ink)}.btn-primary:disabled{opacity:.55;cursor:wait}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.status{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;display:none}.status.ok{display:block;background:#EAF4E7;color:#24512B}.status.err{display:block;background:#FBEDEB;color:var(--danger)}.done{display:none;text-align:left}.done h2{font-family:"Noto Serif TC",serif;font-size:1.8rem;line-height:1.25;margin:4px 0 10px}.done .summary{background:#F4F1EA;border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0 0}@media(max-width:520px){.wrap{padding:0 16px}.reserve-hero{padding-top:28px}.reserve-card{border-radius:20px;padding:18px;margin-bottom:28px}.chips{grid-template-columns:repeat(3,1fr)}.chips--party{grid-template-columns:repeat(3,1fr)}.reserve-hero h1{font-size:2.45rem}}
</style>
<script defer src="/reserve.js"></script>
</head>
<body>
<a href="#content" class="skip-link">跳至主要內容</a>
<!--SITE_HEADER-->
<main id="content">
<section class="reserve-hero">
  <div class="wrap">
    <h1>線上訂位</h1>
  </div>
</section>
<section class="wrap">
  <div class="reserve-card">
    <form id="reserveForm" novalidate>
      <div class="grid">
        <label class="field"><span>日期</span><input name="date" type="date" required></label>
        <div class="field"><span class="legend">時段</span>
          <div id="slotGroups" role="radiogroup" aria-label="時段"></div>
        </div>
        <div class="field"><span class="legend">人數</span><div class="chips chips--party" role="radiogroup" aria-label="人數"><label class="chip"><input type="radio" name="party_size" value="1" required><span>1 位</span></label><label class="chip"><input type="radio" name="party_size" value="2" required><span>2 位</span></label><label class="chip"><input type="radio" name="party_size" value="3" required><span>3 位</span></label><label class="chip"><input type="radio" name="party_size" value="4" required><span>4 位</span></label><label class="chip"><input type="radio" name="party_size" value="5" required><span>5 位</span></label><label class="chip"><input type="radio" name="party_size" value="6" required><span>6 位</span></label></div><p class="hint">7 位以上請來電 <a href="tel:+886921102067">0921-102-067</a></p></div>
        <label class="field"><span>姓名</span><input name="name" autocomplete="name" maxlength="80" required placeholder="例如：王小姐"></label>
        <label class="field"><span>手機</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="32" required placeholder="0912-345-678"></label>
        <label class="field"><span>Email（寄送確認信）</span><input name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"></label>
        <label class="field"><span>備註（選填）</span><textarea name="note" maxlength="500" placeholder="例：嬰兒椅、慶生、不吃牛"></textarea></label>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">確認訂位</button>
      </div>
      <div id="reserveStatus" class="status" role="status" aria-live="polite"></div>
    </form>
    <div id="reserveDone" class="done" aria-live="polite">
      <h2>訂位完成</h2>
      <p>確認信已寄出。座位保留至預約時間後 10 分鐘，若會遲到請來電。</p>
      <div class="summary" id="reserveSummary"></div>
      <div class="actions"><a class="btn btn-primary" href="https://maps.app.goo.gl/aFdoEB3RhweCqLbQ9" target="_blank" rel="noopener">開 Google Maps 導航</a><a class="btn btn-ghost" href="tel:+886921102067">撥電話 0921-102-067</a></div>
    </div>
  </div>
</section>
</main>
<!--SITE_FOOTER-->
</body>
</html>
