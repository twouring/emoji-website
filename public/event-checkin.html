<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>活動現場簽到｜言文字</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/stylebook/components.css">
<style>
.event-checkin{max-width:960px;padding-block:var(--ui-space-8);margin:auto}.checkin-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}.checkin-head h1,.checkin-head p{margin:0}.checkin-scan{grid-template-columns:minmax(0,1fr) minmax(min(100%,280px),.55fr);align-items:start}.checkin-modes{display:flex;gap:16px;flex-wrap:wrap;border:0;padding:0;margin:0}.checkin-modes label{min-height:44px;display:flex;align-items:center;gap:8px}.checkin-modes input{width:20px;height:20px;accent-color:var(--ink)}#result{white-space:pre-wrap}#result:empty{display:none}.event-checkin video{width:100%;margin-top:var(--ui-space-4)}.checkin-tools{align-items:end}.checkin-tools .ui-field:first-child{flex:1;min-width:min(100%,260px)}.guest-list{display:grid;gap:12px}.guest-card{box-shadow:none}.guest-card[hidden]{display:none}.guest-card__head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.guest-card h3,.guest-card p{margin:0}.guest-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 20px}.guest-meta dt{color:var(--muted)}.guest-meta dd{margin:0;overflow-wrap:anywhere}.recent-list{margin:0;padding-left:24px}.recent-list:empty::before{content:attr(data-empty);color:var(--muted)}
</style>
</head>
<body class="ui-scope">
<main class="event-checkin ui-shell ui-stack">
  <header class="checkin-head">
    <div><p data-i18n="desk">現場工作台</p><h1 data-i18n="title">活動現場簽到</h1><p id="event-name"></p></div>
    <a class="ui-button ui-button--secondary" id="back" href="/organizer/events" data-i18n="back" hidden>回活動管理</a>
  </header>
  <p data-i18n="scope">獲授權的簽到人員可掃描票券、搜尋來賓及查看報名資料；不能下載名單、編輯活動、傳送通知或變更報名狀態。</p>
  <p id="login" class="ui-notice" hidden><a class="ui-link" id="login-link" data-i18n="login">以 Google 登入</a></p>
  <section id="workspace" class="ui-stack" hidden>
    <section class="ui-card">
      <div class="guest-card__head"><div><h2 data-i18n="scanTitle">掃描與簽到</h2><p id="mode-help"></p></div><span class="ui-badge" id="access-badge"></span></div>
      <fieldset class="checkin-modes" id="modes"><legend data-i18n="mode">掃描模式</legend><label><input type="radio" name="mode" value="standard"><span data-i18n="standard">標準：確認後簽到</span></label><label><input type="radio" name="mode" value="express"><span data-i18n="express">快速：掃描後立即簽到</span></label></fieldset>
      <div class="ui-grid checkin-scan">
        <form id="scan" class="ui-stack"><label class="ui-field" for="token"><span data-i18n="qr">QR 票券內容</span><textarea id="token" required data-placeholder="placeholder" placeholder="掃描槍輸入或貼上 QR 票券內容"></textarea></label><div class="ui-card__actions"><button class="ui-button ui-button--accent" id="submit" data-i18n="submit">確認簽到</button><button class="ui-button ui-button--secondary" type="button" id="camera" data-i18n="camera">開啟相機掃描</button></div></form>
        <div class="ui-stack"><p class="ui-notice" id="result" role="status" aria-live="polite"></p><button class="ui-button ui-button--secondary" id="undo" type="button" hidden data-i18n="undo">取消剛才的簽到</button><h3 data-i18n="recent">最近簽到</h3><ol id="recent" class="recent-list" data-empty="尚無簽到"></ol></div>
      </div>
      <video id="video" playsinline muted hidden></video>
    </section>
    <section class="ui-card">
      <h2 data-i18n="guests">來賓名單</h2><p data-i18n="guestHelp">可用姓名或 Email 搜尋並手動簽到；付款與報名答案僅供現場核對。</p>
      <div class="ui-row checkin-tools"><label class="ui-field"><span data-i18n="search">搜尋來賓</span><input id="guest-search" type="search" data-placeholder="searchPlaceholder" placeholder="姓名或 Email"></label><label class="ui-field"><span data-i18n="ticket">票種</span><select id="ticket-filter"><option value="" data-i18n="allTickets">全部票種</option></select></label><label class="ui-field"><span data-i18n="status">狀態</span><select id="status-filter"><option value="" data-i18n="allStatuses">全部狀態</option><option value="registered" data-i18n="registered">已報名</option><option value="checked" data-i18n="checked">已簽到</option><option value="not_checked" data-i18n="notChecked">尚未簽到</option></select></label><span id="guest-count" role="status" aria-live="polite"></span></div>
      <div id="guest-list" class="guest-list"></div>
    </section>
  </section>
  <p id="fatal" class="ui-notice" role="alert"></p>
</main>
<script>
const lang=["en","ja"].includes(new URLSearchParams(location.search).get("lang"))?new URLSearchParams(location.search).get("lang"):"zh";
const copy={zh:{desk:"現場工作台",title:"活動現場簽到",back:"回活動管理",scope:"獲授權的簽到人員可掃描票券、搜尋來賓及查看報名資料；不能下載名單、編輯活動、傳送通知或變更報名狀態。",login:"以 Google 登入",scanTitle:"掃描與簽到",mode:"掃描模式",standard:"標準：確認後簽到",express:"快速：掃描後立即簽到",standardHelp:"掃描後先確認，再按下簽到。",expressHelp:"掃描成功後立即簽到，適合快速入場。",locked:"模式已由主辦人鎖定",manager:"主辦人／管理者",staff:"簽到人員",qr:"QR 票券內容",placeholder:"掃描槍輸入或貼上 QR 票券內容",submit:"確認簽到",camera:"開啟相機掃描",undo:"取消剛才的簽到",recent:"最近簽到",recentEmpty:"尚無簽到",guests:"來賓名單",guestHelp:"可用姓名或 Email 搜尋並手動簽到；付款與報名答案僅供現場核對。",search:"搜尋來賓",searchPlaceholder:"姓名或 Email",ticket:"票種",allTickets:"全部票種",status:"狀態",allStatuses:"全部狀態",registered:"已報名",checked:"已簽到",notChecked:"尚未簽到",pending:"尚未成立",paid:"已付",answers:"報名答案",registeredAt:"報名時間",phone:"電話",buyer:"購買者",coupon:"優惠碼",checkIn:"簽到",restricted:"此入口不接受",showing:"顯示",people:"位",useLink:"請使用主辦人提供的現場簽到連結。",failed:"簽到失敗",already:"已簽到：",success:"簽到成功：",undone:"已取消剛才的簽到",ready:"已讀取票券，確認資料後按下簽到。",cameraUnavailable:"此瀏覽器不支援相機掃碼，請用掃描槍或貼上 QR 內容。",cameraFailed:"無法開啟相機，請用掃描槍或貼上 QR 內容。"},en:{desk:"Door workspace",title:"Event check-in",back:"Back to event management",scope:"Authorized check-in staff can scan tickets, search guests and view registration details. They cannot export the list, edit the event, send messages or change registration status.",login:"Sign in with Google",scanTitle:"Scan and check in",mode:"Scan mode",standard:"Standard: confirm check-in",express:"Express: check in on scan",standardHelp:"Review the scan, then confirm the check-in.",expressHelp:"A valid scan checks the guest in immediately.",locked:"Mode locked by the organizer",manager:"Host / manager",staff:"Check-in staff",qr:"QR ticket content",placeholder:"Scan or paste QR ticket content",submit:"Confirm check-in",camera:"Scan with camera",undo:"Undo last check-in",recent:"Recent check-ins",recentEmpty:"No check-ins yet",guests:"Guest list",guestHelp:"Search by name or email and check guests in manually. Payment and registration answers are shown for door verification.",search:"Search guests",searchPlaceholder:"Name or email",ticket:"Ticket type",allTickets:"All ticket types",status:"Status",allStatuses:"All statuses",registered:"Registered",checked:"Checked in",notChecked:"Not checked in",pending:"Not active",paid:"Paid",answers:"Registration answers",registeredAt:"Registered",phone:"Phone",buyer:"Buyer",coupon:"Coupon",checkIn:"Check in",restricted:"Not accepted here",showing:"Showing",people:"guests",useLink:"Use the check-in link provided by the organizer.",failed:"Check-in failed",already:"Already checked in: ",success:"Checked in: ",undone:"Last check-in undone",ready:"Ticket scanned. Review it, then confirm check-in.",cameraUnavailable:"Camera scanning is unavailable. Use a scanner or paste the QR content.",cameraFailed:"Could not open the camera. Use a scanner or paste the QR content."},ja:{desk:"受付ワークスペース",title:"イベント受付",back:"イベント管理に戻る",scope:"許可された受付スタッフはチケット確認、参加者検索、申込情報の確認ができます。名簿の書き出し、イベント編集、通知送信、申込状態の変更はできません。",login:"Google でログイン",scanTitle:"スキャンと受付",mode:"スキャンモード",standard:"標準：確認して受付",express:"高速：読み取り後すぐ受付",standardHelp:"読み取り内容を確認してから受付します。",expressHelp:"有効なチケットを読み取るとすぐ受付します。",locked:"主催者がモードを固定しています",manager:"主催者／管理者",staff:"受付スタッフ",qr:"QR チケットの内容",placeholder:"スキャナーで読み取るか QR の内容を貼り付けてください",submit:"受付を確定",camera:"カメラで読み取る",undo:"直前の受付を取り消す",recent:"最近の受付",recentEmpty:"受付履歴はありません",guests:"参加者一覧",guestHelp:"氏名またはメールで検索し、手動で受付できます。決済と申込回答は当日の確認用です。",search:"参加者を検索",searchPlaceholder:"氏名またはメール",ticket:"チケット種別",allTickets:"すべてのチケット",status:"状態",allStatuses:"すべての状態",registered:"参加予定",checked:"受付済み",notChecked:"未受付",pending:"未成立",paid:"支払済み",answers:"申込回答",registeredAt:"申込日時",phone:"電話",buyer:"購入者",coupon:"クーポン",checkIn:"受付",restricted:"この受付では対象外",showing:"表示",people:"名",useLink:"主催者から届いた受付リンクを使用してください。",failed:"受付に失敗しました",already:"受付済み：",success:"受付完了：",undone:"直前の受付を取り消しました",ready:"チケットを読み取りました。内容を確認して受付してください。",cameraUnavailable:"カメラ読み取りに対応していません。スキャナーか QR 内容の貼り付けをご利用ください。",cameraFailed:"カメラを開けません。スキャナーか QR 内容の貼り付けをご利用ください。"}};
const T=copy[lang];document.documentElement.lang=lang==="zh"?"zh-Hant":lang;document.title=T.title+"｜言文字";document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T[el.dataset.i18n]||el.textContent;});document.querySelectorAll("[data-placeholder]").forEach(el=>{el.placeholder=T[el.dataset.placeholder]||el.placeholder;});document.getElementById("recent").dataset.empty=T.recentEmpty;
const eventId=new URLSearchParams(location.search).get("event"),token=localStorage.getItem("tth_token"),workspace=document.getElementById("workspace"),fatal=document.getElementById("fatal"),form=document.getElementById("scan"),result=document.getElementById("result"),undo=document.getElementById("undo");let context,mode,lastId,lastAttendee,stream,frame,cameraVersion=0,recent=[];
if(!token){document.getElementById("login").hidden=false;document.getElementById("login-link").href="/auth/google?redirect="+encodeURIComponent(location.href);}
if(!eventId)fatal.textContent=T.useLink;
async function api(suffix,method="GET",body){const response=await fetch("/api/admin/events/"+encodeURIComponent(eventId)+suffix,{method,headers:{authorization:"Bearer "+token,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw new Error(data.error||T.failed);return data;}
const esc=value=>String(value??"").replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
const money=value=>"NT$"+Number(value||0).toLocaleString(lang==="zh"?"zh-TW":lang);
const statusLabel=value=>({registered:T.registered,pending_approval:T.pending,waitlisted:T.pending,declined:T.pending,cancelled:T.pending,refunded:T.pending,pending_payment:T.pending,approved:T.pending,capture_pending:T.pending}[value]||value);
const answerValue=value=>Array.isArray(value)?value.join("、"):value&&typeof value==="object"?[value.accepted?(lang==="zh"?"已同意":lang==="ja"?"同意済み":"Accepted"):null,value.reviewed?(lang==="zh"?"已閱讀":lang==="ja"?"確認済み":"Reviewed"):null,value.signature?(lang==="zh"?"簽名：":lang==="ja"?"署名：":"Signature: ")+value.signature:null].filter(Boolean).join(" · "):value;
function setMode(value){mode=value;document.querySelector(`[name="mode"][value="${value}"]`).checked=true;document.getElementById("mode-help").textContent=(value==="express"?T.expressHelp:T.standardHelp)+(context.locked&&!context.can_manage?" · "+T.locked:"");sessionStorage.setItem("emoji-checkin-mode-"+eventId,value);}
function renderRecent(){document.getElementById("recent").innerHTML=recent.map(item=>`<li>${esc(item)}</li>`).join("");}
function renderGuests(){const search=document.getElementById("guest-search").value.trim().toLowerCase(),ticket=document.getElementById("ticket-filter").value,status=document.getElementById("status-filter").value;let count=0;document.querySelectorAll("[data-guest]").forEach(card=>{const guest=context.guests[Number(card.dataset.guest)],matchesStatus=!status||(status==="checked"?!!guest.checked_in_at:status==="not_checked"?guest.status==="registered"&&!guest.checked_in_at:guest.status===status),visible=(!search||`${guest.name} ${guest.email}`.toLowerCase().includes(search))&&(!ticket||guest.ticket_id===ticket)&&matchesStatus;card.hidden=!visible;if(visible)count++;});document.getElementById("guest-count").textContent=`${T.showing} ${count} ${T.people}`;}
function guestCard(guest,index){const answers=(guest.answers||[]).map(answer=>`<p><b>${esc(answer.question?.label||"")}</b><br>${esc(answerValue(answer.value))}</p>`).join("");return `<article class="ui-card guest-card" data-guest="${index}"><div class="guest-card__head"><div><h3>${esc(guest.name||guest.email)}</h3><p>${esc(guest.email)}</p></div><span class="ui-badge">${esc(guest.checked_in_at?T.checked:statusLabel(guest.status))}</span></div><dl class="guest-meta"><div><dt>${T.ticket}</dt><dd>${esc(guest.ticket_name||"—")}</dd></div><div><dt>${T.phone}</dt><dd>${esc(guest.phone||"—")}</dd></div><div><dt>${T.paid}</dt><dd>${money(guest.amount_paid)} / ${money(guest.amount_due)}</dd></div><div><dt>${T.coupon}</dt><dd>${esc(guest.coupon_code||"—")}</dd></div><div><dt>${T.buyer}</dt><dd>${esc(guest.buyer_name||guest.buyer_email||"—")}</dd></div><div><dt>${T.registeredAt}</dt><dd>${esc(new Date(guest.created_at).toLocaleString(lang==="zh"?"zh-TW":lang))}</dd></div></dl>${answers?`<details class="ui-details"><summary>${T.answers}</summary>${answers}</details>`:""}<div class="ui-card__actions">${guest.status!=="registered"?`<span>${T.pending}</span>`:guest.checked_in_at?`<button class="ui-button ui-button--secondary" data-guest-undo="${index}">${T.undo}</button>`:guest.can_checkin?`<button class="ui-button ui-button--accent" data-guest-checkin="${index}">${T.checkIn}</button>`:`<span>${T.restricted}</span>`}</div></article>`;}
function paintContext(){document.getElementById("event-name").textContent=context.event.title+" · "+context.event.status;const back=document.getElementById("back");back.hidden=!context.management_url;if(context.management_url)back.href=context.management_url;document.getElementById("access-badge").textContent=context.can_manage?T.manager:T.staff;document.getElementById("ticket-filter").innerHTML=`<option value="">${T.allTickets}</option>`+context.tickets.map(ticket=>`<option value="${esc(ticket.id)}">${esc(ticket.name)}</option>`).join("");document.getElementById("guest-list").innerHTML=context.guests.map(guestCard).join("")||`<p class="ui-notice">${T.showing} 0 ${T.people}</p>`;const saved=sessionStorage.getItem("emoji-checkin-mode-"+eventId);setMode(context.locked&&!context.can_manage?context.mode:["standard","express"].includes(saved)?saved:context.mode);document.querySelectorAll("[name=mode]").forEach(input=>{input.disabled=context.locked&&!context.can_manage;input.onchange=()=>setMode(input.value);});document.querySelectorAll("[data-guest-checkin]").forEach(button=>button.onclick=()=>checkIn({registration_id:context.guests[Number(button.dataset.guestCheckin)].registration_id,attendee_id:context.guests[Number(button.dataset.guestCheckin)].attendee_id}));document.querySelectorAll("[data-guest-undo]").forEach(button=>button.onclick=()=>undoGuest(context.guests[Number(button.dataset.guestUndo)]));renderGuests();workspace.hidden=false;}
async function load(){if(!eventId||!token)return;try{context=await api("/check-in");paintContext();}catch(error){fatal.textContent=error.message;}}
async function checkIn(body){const button=document.getElementById("submit");if(button.disabled)return;button.disabled=true;undo.hidden=true;try{const out=await api("/check-in","POST",body);lastId=out.guest.id;lastAttendee=out.guest.attendee_id;result.textContent=(out.duplicate?T.already:T.success)+out.guest.name;undo.hidden=out.duplicate;document.getElementById("token").value="";recent.unshift(out.guest.name);recent=recent.slice(0,10);renderRecent();context=await api("/check-in");paintContext();}catch(error){result.textContent=error.message;}finally{button.disabled=false;}}
async function undoGuest(guest){try{await api("/check-in/"+encodeURIComponent(guest.registration_id)+(guest.attendee_id?"?attendee_id="+encodeURIComponent(guest.attendee_id):""),"DELETE");result.textContent=T.undone;context=await api("/check-in");paintContext();return true;}catch(error){result.textContent=error.message;return false;}}
form.onsubmit=event=>{event.preventDefault();const value=document.getElementById("token").value.trim();if(value)checkIn({token:value});};
undo.onclick=async()=>{undo.disabled=true;if(await undoGuest({registration_id:lastId,attendee_id:lastAttendee}))undo.hidden=true;undo.disabled=false;};
for(const id of ["guest-search","ticket-filter","status-filter"])document.getElementById(id).addEventListener("input",renderGuests);
function stop(){cameraVersion++;if(frame)cancelAnimationFrame(frame);stream?.getTracks().forEach(track=>track.stop());stream=null;document.getElementById("video").hidden=true;document.getElementById("video").srcObject=null;}
document.getElementById("camera").onclick=async()=>{const button=document.getElementById("camera");if(button.disabled)return;if(stream){stop();return;}if(!("BarcodeDetector"in window)||!navigator.mediaDevices?.getUserMedia){result.textContent=T.cameraUnavailable;return;}const version=++cameraVersion;button.disabled=true;button.setAttribute("aria-busy","true");try{const acquired=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});if(version!==cameraVersion){acquired.getTracks().forEach(track=>track.stop());return;}stream=acquired;const video=document.getElementById("video");video.srcObject=stream;video.hidden=false;await video.play();if(version!==cameraVersion)return;const detector=new BarcodeDetector({formats:["qr_code"]});async function tick(){if(!stream)return;const codes=await detector.detect(video).catch(()=>[]);if(version!==cameraVersion)return;if(codes[0]?.rawValue){document.getElementById("token").value=codes[0].rawValue;stop();if(mode==="express")checkIn({token:codes[0].rawValue});else result.textContent=T.ready;}else frame=requestAnimationFrame(tick);}tick();}catch(error){stop();result.textContent=T.cameraFailed;}finally{button.disabled=false;button.setAttribute("aria-busy","false");}};
addEventListener("pagehide",stop);load();
</script>
</body>
</html>
