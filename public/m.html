<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>言文字 會員</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="言文字">
<link rel="manifest" href="/m.webmanifest">
<link rel="stylesheet" href="/event-rich.css">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/m-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--soft:#3A362E;--muted:#5A5448;--paper:#FBFAF6;--alt:#F4F1EA;--line:#E4E0D6;--card:#fff;--accent:#FFDE34;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:1rem;line-height:1.6;line-break:strict;word-break:auto-phrase;overflow-wrap:break-word}
body{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);overscroll-behavior-y:contain}
[hidden]{display:none!important}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px}
h1,h2,h3,.btn,.show,.rwb,.quick a,.quick button,.status{text-wrap:balance}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:700;margin:0}
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.hello h1{font-size:1.4rem}
.hello small{display:block;color:var(--muted);font-size:1rem;font-weight:400}
.hello .quiet{width:auto;margin:0;min-height:44px;flex:none;padding:0 4px;white-space:nowrap}
.hello .btn{width:auto;min-height:44px;padding:0 16px;flex:none;white-space:nowrap}
.hello+.sec{margin-top:0}.hello+.hint{margin:0 2px 8px}
/* 品牌館：2×2 品牌卡；品牌頁 .bp 用品牌色當頂線（品牌色只當線與底框，不當字色） */
.bcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bcard{display:flex;align-items:flex-start;gap:10px;min-height:76px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-align:left;min-width:0}
.bcard img{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover;align-self:flex-start}
.bcard span{min-width:0;display:flex;flex-direction:column}
.bcard b{font-family:"Noto Serif TC",serif;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.bcard small{color:var(--muted);font-size:1rem;line-height:1.35;word-break:keep-all}
.bcard small.st{display:flex;align-items:center;gap:6px}.bcard small.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.bcard small.on{color:var(--ink);font-weight:700}.bcard small.on::before{background:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.sec-h h2{margin:0}.sec-h .quiet{margin:0;width:auto;min-height:44px;min-width:44px;padding:0 8px}
.sec-t{font-size:1.15rem;margin:26px 0 10px}
.ag-who{color:var(--muted);font-size:1rem;line-height:1.4}
.ag .meta{word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line}
.ag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.ag-top h3{margin:0;word-break:keep-all;overflow-wrap:anywhere}.ag-top .pill{margin:2px 0 0;flex:none;white-space:nowrap}
.card-acts .access-open{gap:8px}
.pass .pts{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.pass .pts small{display:block;margin-top:8px;font-size:1rem;opacity:.85}
.card-acts{margin-top:14px}.card-acts .show{margin-top:0}
.card-acts.btn2{grid-template-columns:1.6fr 1fr}.card-acts .access-open{margin:0;min-height:56px;border-radius:16px;font-weight:700;background:var(--card)}
.me-pts{display:flex;align-items:baseline;gap:10px;width:100%;min-height:64px;margin:0 0 8px;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-align:left}
.me-pts b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}.me-pts small{margin-left:auto;color:var(--muted);font-size:1rem}
.bp{--b:var(--ink)}.bp[data-b=cafe]{--b:#984C37}.bp[data-b=bar]{--b:#6B8FAB}.bp[data-b=stay]{--b:#2B4064}.bp[data-b=rest]{--b:#5A4632}
.bp>header{border-top:6px solid var(--b)}
.bp-hero{display:flex;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.bp-hero img{width:88px;height:88px;border-radius:20px;flex:none;object-fit:cover}
.bp-hero h2{font-size:1.5rem;line-height:1.25}.bp-hero h2 small{display:block;font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:1rem;color:var(--muted)}
.bp-hero p{margin:4px 0 0;color:var(--soft)}
.bp .hint{word-break:keep-all}
.bp-hours{color:var(--muted)}.bp-hours.on{color:var(--ink);font-weight:700}
.bp-acts{display:grid;gap:8px;margin-top:16px}.bp-acts .btn{margin:0;width:100%}
.mark{width:44px;height:44px}
/* 會員卡 */
.pass{background:var(--ink);color:var(--paper);border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(27,26,23,.18)}
.pass::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--accent);opacity:.95}
.pass .brand{position:relative;z-index:1;font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:.2em;font-size:1rem}
.pass .pts{position:relative;z-index:1;margin-top:34px}
.pass .pts span{display:block;font-size:1rem;margin-bottom:6px}
.pass .pts b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:600;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.pass .who{position:relative;z-index:1;margin-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:1rem}
.pass .who i{font-style:normal;opacity:.85}.pass .pts span{opacity:.85}
.show{margin-top:14px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--ink);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:10px}
.show:active{transform:scale(.98)}
.order-scan{margin-top:14px;gap:10px;font-weight:700;background:var(--card)}
.hist-open{margin-top:10px;gap:10px;font-weight:700;background:var(--card)}
.hist-bal{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 14px}.hist-bal b{font-size:1.8rem}
.hist-list{margin-top:14px}
.hist-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.hist-card.void{opacity:.6}.hist-card.void .hist-amt{text-decoration:line-through}
.hist-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.hist-when{color:var(--muted)}.hist-amt{font-size:1.15rem;white-space:nowrap}
.hist-items{list-style:none;margin:8px 0 0;padding:0}.hist-items li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;overflow-wrap:anywhere}.hist-items li span:last-child{color:var(--muted);white-space:nowrap}
.hist-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px;color:var(--soft)}.hist-foot .tag{margin-left:0}.hist-pts{font-weight:700;color:var(--ink)}
.hist-pt>div{display:flex;flex-direction:column;gap:2px;min-width:0}.hist-pt small{color:var(--muted);font-size:1rem}.hist-pt b{overflow-wrap:anywhere}
.hist-delta{white-space:nowrap;font-size:1.1rem}.hist-delta.neg{color:var(--muted)}
.hint{color:var(--soft);font-size:1rem;margin:10px 2px 0;text-wrap:pretty}.nb{white-space:nowrap}
/* 區塊 */
.sec{margin-top:26px}
.sec h2{font-size:1.15rem;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:block;color:inherit;text-decoration:none}
.tile h3{font-size:1.05rem;margin-bottom:2px}
.badge-card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.badge-logo{flex:0 0 52px;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Noto Serif TC",serif;font-weight:700;font-size:1.2rem}
.badge-logo img{width:100%;height:100%;object-fit:contain}
.badge-main{min-width:0}.badge-main h3{font-size:1.05rem;margin-bottom:2px}.badge-main .meta{color:var(--muted);margin:0}
.badge-lv{display:inline-block;border-radius:999px;padding:0 .6em;border:1px solid var(--ink);color:var(--ink);font-weight:700}
.badge-lv.lv3,.badge-lv.lv4{background:var(--accent)}
.tile .meta{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:0 .7em;font-size:1rem;margin-left:6px;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;font-weight:500;width:100%;text-decoration:none;color:var(--ink)}
.quiet{display:block;width:100%;margin-top:18px;min-height:48px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn:disabled,.quiet:disabled{opacity:.5;cursor:not-allowed}
/* 間距：連續按鈕 8px；欄位後的送出鍵 16px（不寫 inline margin） */
.btn+.btn{margin-top:8px}
.chk+.btn,.fld+.btn,.field+.btn2,.chk+.btn2,.hint+.btn2{margin-top:16px}
.sec>h2+.hint,.sec-h+.hint{margin-top:0}
/* 安裝引導 */
.install{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:16px;margin:0 0 18px;text-align:left}
.install h3{font-size:1.05rem}
.install p{margin:4px 0 12px;color:var(--soft)}
.install .irow{display:flex;gap:10px;align-items:center}
.install .btn{width:auto;flex:1;padding:0 16px}
.install .later{min-height:48px;padding:0 14px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.pg{position:fixed;inset:0;z-index:50;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;animation:pgin .26s cubic-bezier(.2,.8,.2,1)}
.pg.out{animation:pgout .2s ease-in forwards}
@keyframes pgin{from{transform:translateX(100%)}to{transform:none}}
@keyframes pgout{to{transform:translateX(100%)}}
.pg[hidden]{display:none}
.pg>header{display:flex;align-items:center;min-height:56px;padding:env(safe-area-inset-top) 6px 0;border-bottom:1px solid var(--line);background:rgba(251,250,246,.96)}
.pg .back{min-height:48px;min-width:48px;padding:0 14px 0 8px;border:0;background:none;color:var(--ink);font:inherit;font-size:1.1rem;display:flex;align-items:center;gap:2px}
.pg .back b{font-size:1.9rem;line-height:1;font-weight:400}
.pg>header h3{font-size:1.05rem;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.pg .body{flex:1;overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-width:480px;width:100%;margin:0 auto}
.pg.center .body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pg ol{padding-left:1.3em;margin:12px 0 16px}
.pg li{margin:10px 0}
.pg .note{color:var(--muted);margin:0 0 14px;text-wrap:pretty}
.pg .body>h2{margin-bottom:4px}
/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,246,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:var(--tab);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:1rem;white-space:nowrap;min-width:0;padding:0 2px;line-height:1.3}
nav.tabs button span{white-space:nowrap}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=true]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current=true] svg{stroke-width:2.2}
/* 全螢幕 QR */
.ov img{width:min(78vw,320px);height:min(78vw,320px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.ov p{margin:16px 0 0;color:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));background:var(--ink);color:var(--paper);padding:.7em 1.1em;border-radius:12px;z-index:60;max-width:90vw}
.toast[hidden]{display:none}
/* 登入 */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.install+.login{min-height:0;justify-content:flex-start}
.login .mark{width:88px;height:88px;margin:0 auto 4px}
.login h1{font-size:1.7rem}
.login p{color:var(--muted);margin:0;text-wrap:balance}
.login .ways{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.login .way{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:500;font-size:1.05rem;text-decoration:none;font-family:inherit}
.login .way svg{position:absolute;left:18px;top:50%;width:24px;height:24px;transform:translateY(-50%)}
.login .way.line{background:#06C755;border-color:#06C755;color:#fff}
.login .way.email{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.login .way:active{transform:scale(.985)}
.login .first{margin-top:14px}
.login .ef{text-align:left;margin-top:8px}
.login .ef .btn{margin-top:16px}
.login .sent{background:var(--alt);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:22px}
.login .sent b{display:block;font-size:1.1rem;margin-bottom:6px}
.login .lang{margin-top:22px}
.offline{background:var(--alt);border:1px solid var(--line);color:var(--soft);border-radius:10px;padding:.4em .8em;margin-bottom:12px;text-align:center}
/* 預約表單 */
.fld{display:block;color:var(--soft);margin-top:12px}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:6px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-family:inherit;font-size:1rem;color:var(--ink)}
.fld textarea{min-height:72px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg button{min-height:48px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-size:1rem}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.shots:empty{display:none}.shots>div{position:relative}.shots img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--alt)}.shots button{position:absolute;top:-8px;right:-8px;width:44px;height:44px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-size:1.2rem;line-height:1}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg#pkd button{white-space:nowrap;padding:6px 4px;border-radius:16px;line-height:1.35}
.seg button{flex:1 1 calc(33.333% - 8px)}.seg.two button{flex:1 1 calc(50% - 8px)}
.mi .q button:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slots button{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:1rem;font-variant-numeric:tabular-nums}
.slots button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.slots h4{grid-column:1/-1;margin:8px 0 0;font-weight:500;color:var(--muted)}
.slots .empty{grid-column:1/-1}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mi .nm{flex:1}.mi .nm small{display:block;color:var(--muted);font-size:1rem}
.mi .q{display:flex;align-items:center;gap:4px}
.mi .q button{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;font-size:1.3rem;line-height:1}
.mi .q b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.mi .q button.pick{width:auto;border-radius:999px;padding:0 16px;font-size:1rem}
.mi .nm .quiet{display:inline-block;width:auto;min-height:44px;margin:0 0 0 6px;padding:0 4px}
.cat{margin:18px 0 4px;color:var(--muted);font-weight:500}
.tile .act{display:flex;gap:10px;margin-top:12px}.tile .act .btn{min-height:44px;flex:1;margin-top:0}
.tile .act .quiet{margin:0;width:auto;flex:1;min-height:44px}
.ag .act .quiet:only-child{flex:none;padding:0 4px;text-align:left}
.sticky{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 8px);background:var(--paper);padding:10px 0 2px}
.pill{display:inline-block;border-radius:999px;padding:0 .7em;font-size:1rem;border:1px solid var(--line);margin-left:6px;color:var(--muted)}
.pill.on{background:var(--accent);border-color:var(--ink);color:var(--ink)}
/* 快捷 */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.quick a,.quick button{min-height:84px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:500;font-size:1rem;white-space:nowrap;min-width:0;padding:0 4px}
.quick svg{width:26px;height:26px}
/* 快捷鍵 4 顆（含商店）改 2×2，日文長字也不擠 */
.quick:has(>:nth-child(4)){grid-template-columns:repeat(2,1fr)}.quick:has(>:nth-child(4)) a,.quick:has(>:nth-child(4)) button{min-height:64px;flex-direction:row;gap:8px}
.sticky .btn+.btn{margin-top:8px}
.mi img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.rwb{min-height:44px;min-width:72px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-size:1.05rem;padding:0 1em;cursor:pointer}
.scanov .body{align-items:center;justify-content:center;gap:16px}
.scanov video{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:18px;background:var(--ink)}
/* 會籍 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.show+.panel{margin-top:14px}#plans{margin-top:12px}
.eyebrow{font-size:1rem;letter-spacing:.12em;color:var(--muted)}
.status{font-family:"Noto Serif TC",serif;font-size:1.2rem;font-weight:700;margin:.2em 0 .6em}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--ink)}
.panel .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);margin-bottom:12px}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn2>.btn{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:6px 12px;background:var(--card);font-weight:500}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.chip .dot.on{background:var(--accent);border:1px solid var(--ink)}
.plan.promo .tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:1rem;font-weight:600;margin-left:0}

    document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.rating);document.querySelectorAll('[data-rating]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.rating)===rating)));});
    document.getElementById('feedback-send').onclick=async function(){const text=document.getElementById('feedback-text').value.trim();if(!kind){toast(T.feedbackPick);return;}this.disabled=true;try{await post('/api/me/feedback',{kind,rating:rating||null,text,lang:LANG});toast(T.feedbackSent);me();}catch(e){toast(e.message||T.netFail);this.disabled=false;}};
  }
  function badgesSec(){
    const list=Array.isArray(data.badges)?data.badges:[];
    const card=b=>{const nm=(b.name&&(b.name[LANG]||b.name.zh))||'';return `<div class="badge-card"><span class="badge-logo">${b.logo_url?`<img src="${esc(b.logo_url)}" alt="" width="52" height="52">`:esc(String(b.partner_name||b.name&&b.name.zh||'').slice(0,1))}</span><div class="badge-main"><h3>${esc(b.partner_name)}</h3><p class="meta"><span class="badge-lv lv${Number(b.level)||1}">${esc(T.badgeLv)}${Number(b.level)||1} ${esc(nm)}</span> ${esc(T.badgeTimes.replace('{n}',b.count))}</p><p class="meta">${b.next_level?esc(T.badgeNext.replace('{n}',b.to_next)):esc(T.badgeMax)}</p></div></div>`;};
    return `<section class="sec" id="badges"><h2>${esc(T.badges)}</h2>${list.length?list.map(card).join(''):`<p class="empty">${esc(T.badgesEmpty)}</p>`}<p class="hint">${esc(T.badgesHint)}</p></section>`;
  }
  function me(){
    const m=data.me||{},phone=(data.yan&&data.yan.phone)||m.phone||'';
    const view=`<div class="row view"><span>${esc(T.name)}</span><b>${esc(m.name||'')}</b></div>
    <div class="row view"><span>${esc(T.emailL)}</span><b>${esc(m.email||'')}</b></div>
    <div class="row view"><span>${esc(T.phone)}</span><b>${esc(phone?phone.replace(/^\+886/,'0'):T.noPhone)}</b></div>`;
    const form=`<section class="sec"><label class="field">${esc(T.name)}<input id="nm" maxlength="80" autocomplete="name" value="${esc(m.name||'')}"></label>
      <label class="field">${esc(T.emailL)}<input value="${esc(m.email||'')}" disabled></label>
      <label class="field">${esc(T.phoneHint)}<input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" value="${esc(m.phone||'')}"></label>
      <div class="btn2"><button class="btn" id="ecancel" type="button">${esc(T.cancelEdit)}</button><button class="btn solid" id="save" type="button">${esc(T.save)}</button></div></section>`;
    app.innerHTML=`<div class="hello"><h1>${esc(T.me)}</h1>${editing?'':`<button class="btn" id="eedit" type="button">${esc(T.editBtn)}</button>`}</div>
    ${editing?'':`<button class="me-pts" id="hist-open2" type="button"><span>${esc(T.myPts)}</span><b>${esc((data.yan&&data.yan.balance)||0)}</b><small>${esc(T.history)} ›</small></button>`}
    ${editing?form:view}
    ${editing?'':badgesSec()}
    ${!editing&&!m.email?`<section class="sec" id="eb"><h2>${esc(T.ebBind)}</h2><p class="hint">${esc(T.ebBindHint)}</p>
      <label class="field">${esc(T.emailL)}<input id="ebm" type="email" inputmode="email" autocomplete="email" maxlength="254" value="${esc(emailBind.email)}"></label>
      ${emailBind.ticket?`<label class="field">${esc(T.ebCode)}<input id="ebc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*"></label>`:''}
      <div class="btn2"><button class="btn${emailBind.ticket?'':' solid'}" id="ebs" type="button">${esc(T.ebSend)}</button>${emailBind.ticket?`<button class="btn solid" id="ebv" type="button">${esc(T.ebConfirm)}</button>`:''}</div></section>`:''}
    ${editing?'':`<section class="sec"><button class="btn" id="line-link" type="button">${esc(T.lineLink)}</button></section>
    <section class="sec"><button class="btn" id="feedback" type="button">${esc(T.feedback)}</button></section>
    ${kindNow(true)?`<section class="sec"><h2>${esc(T.home)}</h2><button type="button" class="btn" id="inst2" data-k="${kindNow(true)}">${esc(T.installLabel[kindNow(true)])}</button></section>`:''}
    ${data.organizer?`<section class="sec"><h2>${esc(T.manage)}</h2><a class="btn" href="/host">${esc(T.organizer)}</a></section>`:''}
    <section class="sec"><h2>${esc(T.language)}</h2>${langBar()}</section>
    <section class="sec"><button type="button" class="quiet" id="out">${esc(T.logout)}</button></section>`}`;
    if(editing){
      document.getElementById('ecancel').onclick=()=>{editing=false;me();window.scrollTo(0,0);};
      document.getElementById('save').onclick=async()=>{const b=document.getElementById('save');b.disabled=true;try{await post('/api/me/profile',{name:document.getElementById('nm').value.trim()||m.name||'會員',phone:document.getElementById('ph').value});toast(T.saved);editing=false;await load();return;}catch(e){toast(e.message||T.saveFail);}b.disabled=false;};
      return;
    }
    document.getElementById('eedit').onclick=()=>{editing=true;me();window.scrollTo(0,0);};
    if(!m.email){
      document.getElementById('ebs').onclick=async function(){const email=document.getElementById('ebm').value.trim();this.disabled=true;try{const d=await post('/api/me/email/start',{email,lang:LANG});emailBind={email,ticket:d.ticket};toast(T.ebSent);me();const c=document.getElementById('ebc');if(c)c.focus();}catch(e){toast(e.message||T.netFail);this.disabled=false;}};
      const v=document.getElementById('ebv');if(v)v.onclick=async function(){this.disabled=true;try{const d=await post('/api/me/email/verify',{ticket:emailBind.ticket,code:document.getElementById('ebc').value.trim()});try{localStorage.setItem(KEY,d.token);}catch(e){}emailBind={email:'',ticket:''};toast(d.merged?T.ebMerged:T.ebDone);await load();}catch(e){toast(e.message||T.netFail);this.disabled=false;}};
    }
    document.getElementById('hist-open2').onclick=openHistory;
    document.getElementById('line-link').onclick=async function(){this.disabled=true;try{const out=await post('/api/me/line-link');location.assign(out.url);}catch(e){toast(e.message||T.lineFail);this.disabled=false;}};
    document.getElementById('feedback').onclick=feedbackPage;
    bindInstall();bindLang();
    document.getElementById('out').onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(CACHE);}catch(e){}if(!(globalThis.EmojiSSO&&EmojiSSO.logout(location.origin+ROOT)))location.reload();};
  }
  window.__mApp={get,post,esc,toast,fmt,parseT,app,tabs,SITE,token,get LANG(){return LANG;},data:()=>data,openTicket,makeDetector};
  const eventPath=()=>window.MEvent?MEvent.slugFromPath(location.pathname):null;
  function eventDetail(slug){MEvent.mount({app,tabs,esc,toast,lang:LANG,slug,token,site:SITE,home:ROOT+(LANG==='zh'?'':'?lang='+LANG),me:data&&data.me,openTicket});}
  function paint(){const ep=eventPath();if(ep)return eventDetail(ep);if(window.MHost&&window.MHost.hostPath()!==null)return window.MHost.mount(window.__mApp);tabs.hidden=false;[...tabs.children].forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));if(data&&data.guest&&!['plan','events'].includes(tab)){login();tabs.hidden=false;}else ({home,book,plan,events,me})[tab]();window.scrollTo(0,0);}
  tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;editing=false;paint();};
  /* 全螢幕 QR：會員卡（結帳累點）與進出 QR 共用；亮度靠白底、30 秒更新 */
  const ov=document.getElementById('ov');let qrKind='card';
  const draw=(img,text)=>QRCode.toDataURL(text,{width:320,margin:1},(err,url)=>{if(!err)img.src=url;});
  async function refreshQr(){
    const img=document.getElementById('ovimg'),meta=document.getElementById('ovmeta'),sub=document.getElementById('ovsub');
    try{
      if(qrKind==='access'){const d=await get('/api/me/access-qr');draw(img,d.token);img.hidden=false;meta.textContent=T.accessTitle;sub.textContent=planName(d.plan)+(d.pending_activation?T.qrPending:'')+(d.exp?' · '+T.qrUntil+fmtTs(d.exp*1000):'');}
      else{const d=await get('/api/me/card');draw(img,d.token);img.hidden=false;meta.textContent=T.scanMe;sub.textContent='';}
    }catch(e){img.hidden=true;meta.textContent=offline||!navigator.onLine?(qrKind==='access'?T.qrOffline:T.hintPhone):(qrKind==='access'?(e.status===403?T.needPlan:T.qrFail):T.netFail);sub.textContent='';}
  }
  let ovClose=null;
  function showOv(){ov.dataset.keep='1';ov.classList.remove('out');ov.hidden=false;if(!ovClose||!pgStack.some(x=>x.el===ov))ovClose=pushPg(ov,()=>clearInterval(qrTimer));}
  function openQr(kind){qrKind=kind||'card';showOv();refreshQr();clearInterval(qrTimer);qrTimer=setInterval(refreshQr,30000);}
  /* 兌換：選品項→開相機掃本桌點餐 QR（服務人員開桌時印的 /order?s=場次&k=驗證碼）→伺服器扣點並把 0 元兌換行加進該桌點菜清單 */
  let scanStream=null,scanOv=null;
  let scanClose=null;
  function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}if(scanOv){const c=scanClose;scanOv=null;scanClose=null;if(c)c();}}
  function loadZx(){return window.ZXingWASM?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='/vendor/zxing-reader.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);});}
  async function makeDetector(){
    if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['qr_code']});return v=>d.detect(v).then(r=>r[0]&&r[0].rawValue).catch(()=>'');}
    await loadZx();const zx=window.ZXingWASM;
    try{zx.prepareZXingModule({overrides:{locateFile:(f,pre)=>f.endsWith('.wasm')?'/vendor/zxing_reader.wasm':pre+f},fireImmediately:true});}catch(e){}
    const c=document.createElement('canvas');
    return async v=>{const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return '';c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);const r=await zx.readBarcodes(x.getImageData(0,0,w,h),{formats:['QRCode'],textMode:'Plain',maxNumberOfSymbols:1}).catch(()=>[]);return r[0]&&r[0].text||'';};
  }
  function parseTable(raw){try{const u=new URL(raw);
    // KTV 點歌 QR（電視上的播放裝置 QR：app.emoji.tw/ktv?d=，舊版 ktv.emoji.tw/s?d=）也能用「掃碼」開啟（KK 11/6）
    if(/\.emoji\.tw$/.test(u.hostname)&&/^\/(ktv|s)\/?$/.test(u.pathname)&&u.searchParams.get('d'))return {ktv:u.searchParams.get('d')};
    if(!/\/order\/?$/.test(u.pathname))return null;const s=u.searchParams.get('s'),t=u.searchParams.get('t'),k=u.searchParams.get('k');return k&&(s||t)?{s,t,k}:null;}catch(e){return null;}}   // s＝服務人員給的本桌單次 QR；t＝桌上舊 QR（伺服器回停用訊息）
  /* 開相機掃本桌點餐 QR；sub＝說明文字，onTable(tb) 收到有效 QR 後處理 */
  async function scanTable(sub,onTable){
    stopScan();
    scanOv=document.createElement('div');scanOv.className='pg scanov center';
    scanOv.innerHTML='<header><button class="back" type="button"><b>‹</b><span>'+esc(T.back)+'</span></button><h3>'+esc(T.scanTitle)+'</h3></header><div class="body"><video playsinline muted></video><p>'+esc(sub)+'</p></div>';
    document.body.appendChild(scanOv);
    scanClose=pushPg(scanOv,()=>{if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}scanOv=null;scanClose=null;});
    scanOv.querySelector('.back').onclick=()=>{const c=scanClose;if(c)c();};
    const video=scanOv.querySelector('video'),mine=scanOv;
    try{
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      video.srcObject=scanStream;await video.play();
      const detect=await makeDetector();let busy=false,warned=0;
      const tick=async()=>{
        if(scanOv!==mine)return;
        const raw=busy?'':await detect(video);
        if(raw){const tb=parseTable(raw);
          if(!tb){if(Date.now()-warned>3000){warned=Date.now();toast(T.scanBad);}}
          else{busy=true;stopScan();await onTable(tb);return;}
        }
        setTimeout(tick,200);
      };
      tick();
    }catch(e){stopScan();toast(T.scanNoCam);}
  }
  async function startRedeem(id,name,pts){
    if(!confirm(T.redeemConfirm(name,pts)))return;
    await scanTable(T.scanSub(name),async tb=>{
      if(tb.ktv){toast(T.scanBad);return;}
      try{const d=await post('/api/me/redeem',{s:tb.s,t:tb.t,k:tb.k,item_id:id});toast(T.redeemDone(nm2(d.item),d.table)+d.balance);await load();}
      catch(e){toast(e.message||T.opFail);}
    });
  }
  /* 掃碼點餐：在 App 內開本桌點餐頁（同網域 /order，已登入的會員直接帶入）；不論 QR 印哪個網域都換成本站路徑 */
  function startOrder(){
    scanTable(T.orderScanSub,tb=>{
      if(tb.ktv){location.href='/ktv?d='+encodeURIComponent(tb.ktv);return;}
      // s＝三點水單次 QR；t＝在咖啡桌邊固定 QR（KK 11/3）
      location.href='/order?'+(tb.s?'s='+encodeURIComponent(tb.s):'t='+encodeURIComponent(tb.t))+'&k='+encodeURIComponent(tb.k)+(LANG==='zh'?'':'&lang='+LANG);
    });
  }
  const nm2=x=>LANG==='ja'&&x.ja?x.ja:LANG==='en'&&x.en?x.en:x.zh;
  function openCard(){openQr('card');}
  function closeQr(){if(ovClose&&pgStack.some(x=>x.el===ov))ovClose();}
  document.getElementById('ovx').onclick=closeQr;
  async function load(){
    try{
      await fulfillPlanIfNeeded();
      await fulfillShopIfNeeded();
      const s=await get('/api/state?view=member&lang='+LANG);let y={balance:0,phone:''},rw={items:[],space:[]};try{y=await get('/api/me/yan');}catch(e){}try{rw=await get('/api/me/rewards');}catch(e){}
      let rv=[],pk={pickups:[],dates:[],slots:{}},rg=[];try{rv=(await get('/api/me/reservations')).reservations||[];}catch(e){}try{pk=await get('/api/me/pickups');}catch(e){}try{rg=(await get('/api/me/registrations')).registrations||[];}catch(e){}let so=[],sst=false;try{const r=await get('/api/me/shop');so=r.orders||[];sst=!!r.stripe;}catch(e){}
      s.events=(s.events||[]);
      data={me:s.me,badges:s.badges||[],events:s.events,updates:s.updates||[],access:s.access||{},commitments:(s.commitments||[]).filter(c=>!s.me||c.user_id===s.me.id),yan:y,rewards:rw,reservations:rv,pickups:pk.pickups||[],pickupMeta:{dates:pk.dates||[],slots:pk.slots||{},prep_min:pk.prep_min},registrations:rg,shopOrders:so,shopStripe:sst,role:s.role,organizer:!!s.organizer};offline=false;
      try{localStorage.setItem(CACHE,JSON.stringify(data));}catch(e){}
      if(resumePendingPlan()){paint();return;}
    }catch(e){
      if(e.status===401){try{localStorage.removeItem(KEY);}catch(x){}return guest();}
      try{data=JSON.parse(localStorage.getItem(CACHE)||'null');}catch(x){data=null;}
      if(!data){app.innerHTML=`<p class="empty">${esc(T.netFail)}</p><button class="btn" id="reload" type="button">${esc(T.reload)}</button>`;document.getElementById('reload').onclick=()=>location.reload();return;}
      offline=true;
    }
    paint();
  }
  // /e/<slug> 要在 login() 前分流：訪客可直接瀏覽與報名；已登入時先取會員資料再畫（以 xxx 報名）
  // 單一登入：本機沒有 token 時先到 sso.emoji.tw 靜默取（已在其他言文字網站登入就直接帶回），跳轉中就不畫訪客畫面
  const boot=()=>{
  if(eventPath()){if(token())get('/api/state?view=member&lang='+LANG).then(s=>{data={me:s.me};}).catch(()=>{}).finally(()=>eventDetail(eventPath()));else eventDetail(eventPath());}
  else{if(PLAN_PRICES[query.get('plan')]||!token())tab='plan';if(!token())guest();else load();}// 訪客一進站先看方案與價格（櫃檯），按購買才登入
  };
  if(!token()&&globalThis.EmojiSSO)EmojiSSO.silent(KEY).then(going=>{if(!going)boot();});else boot();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token()&&!eventPath())load();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/m-sw.js',{scope:ROOT}).catch(()=>{});
  /* LINE 登入帶回主畫面 App（public/line-handoff.js）：回跳落在 Safari 時，App 回前景自動取回登入 */
  if(window.LineHandoff)LineHandoff.init(KEY,()=>{location.replace(location.pathname+location.search);});
})();
</script>
<script>(function(){var s=document.getElementById('splash'),a=document.getElementById('app'),t0=Date.now(),d=false;function hide(){if(d)return;d=true;mo.disconnect();setTimeout(function(){s.classList.add('out');setTimeout(function(){s.remove()},450)},Math.max(0,1000-(Date.now()-t0)))}var mo=new MutationObserver(function(){if(a.childNodes.length)hide()});mo.observe(a,{childList:true});if(a.childNodes.length)hide();setTimeout(hide,10000)})();</script>
</body>
