<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>言文字 會員</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="言文字">
<link rel="manifest" href="/m.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/m-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--soft:#3A362E;--muted:#5A5448;--paper:#FBFAF6;--alt:#F4F1EA;--line:#E4E0D6;--card:#fff;--accent:#FFDE34;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:1rem;line-height:1.6}
body{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);overscroll-behavior-y:contain}
[hidden]{display:none!important}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer}
.serif{font-family:"Noto Serif TC",serif}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:700;margin:0}
.hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hello h1{font-size:1.4rem}
.hello small{display:block;color:var(--muted);font-size:1rem;font-weight:400}
.mark{width:44px;height:44px}
/* 會員卡 */
.pass{background:var(--ink);color:var(--paper);border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(27,26,23,.18)}
.pass::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--accent);opacity:.95}
.pass .brand{position:relative;z-index:1;font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:.2em;font-size:1rem}
.pass .pts{position:relative;z-index:1;margin-top:34px}
.pass .pts span{display:block;font-size:1rem;margin-bottom:6px}
.pass .pts b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:600;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.pass .who{position:relative;z-index:1;margin-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:1rem}
.pass .who i{font-style:normal;opacity:.85}.pass .pts span{opacity:.85}
.show{margin-top:14px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--ink);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:10px}
.show:active{transform:scale(.98)}
.hint{color:var(--soft);font-size:1rem;margin:10px 2px 0;text-wrap:pretty}.nb{white-space:nowrap}
/* 區塊 */
.sec{margin-top:26px}
.sec h2{font-size:1.15rem;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:block;color:inherit;text-decoration:none}
.tile h3{font-size:1.05rem;margin-bottom:2px}
.tile .meta{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:0 .7em;font-size:1rem;margin-left:6px;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;font-weight:500;width:100%;text-decoration:none;color:var(--ink)}
.quiet{display:block;width:100%;margin-top:18px;min-height:48px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.btn.solid{background:var(--ink);color:var(--paper)}
/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,246,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:var(--tab);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:1rem}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=true]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current=true] svg{stroke-width:2.2}
/* 全螢幕 QR */
.ov{position:fixed;inset:0;z-index:30;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.ov[hidden]{display:none}
.ov img{width:min(78vw,320px);height:min(78vw,320px);background:#fff;border-radius:20px;padding:14px}
.ov p{margin:16px 0 0;opacity:.85}
.ov .x{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:48px;height:48px;border:0;background:none;color:var(--paper);font-size:2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 16px);background:var(--ink);color:var(--paper);padding:.7em 1.1em;border-radius:12px;z-index:40;max-width:90vw}
.toast[hidden]{display:none}
/* 登入 */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.login .mark{width:96px;height:96px;margin:0 auto}
.login h1{font-size:1.7rem}
.login p{color:var(--muted);margin:0;text-wrap:balance}
.offline{background:var(--alt);border:1px solid var(--line);color:var(--soft);border-radius:10px;padding:.4em .8em;margin-bottom:12px;text-align:center}
@media (prefers-reduced-motion:reduce){.show:active{transform:none}}
</style>
</head>
<body>
<main id="app" class="wrap"><p class="empty">載入中…</p></main>
<nav class="tabs" id="tabs" hidden aria-label="主選單">
  <button data-tab="home" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>會員卡</button>
  <button data-tab="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>活動</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我的</button>
</nav>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-label="會員 QR">
  <button class="x" id="ovx" aria-label="關閉">×</button>
  <img id="ovimg" alt="會員 QR" width="320" height="320">
  <p id="ovmeta">請出示給店員掃描</p>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script src="/vendor/qrcode.min.js"></script>
<script>
(function(){
  const KEY='tth_token', CACHE='m_cache';
  /* app.emoji.tw 是獨立網域：App 在根路徑，活動與完整會員專區連回官網 */
  const ON_APP=location.hostname==='app.emoji.tw', SITE=ON_APP?'https://www.emoji.tw':'', ROOT=ON_APP?'/':'/m';
  const app=document.getElementById('app'), tabs=document.getElementById('tabs');
  const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let tab='home', data=null, offline=false, qrTimer=null;
  const hash=new URLSearchParams(location.hash.slice(1));
  if(hash.get('token')){try{localStorage.setItem(KEY,hash.get('token'));}catch(e){}history.replaceState(null,'',location.pathname);}
  const token=()=>{try{return localStorage.getItem(KEY);}catch(e){return null;}};
  const MARK='<svg class="mark" viewBox="0 0 200 200" fill="none" stroke="#1B1A17" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M62 72C26 58 12 118 44 130 52 132 58 128 64 122"/><path d="M138 72C174 58 188 118 156 130 148 132 142 128 136 122"/><path d="M62 72C66 44 134 44 138 72 144 92 140 112 130 124M70 124C60 112 56 92 62 72"/><path d="M100 100C106 130 106 160 86 180"/><circle fill="#FFDE34" stroke="none" cx="84" cy="80" r="6"/><circle fill="#1B1A17" stroke="none" cx="116" cy="80" r="6"/></svg>';
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800);}
  async function get(path){const r=await fetch(path,{headers:{authorization:'Bearer '+token()}});if(r.status===401){const e=new Error('401');e.status=401;throw e;}if(!r.ok)throw new Error(r.status);return r.json();}
  function login(){
    tabs.hidden=true;
    app.innerHTML=`<div class="login">${MARK}<h1>言文字 會員</h1><p>登入後，用一張卡在所有空間累積點數、報名活動。</p><a class="btn solid" href="/auth/google?redirect=${encodeURIComponent(location.origin+ROOT)}">使用 Google 登入</a></div>`;
  }
  const fmt=v=>{if(!v)return '';const d=new Date(String(v).replace(/\//g,'-').replace(' ','T')+(String(v).length<=16?':00+08:00':''));return Number.isNaN(+d)?String(v):d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});};
  function nextEvent(){const list=(data.events||[]);return list.find(e=>e.registered)||list[0]||null;}
  function home(){
    const me=data.me||{},pts=(data.yan&&data.yan.balance)||0,ev=nextEvent();
    const phone=(data.yan&&data.yan.phone)||'';
    app.innerHTML=`${offline?'<div class="offline">目前離線，顯示上次的資料</div>':''}
    <div class="hello"><div><h1>${esc(me.name?'嗨，'+me.name:'歡迎回來')}</h1><small>${new Date().getHours()<12?'早安':new Date().getHours()<18?'午安':'晚安'}</small></div>${MARK}</div>
    <section class="pass" aria-label="會員卡"><div class="brand">言文字</div><div class="pts"><span>我的點數</span><b>${esc(pts)}</b></div><div class="who"><span>${esc(me.name||'')}</span><i>${esc(phone?phone.replace(/^\+886(\d{2})\d{4}(\d{3})$/,'0$1-****-$2'):'')}</i></div></section>
    <button class="show" id="show"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h3v4h-4v-3h4M18 14h3v3"/></svg>結帳時出示會員卡</button>
    <p class="hint">${phone?'也可以直接報手機號碼。':'到「我的」填寫手機，結帳報號碼就能累點。'}消費每滿 <span class="nb">100 元</span>累積 <span class="nb">1 點</span>，<span class="nb">1 點</span>折 <span class="nb">1 元</span>。</p>
    <section class="sec"><h2>下一場活動</h2>${ev?evTile(ev):'<p class="empty">目前沒有開放報名的活動</p>'}</section>`;
    document.getElementById('show').onclick=openQr;
  }
  function evTile(e){return `<a class="tile" href="${SITE}/events/${encodeURIComponent(e.slug||e.id)}"><h3>${esc(e.title)}${e.registered?'<span class="tag">已報名</span>':''}</h3><div class="meta">${esc(fmt(e.starts_at))}${e.location?' · '+esc(e.location):''}</div></a>`;}
  function events(){
    const list=data.events||[];
    app.innerHTML=`<div class="hello"><h1>活動</h1></div>${list.length?list.map(evTile).join(''):'<p class="empty">目前沒有開放報名的活動</p>'}`;
  }
  function me(){
    const m=data.me||{},phone=(data.yan&&data.yan.phone)||m.phone||'';
    app.innerHTML=`<div class="hello"><h1>我的</h1></div>
    <div class="row"><span>姓名</span><b>${esc(m.name||'')}</b></div>
    <div class="row"><span>Email</span><b>${esc(m.email||'')}</b></div>
    <div class="row"><span>手機</span><b>${esc(phone?phone.replace(/^\+886/,'0'):'尚未填寫')}</b></div>
    <section class="sec"><h2>更新資料</h2>
      <label style="display:block;color:var(--soft)">手機（09 開頭，結帳報號碼就能累點）<input id="ph" type="tel" inputmode="tel" autocomplete="tel" value="${esc(m.phone||'')}" style="display:block;width:100%;margin-top:6px;min-height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:1rem;background:#fff"></label>
      <button class="btn solid" id="save" style="margin-top:12px">儲存</button></section>
    <section class="sec"><a class="btn" href="${SITE}/member">完整會員專區</a><button class="quiet" id="out">登出</button></section>`;
    document.getElementById('save').onclick=async()=>{const b=document.getElementById('save');b.disabled=true;try{const r=await fetch('/api/me/profile',{method:'POST',headers:{authorization:'Bearer '+token(),'content-type':'application/json'},body:JSON.stringify({name:m.name||'會員',phone:document.getElementById('ph').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'儲存失敗');toast('已儲存');await load();}catch(e){toast(e.message);}b.disabled=false;};
    document.getElementById('out').onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(CACHE);}catch(e){}location.reload();};
  }
  function paint(){tabs.hidden=false;[...tabs.children].forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));({home,events,me})[tab]();window.scrollTo(0,0);}
  tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;paint();};
  /* 全螢幕 QR：亮度靠白底、30 秒更新 */
  const ov=document.getElementById('ov');
  async function refreshQr(){const img=document.getElementById('ovimg'),meta=document.getElementById('ovmeta');try{const d=await get('/api/me/card');QRCode.toDataURL(d.token,{width:320,margin:1},(err,url)=>{if(!err)img.src=url;});meta.textContent='請出示給店員掃描';}catch(e){meta.textContent=offline||!navigator.onLine?'需要網路才能顯示會員卡，也可以直接報手機號碼':'暫時無法產生，請稍後再試';}}
  function openQr(){ov.hidden=false;refreshQr();qrTimer=setInterval(refreshQr,30000);}
  function closeQr(){ov.hidden=true;clearInterval(qrTimer);}
  document.getElementById('ovx').onclick=closeQr;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQr();});
  async function load(){
    try{
      const s=await get('/api/state');let y={balance:0,phone:''};try{y=await get('/api/me/yan');}catch(e){}
      s.events=(s.events||[]);data={me:s.me,events:s.events,yan:y};offline=false;
      try{localStorage.setItem(CACHE,JSON.stringify(data));}catch(e){}
    }catch(e){
      if(e.status===401){try{localStorage.removeItem(KEY);}catch(x){}return login();}
      try{data=JSON.parse(localStorage.getItem(CACHE)||'null');}catch(x){data=null;}
      if(!data){app.innerHTML='<p class="empty">連線失敗，請稍後再試<br><br><button class="btn" onclick="location.reload()">重新整理</button></p>';return;}
      offline=true;
    }
    paint();
  }
  if(!token())login();else load();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token())load();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/m-sw.js',{scope:ROOT}).catch(()=>{});
})();
</script>
</body>
</html>
