<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>言文字 會員</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="言文字">
<link rel="manifest" href="/m.webmanifest">
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/m-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--soft:#3A362E;--muted:#5A5448;--paper:#FBFAF6;--alt:#F4F1EA;--line:#E4E0D6;--card:#fff;--accent:#FFDE34;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:1rem;line-height:1.6;line-break:strict;word-break:auto-phrase;overflow-wrap:break-word}
body{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);overscroll-behavior-y:contain}
[hidden]{display:none!important}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer}
.serif{font-family:"Noto Serif TC",serif}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px}
h1,h2,h3,.btn,.show,.rwb,.quick a,.quick button,.status{text-wrap:balance}
h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:700;margin:0}
.hello{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hello h1{font-size:1.4rem}
.hello small{display:block;color:var(--muted);font-size:1rem;font-weight:400}
.mark{width:44px;height:44px}
/* 會員卡 */
.pass{background:var(--ink);color:var(--paper);border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(27,26,23,.18)}
.pass::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--accent);opacity:.95}
.pass .brand{position:relative;z-index:1;font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:.2em;font-size:1rem}
.pass .pts{position:relative;z-index:1;margin-top:34px}
.pass .pts span{display:block;font-size:1rem;margin-bottom:6px}
.pass .pts b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:600;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.pass .who{position:relative;z-index:1;margin-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:1rem}
.pass .who i{font-style:normal;opacity:.85}.pass .pts span{opacity:.85}
.show{margin-top:14px;width:100%;min-height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--ink);font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:10px}
.show:active{transform:scale(.98)}
.hint{color:var(--soft);font-size:1rem;margin:10px 2px 0;text-wrap:pretty}.nb{white-space:nowrap}
/* 區塊 */
.sec{margin-top:26px}
.sec h2{font-size:1.15rem;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:block;color:inherit;text-decoration:none}
.tile h3{font-size:1.05rem;margin-bottom:2px}
.tile .meta{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:0 .7em;font-size:1rem;margin-left:6px;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;font-weight:500;width:100%;text-decoration:none;color:var(--ink)}
.quiet{display:block;width:100%;margin-top:18px;min-height:48px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.btn.solid{background:var(--ink);color:var(--paper)}
/* 安裝引導 */
.install{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:16px;margin-top:18px}
.install h3{font-size:1.05rem}
.install p{margin:4px 0 12px;color:var(--soft)}
.install .irow{display:flex;gap:10px;align-items:center}
.install .btn{width:auto;flex:1;padding:0 16px}
.install .later{min-height:48px;padding:0 14px;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.pg{position:fixed;inset:0;z-index:50;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;animation:pgin .26s cubic-bezier(.2,.8,.2,1)}
.pg.out{animation:pgout .2s ease-in forwards}
@keyframes pgin{from{transform:translateX(100%)}to{transform:none}}
@keyframes pgout{to{transform:translateX(100%)}}
.pg[hidden]{display:none}
.pg>header{display:flex;align-items:center;min-height:56px;padding:env(safe-area-inset-top) 6px 0;border-bottom:1px solid var(--line);background:rgba(251,250,246,.96)}
.pg .back{min-height:48px;min-width:48px;padding:0 14px 0 8px;border:0;background:none;color:var(--ink);font:inherit;font-size:1.1rem;display:flex;align-items:center;gap:2px}
.pg .back b{font-size:1.9rem;line-height:1;font-weight:400}
.pg>header h3{font-size:1.05rem;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}
.pg .body{flex:1;overflow:auto;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-width:480px;width:100%;margin:0 auto}
.pg.center .body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pg ol{padding-left:1.3em;margin:12px 0 16px}
.pg li{margin:10px 0}
.pg .note{color:var(--muted);margin:0 0 14px;text-wrap:pretty}
/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,250,246,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:var(--tab);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:1rem;white-space:nowrap;min-width:0;padding:0 2px;line-height:1.3}
nav.tabs button span{white-space:nowrap}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=true]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current=true] svg{stroke-width:2.2}
/* 全螢幕 QR */
.ov img{width:min(78vw,320px);height:min(78vw,320px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px}
.ov p{margin:16px 0 0;color:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));background:var(--ink);color:var(--paper);padding:.7em 1.1em;border-radius:12px;z-index:40;max-width:90vw}
.toast[hidden]{display:none}
/* 登入 */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.login .mark{width:88px;height:88px;margin:0 auto 4px}
.login h1{font-size:1.7rem}
.login p{color:var(--muted);margin:0;text-wrap:balance}
.login .ways{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.login .way{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 56px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:500;font-size:1.05rem;text-decoration:none;font-family:inherit}
.login .way svg{position:absolute;left:18px;top:50%;width:24px;height:24px;transform:translateY(-50%)}
.login .way.line{background:#06C755;border-color:#06C755;color:#fff}
.login .way.email{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.login .way:active{transform:scale(.985)}
.login .first{margin-top:14px}
.login .ef{text-align:left;margin-top:8px}
.login .ef .btn{margin-top:16px}
.login .sent{background:var(--alt);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:22px}
.login .sent b{display:block;font-size:1.1rem;margin-bottom:6px}
.login .lang{margin-top:22px}
.offline{background:var(--alt);border:1px solid var(--line);color:var(--soft);border-radius:10px;padding:.4em .8em;margin-bottom:12px;text-align:center}
/* 預約表單 */
.fld{display:block;color:var(--soft);margin-top:12px}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:6px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-family:inherit;font-size:1rem;color:var(--ink)}
.fld textarea{min-height:72px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg button{min-height:48px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-size:1rem}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg#pkd button{white-space:nowrap;padding:6px 4px;border-radius:16px;line-height:1.35}
.seg button{flex:1 1 calc(33.333% - 8px)}.seg.two button{flex:1 1 calc(50% - 8px)}
.mi .q button:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slots button{min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:1rem;font-variant-numeric:tabular-nums}
.slots button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.slots h4{grid-column:1/-1;margin:8px 0 0;font-weight:500;color:var(--muted)}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mi .nm{flex:1}.mi .nm small{display:block;color:var(--muted);font-size:1rem}
.mi .q{display:flex;align-items:center;gap:4px}
.mi .q button{width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;background:transparent;font-size:1.3rem;line-height:1}
.mi .q b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.cat{margin:18px 0 4px;color:var(--muted);font-weight:500}
.tile .act{display:flex;gap:10px;margin-top:12px}.tile .act .btn{min-height:44px;flex:1}
.tile .act .quiet{margin:0;width:auto;flex:1;min-height:44px}
.sticky{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 8px);background:var(--paper);padding:10px 0 2px}
.pill{display:inline-block;border-radius:999px;padding:0 .7em;font-size:1rem;border:1px solid var(--line);margin-left:6px;color:var(--muted)}
.pill.on{background:var(--accent);border-color:var(--ink);color:var(--ink)}
/* 快捷 */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.quick a,.quick button{min-height:84px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:500;font-size:1rem;white-space:nowrap;min-width:0;padding:0 4px}
.quick svg{width:26px;height:26px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rw b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-size:1.5rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rw small{display:block;color:var(--muted);font-size:1rem}
.rwb{min-height:44px;min-width:72px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-size:1.05rem;padding:0 1em;cursor:pointer}
.scanov .body{align-items:center;justify-content:center;gap:16px}
.scanov video{width:100%;max-width:420px;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#000}
.rw.ok b{background:var(--accent);border-radius:999px;padding:0 .6em}
/* 會籍 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.eyebrow{font-size:1rem;letter-spacing:.12em;color:var(--muted)}
.status{font-family:"Noto Serif TC",serif;font-size:1.2rem;font-weight:700;margin:.2em 0 .6em}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);margin-bottom:12px}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:6px 12px;background:var(--card);font-weight:500}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.chip .dot.on{background:var(--accent);border:1px solid var(--ink)}
.plan.promo .tag{display:inline-block;padding:2px 8px;border-radius:999px;background:#FFDE34;color:#1a1a1a;font-size:1rem;font-weight:600}
  .plan{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.plan button,.plan a{min-height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font-weight:500;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap}
.ev{display:block;padding:14px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.ev h3{font-size:1.05rem}.ev .meta2{color:var(--muted);margin-top:2px}.ev p{color:var(--soft);margin:.3em 0 0;white-space:pre-wrap}
.upd{padding:12px 0;border-top:1px solid var(--line)}.upd time{display:block;color:var(--muted)}.upd p{color:var(--soft);margin:.3em 0 0;white-space:pre-wrap}
.field{display:block;color:var(--soft);margin-top:12px}
.field input{display:block;width:100%;margin-top:6px;min-height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:1rem;background:#fff;color:var(--ink)}
.field input:disabled{background:var(--alt);color:var(--muted)}
.lang{display:flex;gap:8px}.lang button{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:transparent}.lang button[aria-pressed=true]{border-color:var(--ink);font-weight:700;background:var(--accent)}
.ov .sub{color:var(--muted);margin:6px 0 0}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.rcard .ph{aspect-ratio:4/3;width:100%;object-fit:cover;background:var(--alt);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rcard .ph svg{width:36px;height:36px}
.rcard.lock .ph{opacity:.55}
.rcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.rcard .nm{font-weight:500;line-height:1.35}
.rcard .pt{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:600;font-size:1.4rem;font-variant-numeric:tabular-nums}
.rcard .rwb{margin-top:auto;width:100%}
.rcard .need{margin-top:auto;color:var(--muted)}
.ecard{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;margin-bottom:14px}
.ecard .cv{aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:var(--accent)}
.ecard .cv.ph{display:flex;align-items:center;justify-content:center}.ecard .cv.ph svg{width:48px;height:48px}
.ecard .bd{padding:14px 16px 16px}
.ecard h3{font-size:1.1rem;margin-bottom:4px}
.ecard .meta2{color:var(--muted)}
.ecard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ecard .price{font-weight:700}
.ecard p{color:var(--soft);margin:.4em 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd.mute,.upd.mute p{color:var(--muted)}
.row.view b{text-align:right;word-break:break-all}
.ghost{color:var(--muted)}
@media (max-width:340px){.quick{gap:6px}.quick a,.quick button{padding:0 1px}.wrap{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){.show:active{transform:none}}
</style>
<style>html,body{touch-action:manipulation}/* 進場動畫：言字筆畫依序落下，黃圓暈開；內容就緒後淡出 */
#splash{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
#splash .sp::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);transform:scale(.2);opacity:0;animation:spdot .7s cubic-bezier(.2,.8,.2,1) .05s forwards,sppulse 1.8s ease-in-out .9s infinite}
#splash svg{position:relative;width:84px;height:84px;overflow:visible}
#splash path{fill:var(--ink);opacity:0;transform:translateY(-14px);transform-box:fill-box;animation:spstroke .5s cubic-bezier(.2,.8,.2,1) calc(.25s + var(--i)*.11s) forwards}
@keyframes spdot{to{transform:scale(1);opacity:1}}
@keyframes spstroke{to{opacity:1;transform:none}}
@keyframes sppulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){#splash .sp::before,#splash path{animation:none;opacity:1;transform:none}}
</style>

  const syncPkGo=()=>{const g=document.getElementById('pkgo');if(g){g.disabled=!pkCount();g.textContent=T.submitPickup+(pkCount()?T.itemsN(pkCount()):'');}};
  // 套餐內容文字：「貝果：原味貝果／飲品：拿鐵咖啡（溫度：熱）」；來源是 PK.combos（尚未送出）或已建立預約的 line.parts
  const partName=p=>LANG==='ja'&&p.ja?p.ja:LANG==='en'&&p.en?p.en:p.zh;
  const comboLine=c=>(c.qty>1?'×'+c.qty+' ':'')+c.labels.join('／');
  const partsText=l=>(l.parts||[]).map(p=>OrderLib.slotLabel(p.slot,LANG)+'：'+partName(p)+(p.note?'（'+p.note+'）':'')).join('／');
  function openComboPicker(it,venue){

    groups.forEach(g=>{picks[g.key]=g.choices[0];});

    const draw=()=>{
      const act=OrderLib.activeOptionGroups(groups,picks);

        +act.map(g=>`<div class="fld">${esc(g.label)}<div class="seg" data-g="${esc(g.key)}">${g.choices.map(c=>`<button type="button" data-v="${esc(c)}" aria-pressed="${picks[g.key]===c}">${esc(c)}</button>`).join('')}</div></div>`).join('')

      el.querySelector('#cadd').onclick=()=>{
        const payload=OrderLib.comboPayload(groups,picks),zhGroups=OrderLib.comboGroups(it,MENU.items,'zh');
        const labels=groups.filter(g=>g.combo).map(g=>{const i=g.choices.indexOf(picks[g.key]);const v=payload[g.key];const sub=OrderLib.activeOptionGroups(groups,picks).filter(s=>s.sub&&s.sub.slot===g.key&&s.sub.label===g.choices[i<0?0:i]).map(s=>picks[s.key]||s.choices[0]);return g.label+'：'+g.choices[i<0?0:i].replace(/ \(\+\d+\)$/,'')+(sub.length?'（'+sub.join('、')+'）':'');});
        PK.combos.push({id:it.id,qty,combo:payload,labels});
        close();renderPickMenu(venue);syncPkGo();
      };
    };
    el.innerHTML=`<header><button class="back" type="button" id="cb"><b>‹</b><span>${esc(T.back)}</span></button></header><div class="body"></div>`;
    document.body.appendChild(el);const close=pushPg(el);el.querySelector('#cb').onclick=close;draw();
  }
  async function submitPickup(){
    const b=document.getElementById('pkgo');b.disabled=true;
    try{const items=Object.entries(PK.qty).filter(([,n])=>n>0).map(([item_id,qty])=>({item_id,qty})).concat((PK.combos||[]).map(c=>({item_id:c.id,qty:c.qty,combo:c.combo})));await post('/api/me/pickups',{date:PK.date,time:PK.time,items,note:PK.note});toast(T.pickupOk);PK={date:'',time:'',qty:{},combos:[],note:''};sub='list';await load();}
    catch(e){toast(e.message||T.opFail);b.disabled=false;}
  }
  /* ---- 會籍 ---- */
  function accessInfo(){
    const a=data.access||{},act=Array.isArray(a.activeEntitlements)?a.activeEntitlements:[],pend=Array.isArray(a.pending)?a.pending:[],ents=Array.isArray(a.entitlements)?a.entitlements:[];
    const c=(data.commitments||[])[0]||null;
    return {active:!!a.active,act,pend,ents,c,canIssue:act.length>0||pend.length>0};
  }
  function plan(){
    const {active,act,pend,ents,c,canIssue}=accessInfo();
    const primary=act[0]||pend[0]||null;
    const label=primary?planName(primary.plan):(c?planName('founding'):'');
    const had=ents.length>0||!!c;
    const title=active?T.statusActive(label||T.plans.fallback):pend.length?T.statusPending:had?T.statusExpired:T.statusNone;
    let s=null,e=null;
    if(act[0]&&act[0].starts_at&&act[0].ends_at){s=parseT(act[0].starts_at)||new Date(act[0].starts_at);e=parseT(act[0].ends_at)||new Date(act[0].ends_at);}
    else if(c&&c.start_date&&c.maturity_date){s=new Date(c.start_date);e=new Date(c.maturity_date);}
    const now=new Date();let bar='',left='';
    if(s&&e&&e>s&&!Number.isNaN(+s)&&!Number.isNaN(+e)){const pct=Math.min(100,Math.max(0,(now-s)/(e-s)*100)),dl=Math.max(0,Math.ceil((e-now)/864e5));bar=`<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>`;left=dl>0?T.daysLeft(dl):T.statusExpired;}
    else if(pend.length)left=T.statusPending;
    const period=s&&e&&!Number.isNaN(+s)&&!Number.isNaN(+e)?fmtDate(s)+' – '+fmtDate(e):'';
    const right=[label,period].filter(Boolean).join(' · ');
    const chipLabel=active?T.accessOn:pend.length?T.accessPending:T.accessOff;
    const promo=promoOpen()?`<div class="plan promo"><span><b class="tag">${esc(T.promoTag)}</b> ${esc(T.promoName)}<br><small style="color:var(--muted)">${esc(T.promoNote)}</small></span><button type="button" data-plan="year_promo">${esc(T.buyBtn(PLAN_PRICES.year_promo))}</button></div>`:'';
    const rows=promo+['day_4h','day_12h','month','quarter','year'].map(id=>`<div class="plan"><span>${esc(T.plans[id])}</span><button type="button" data-plan="${id}">${esc(T.buyBtn(PLAN_PRICES[id]))}</button></div>`).join('');
    app.innerHTML=`<div class="hello"><h1>${esc(T.plan)}</h1></div>
    <section class="panel"><div class="eyebrow">${esc(T.statusLabel)}</div><div class="status">${esc(title)}</div>${bar}${left||right?`<div class="meta"><span>${esc(left)}</span><span>${esc(right)}</span></div>`:''}
      <div class="btn2"><button class="btn solid" id="plans-toggle">${esc(had?T.renew:T.buy)}</button><button class="chip" id="access-chip"${canIssue?'':' data-blocked="1"'}><span class="dot${active?' on':''}"></span>${esc(chipLabel)}</button></div>
      <div id="plans" hidden style="margin-top:12px"><div class="eyebrow">${esc(T.plansTitle)}</div>${rows}</div></section>
    <section class="panel"><div class="eyebrow">${esc(T.accessTitle)}</div><p class="hint" style="margin:6px 0 12px">${esc(T.accessNote)}</p><button class="btn" id="access-qr">${esc(T.accessQr)}</button></section>
    ${c?`<p class="hint ghost">${esc(T.founderYes)}${c.cert_no?' · No. '+esc(c.cert_no):''}</p>`:''}`;
    const drawer=document.getElementById('plans');
    document.getElementById('plans-toggle').onclick=()=>{drawer.hidden=!drawer.hidden;};
    document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>buyPlan(b.dataset.plan,b));
    const openAccess=()=>{if(!canIssue){toast(T.needPlan);return;}openQr('access');};
    document.getElementById('access-chip').onclick=openAccess;
    document.getElementById('access-qr').onclick=openAccess;
  }
  async function buyPlan(id,btn){
    btn.disabled=true;
    try{const d=await post('/api/me/plans/checkout',{plan:id,lang:LANG});location.href=d.url;}
    catch(e){toast(e.status===503?T.planFail:(e.message||T.netFail));btn.disabled=false;}
  }
  async function fulfillPlanIfNeeded(){
    const q=new URLSearchParams(location.search);
    const clean=()=>{['plan_paid','plan_canceled','s'].forEach(k=>q.delete(k));history.replaceState(null,'',location.pathname+(q.size?'?'+q:''));};
    if(q.get('plan_canceled')==='1'){clean();toast(T.planCanceled);return;}
    if(q.get('plan_paid')!=='1')return;
    const s=q.get('s');if(!s||!token())return;
    toast(T.planVerifying);
    try{const d=await post('/api/me/plans/verify',{session_id:s});if(d.ok===true){clean();toast(T.planPaid);tab='plan';}}
    catch(e){toast(e.message||T.netFail);}
  }
  let editing=false;
  function me(){
    const m=data.me||{},phone=(data.yan&&data.yan.phone)||m.phone||'';
    const view=`<div class="row view"><span>${esc(T.name)}</span><b>${esc(m.name||'')}</b></div>
    <div class="row view"><span>${esc(T.emailL)}</span><b>${esc(m.email||'')}</b></div>
    <div class="row view"><span>${esc(T.phone)}</span><b>${esc(phone?phone.replace(/^\+886/,'0'):T.noPhone)}</b></div>`;
    const form=`<section class="sec"><label class="field">${esc(T.name)}<input id="nm" maxlength="80" autocomplete="name" value="${esc(m.name||'')}"></label>
      <label class="field">${esc(T.emailL)}<input value="${esc(m.email||'')}" disabled></label>
      <label class="field">${esc(T.phoneHint)}<input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" value="${esc(m.phone||'')}"></label>
      <div class="btn2" style="margin-top:12px"><button class="btn" id="ecancel" type="button">${esc(T.cancelEdit)}</button><button class="btn solid" id="save" type="button">${esc(T.save)}</button></div></section>`;
    app.innerHTML=`<div class="hello"><h1>${esc(T.me)}</h1>${editing?'':`<button class="btn" id="eedit" type="button" style="width:auto;min-height:44px;padding:0 18px">${esc(T.editBtn)}</button>`}</div>
    ${editing?form:view}
    ${editing?'':`<section class="sec"><button class="btn" id="line-link">${esc(T.lineLink)}</button></section>
    ${kindNow(true)?`<section class="sec"><h2>${esc(T.home)}</h2><button class="btn" id="inst2" data-k="${kindNow(true)}">${esc(T.installLabel[kindNow(true)])}</button></section>`:''}
    ${data.role==='admin'||data.organizer?`<section class="sec"><h2>${esc(T.manage)}</h2>${data.role==='admin'?`<a class="btn" href="https://admin.emoji.tw/admin">${esc(T.admin)}</a>`:''}${data.organizer?`<a class="btn" href="/host" style="margin-top:10px">${esc(T.organizer)}</a>`:''}</section>`:''}
    <section class="sec"><h2>${esc(T.language)}</h2>${langBar()}</section>
    <section class="sec"><button class="quiet" id="out">${esc(T.logout)}</button></section>`}`;
    if(editing){
      document.getElementById('ecancel').onclick=()=>{editing=false;me();window.scrollTo(0,0);};
      document.getElementById('save').onclick=async()=>{const b=document.getElementById('save');b.disabled=true;try{await post('/api/me/profile',{name:document.getElementById('nm').value.trim()||m.name||'會員',phone:document.getElementById('ph').value});toast(T.saved);editing=false;await load();return;}catch(e){toast(e.message||T.saveFail);}b.disabled=false;};
      return;
    }
    document.getElementById('eedit').onclick=()=>{editing=true;me();window.scrollTo(0,0);};
    document.getElementById('line-link').onclick=async function(){this.disabled=true;try{const out=await post('/api/me/line-link');location.assign(out.url);}catch(e){toast(e.message||T.lineFail);this.disabled=false;}};
    bindInstall();bindLang();
    document.getElementById('out').onclick=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(CACHE);}catch(e){}location.reload();};
  }
  window.__mApp={get,post,esc,toast,fmt,parseT,app,tabs,SITE,token,get LANG(){return LANG;},data:()=>data,openTicket,makeDetector};
  const eventPath=()=>window.MEvent?MEvent.slugFromPath(location.pathname):null;
  function eventDetail(slug){MEvent.mount({app,tabs,esc,toast,lang:LANG,slug,token,site:SITE,home:ROOT+(LANG==='zh'?'':'?lang='+LANG),me:data&&data.me,openTicket});}
  function paint(){const ep=eventPath();if(ep)return eventDetail(ep);if(window.MHost&&window.MHost.hostPath()!==null)return window.MHost.mount(window.__mApp);tabs.hidden=false;[...tabs.children].forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));({home,book,plan,events,me})[tab]();window.scrollTo(0,0);}
  tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;editing=false;paint();};
  /* 全螢幕 QR：會員卡（結帳累點）與進出 QR 共用；亮度靠白底、30 秒更新 */
  const ov=document.getElementById('ov');let qrKind='card';
  const draw=(img,text)=>QRCode.toDataURL(text,{width:320,margin:1},(err,url)=>{if(!err)img.src=url;});
  async function refreshQr(){
    const img=document.getElementById('ovimg'),meta=document.getElementById('ovmeta'),sub=document.getElementById('ovsub');
    try{
      if(qrKind==='access'){const d=await get('/api/me/access-qr');draw(img,d.token);img.style.display='';meta.textContent=T.accessTitle;sub.textContent=planName(d.plan)+(d.pending_activation?T.qrPending:'')+(d.exp?' · '+T.qrUntil+fmtTs(d.exp*1000):'');}
      else{const d=await get('/api/me/card');draw(img,d.token);img.style.display='';meta.textContent=T.scanMe;sub.textContent='';}
    }catch(e){img.style.display='none';meta.textContent=offline||!navigator.onLine?(qrKind==='access'?T.qrOffline:T.hintPhone):(qrKind==='access'?(e.status===403?T.needPlan:T.qrFail):T.netFail);sub.textContent='';}
  }
  let ovClose=null;
  function showOv(){ov.dataset.keep='1';ov.classList.remove('out');ov.hidden=false;if(!ovClose||!pgStack.some(x=>x.el===ov))ovClose=pushPg(ov,()=>clearInterval(qrTimer));}
  function openQr(kind){qrKind=kind||'card';showOv();refreshQr();clearInterval(qrTimer);qrTimer=setInterval(refreshQr,30000);}
  /* 兌換：選品項→開相機掃桌上點菜 QR（/order?t=桌號&k=驗證碼）→伺服器扣點並把 0 元兌換行加進該桌點菜清單 */
  let scanStream=null,scanOv=null;
  let scanClose=null;
  function stopScan(){if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}if(scanOv){const c=scanClose;scanOv=null;scanClose=null;if(c)c();}}
  function loadZx(){return window.ZXingWASM?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='/vendor/zxing-reader.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);});}
  async function makeDetector(){
    if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['qr_code']});return v=>d.detect(v).then(r=>r[0]&&r[0].rawValue).catch(()=>'');}
    await loadZx();const zx=window.ZXingWASM;
    try{zx.prepareZXingModule({overrides:{locateFile:(f,pre)=>f.endsWith('.wasm')?'/vendor/zxing_reader.wasm':pre+f},fireImmediately:true});}catch(e){}
    const c=document.createElement('canvas');
    return async v=>{const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return '';c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);const r=await zx.readBarcodes(x.getImageData(0,0,w,h),{formats:['QRCode'],textMode:'Plain',maxNumberOfSymbols:1}).catch(()=>[]);return r[0]&&r[0].text||'';};
  }
  function parseTable(raw){try{const u=new URL(raw);if(!/\/order\/?$/.test(u.pathname))return null;const t=u.searchParams.get('t'),k=u.searchParams.get('k');return t&&k?{t,k}:null;}catch(e){return null;}}
  async function startRedeem(id,name,pts){
    if(!confirm(T.redeemConfirm(name,pts)))return;
    stopScan();
    scanOv=document.createElement('div');scanOv.className='pg scanov center';
    scanOv.innerHTML='<header><button class="back" type="button"><b>‹</b><span>'+esc(T.back)+'</span></button><h3>'+esc(T.scanTitle)+'</h3></header><div class="body"><video playsinline muted></video><p>'+esc(T.scanSub(name))+'</p></div>';
    document.body.appendChild(scanOv);
    scanClose=pushPg(scanOv,()=>{if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}scanOv=null;scanClose=null;});
    scanOv.querySelector('.back').onclick=()=>{const c=scanClose;if(c)c();};
    const video=scanOv.querySelector('video'),mine=scanOv;
    try{
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      video.srcObject=scanStream;await video.play();
      const detect=await makeDetector();let busy=false,warned=0;
      const tick=async()=>{
        if(scanOv!==mine)return;
        const raw=busy?'':await detect(video);
        if(raw){const tb=parseTable(raw);
          if(!tb){if(Date.now()-warned>3000){warned=Date.now();toast(T.scanBad);}}
          else{busy=true;stopScan();
            try{const d=await post('/api/me/redeem',{t:tb.t,k:tb.k,item_id:id});toast(T.redeemDone(nm2(d.item),d.table)+d.balance);await load();}
            catch(e){toast(e.message||T.opFail);}
            return;}
        }
        setTimeout(tick,200);
      };
      tick();
    }catch(e){stopScan();toast(T.scanNoCam);}
  }
  const nm2=x=>LANG==='ja'&&x.ja?x.ja:LANG==='en'&&x.en?x.en:x.zh;
  function openCard(){openQr('card');}
  function closeQr(){if(ovClose&&pgStack.some(x=>x.el===ov))ovClose();}
  document.getElementById('ovx').onclick=closeQr;
  async function load(){
    try{
      await fulfillPlanIfNeeded();
      const s=await get('/api/state?lang='+LANG);let y={balance:0,phone:''},rw={items:[],space:[]};try{y=await get('/api/me/yan');}catch(e){}try{rw=await get('/api/me/rewards');}catch(e){}
      let rv=[],pk={pickups:[],dates:[],slots:{}},rg=[];try{rv=(await get('/api/me/reservations')).reservations||[];}catch(e){}try{pk=await get('/api/me/pickups');}catch(e){}try{rg=(await get('/api/me/registrations')).registrations||[];}catch(e){}
      s.events=(s.events||[]);
      data={me:s.me,events:s.events,updates:s.updates||[],access:s.access||{},commitments:(s.commitments||[]).filter(c=>!s.me||c.user_id===s.me.id),yan:y,rewards:rw,reservations:rv,pickups:pk.pickups||[],pickupMeta:{dates:pk.dates||[],slots:pk.slots||{},prep_min:pk.prep_min},registrations:rg,role:s.role,organizer:!!s.organizer};offline=false;
      try{localStorage.setItem(CACHE,JSON.stringify(data));}catch(e){}
    }catch(e){
      if(e.status===401){try{localStorage.removeItem(KEY);}catch(x){}return login();}
      try{data=JSON.parse(localStorage.getItem(CACHE)||'null');}catch(x){data=null;}
      if(!data){app.innerHTML=`<p class="empty">${esc(T.netFail)}<br><br><button class="btn" onclick="location.reload()">${esc(T.reload)}</button></p>`;return;}
      offline=true;
    }
    paint();
  }
  // /e/<slug> 要在 login() 前分流：訪客可直接瀏覽與報名；已登入時先取會員資料再畫（以 xxx 報名）
  if(eventPath()){if(token())get('/api/state?lang='+LANG).then(s=>{data={me:s.me};}).catch(()=>{}).finally(()=>eventDetail(eventPath()));else eventDetail(eventPath());}
  else if(!token())login();else load();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token()&&!eventPath())load();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/m-sw.js',{scope:ROOT}).catch(()=>{});
})();
</script>
<script>(function(){var s=document.getElementById('splash'),a=document.getElementById('app'),t0=Date.now(),d=false;function hide(){if(d)return;d=true;mo.disconnect();setTimeout(function(){s.classList.add('out');setTimeout(function(){s.remove()},450)},Math.max(0,1000-(Date.now()-t0)))}var mo=new MutationObserver(function(){if(a.childNodes.length)hide()});mo.observe(a,{childList:true});if(a.childNodes.length)hide();setTimeout(hide,10000)})();</script>
