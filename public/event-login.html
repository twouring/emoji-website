<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Email 登入 · 言文字</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/stylebook/components.css"><link rel="stylesheet" href="/event-account.css"><script src="/event-embed-auth.js"></script></head><body class="ui-scope"><main class="event-account ui-shell ui-stack"><a class="ui-link" href="/" aria-label="言文字 emoji"><img class="event-account__logo" src="/cis/assets/emoji-h.svg" alt="言文字 emoji" width="180" height="60"></a><h1 class="ui-title" id="heading"></h1><p id="intro"></p><form id="login" class="ui-stack"><label class="ui-field"><span id="name-label"></span><input name="name" required maxlength="120" autocomplete="name"></label><label class="ui-field">Email<input name="email" type="email" required maxlength="254" autocomplete="email"></label><button class="ui-button ui-button--accent" id="send"></button></form><button class="ui-button ui-button--accent" id="verify" hidden></button><p class="ui-notice" id="status" role="status" aria-live="polite"></p><a class="ui-link" id="google"></a></main><script>
const params=new URLSearchParams(location.search),lang=['en','ja'].includes(params.get('lang'))?params.get('lang'):'zh',copy={zh:['Email 登入','輸入姓名與信箱，我們會寄送一次性登入連結。','姓名','寄送登入連結','確認登入','登入連結已寄出，請檢查收件匣。','改用 Google 登入','確認後登入此連結對應的帳號。若非您本人要求，請關閉此頁。','暫時無法登入，請稍後重試。'],en:['Sign in with email','Enter your name and email to receive a one-time sign-in link.','Name','Send sign-in link','Confirm sign-in','Link sent. Please check your inbox.','Sign in with Google','Confirm to sign in to the account linked to this email. Close this page if you did not request it.','Sign-in is temporarily unavailable. Please try again.'],ja:['メールでログイン','氏名とメールアドレスを入力すると、ログインリンクが届きます。','氏名','ログインリンクを送信','ログインを確認','送信しました。受信トレイをご確認ください。','Googleでログイン','このメールに紐づくアカウントにログインします。心当たりがなければ閉じてください。','一時的にログインできません。後でもう一度お試しください。']}[lang];document.documentElement.lang=lang==='zh'?'zh-Hant':lang;
const el=id=>document.getElementById(id),code=new URLSearchParams(location.hash.slice(1)).get('code');history.replaceState(null,'',location.pathname+location.search);el('heading').textContent=copy[0];el('intro').textContent=code?copy[7]:copy[1];el('name-label').textContent=copy[2];el('send').textContent=copy[3];el('verify').textContent=copy[4];el('google').textContent=copy[6];let redirect=params.get('redirect')||location.origin+'/member';try{if(new URL(redirect).origin!==location.origin)redirect=location.origin+'/member';}catch{redirect=location.origin+'/member';}el('google').href='/auth/google?redirect='+encodeURIComponent(redirect);EmojiEmbedAuth.relay(redirect);el('login').hidden=!!code;el('verify').hidden=!code;
async function call(path,body){const r=await fetch('/api/auth/email/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),out=await r.json();if(!r.ok)throw Error(out.error||copy[8]);return out;}
const working={zh:'處理中…',en:'Processing…',ja:'処理中…'}[lang];
function busy(button,active,label){button.disabled=active;button.setAttribute('aria-busy',String(active));button.textContent=active?working:label;}
el('login').onsubmit=async e=>{e.preventDefault();busy(el('send'),true,copy[3]);try{await call('start',{...Object.fromEntries(new FormData(el('login'))),redirect,lang});el('status').textContent=copy[5];}catch(e){el('status').textContent=e.message;}finally{busy(el('send'),false,copy[3]);}};
el('verify').onclick=async()=>{busy(el('verify'),true,copy[4]);try{const out=await call('verify',{code}),target=new URL(out.redirect);target.hash='token='+encodeURIComponent(out.token);location.replace(target.href);}catch(e){el('status').textContent=e.message;busy(el('verify'),false,copy[4]);}};
</script></body></html>
