<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>返回活動 · 言文字</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/stylebook/components.css"><link rel="stylesheet" href="/event-account.css"><script src="/event-embed-auth.js"></script></head><body class="ui-scope"><main class="event-account ui-shell ui-stack"><h1 class="ui-title" id="heading"></h1><p class="ui-notice" id="status" role="status"></p><a class="ui-button ui-button--accent" id="return"></a></main><script>
const params=new URLSearchParams(location.search),lang=['en','ja'].includes(params.get('lang'))?params.get('lang'):'zh',copy={zh:['返回活動','正在確認登入…','登入完成，請回到原本的報名視窗。若視窗未更新，可由下方連結繼續。','登入未完成或已失效，請回到活動重新登入。','前往活動'],en:['Return to event','Checking sign-in…','Signed in. Return to your registration window. If it did not update, continue using the link below.','Sign-in was not completed or expired. Please sign in again from the event.','Continue to event'],ja:['イベントに戻る','ログインを確認しています…','ログインしました。元の申込画面に戻ってください。更新されない場合は下のリンクから続けられます。','ログインが完了していないか期限切れです。イベントから再度ログインしてください。','イベントへ進む']}[lang];
document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=copy[0]+' · 言文字';document.getElementById('heading').textContent=copy[0];const status=document.getElementById('status');status.textContent=copy[1];let token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname+location.search);try{token=token||localStorage.getItem('tth_token');}catch{}
let target=new URL((lang==='zh'?'':'/'+lang)+'/events',location.origin);try{const value=new URL(params.get('return'));if(value.origin===location.origin&&/^\/(?:en\/|ja\/)?events\/[^/]+$/.test(value.pathname)){value.hash='';target=value;}}catch{}

</script></body></html>
