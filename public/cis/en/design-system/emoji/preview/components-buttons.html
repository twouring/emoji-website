<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>emoji components-buttons</title>
<!-- i18n:alternates --><link rel="alternate" hreflang="zh-Hant" href="https://www.emoji.tw/cis/design-system/emoji/preview/components-buttons.html" /><link rel="alternate" hreflang="en" href="https://www.emoji.tw/cis/en/design-system/emoji/preview/components-buttons.html" /><link rel="alternate" hreflang="ja" href="https://www.emoji.tw/cis/ja/design-system/emoji/preview/components-buttons.html" /><link rel="alternate" hreflang="x-default" href="https://www.emoji.tw/cis/design-system/emoji/preview/components-buttons.html" /><!-- /i18n:alternates -->
    <meta name="description" content="Buttons and badges" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../../../design-system/emoji/tokens.css" />
    <style>

      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-body);-webkit-font-smoothing:antialiased}
      ::selection{background:var(--emoji-yellow);color:var(--emoji-on-yellow)}
      img{display:block;max-width:100%}
      a{color:inherit;text-underline-offset:3px}
      .wrap{max-width:var(--container-max);margin:0 auto;padding:0 var(--container-gutter-desktop)}
      .latin{font-family:var(--emoji-font-latin)}
      .label{font-size:var(--text-xs);letter-spacing:var(--emoji-tracking-label);text-transform:uppercase;color:var(--muted);font-weight:500}
      /* page shell */
      .hdr{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.2);border-bottom:1px solid var(--border);z-index:5}
      .hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);height:64px}
      .hdr img{height:34px;width:auto}
      .hdr nav{display:flex;gap:var(--space-6);font-size:var(--text-sm)}
      .hdr nav a{text-decoration:none;color:var(--fg-2)} .hdr nav a:hover{color:var(--fg)}
      /* hero: the view's single yellow hit is the .hl underline */
      .hero{padding:var(--section-y-desktop) 0 var(--section-y-tablet);display:grid;grid-template-columns:1.1fr .9fr;gap:var(--space-12);align-items:end}
      .hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(var(--text-3xl),7vw,var(--text-4xl));line-height:var(--leading-tight);letter-spacing:var(--tracking-display);margin:var(--space-4) 0 0}
      .hl{background:var(--emoji-yellow);color:var(--emoji-on-yellow);padding:0 .12em;white-space:nowrap}
      .hero p.lede{color:var(--fg-2);font-size:var(--text-lg);font-weight:300;margin:0 0 var(--space-6)}
      .meta{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5);font-size:var(--text-sm);color:var(--muted)}
      .meta span+span{padding-left:var(--space-5);border-left:1px solid var(--border)}
      /* section head */
      .sec{padding:var(--section-y-tablet) 0;border-top:1px solid var(--border)}
      .sec-head{display:grid;grid-template-columns:auto 1fr 1.2fr;gap:var(--space-6);align-items:baseline;margin-bottom:var(--space-12)}
      .sec-head .num{font-family:var(--emoji-font-latin);font-size:var(--text-2xl);color:var(--muted)}
      .sec-head h2{font-family:var(--font-display);font-weight:700;font-size:var(--text-2xl);letter-spacing:var(--tracking-display);margin:0;line-height:var(--leading-tight)}
      .sec-head p{margin:0;color:var(--fg-2);font-weight:300}
      /* buttons: actions are ink, never yellow */
      .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:1px solid var(--accent);font:500 var(--text-sm)/1 var(--font-body);letter-spacing:.06em;text-decoration:none;cursor:pointer;transition:background var(--motion-fast) var(--ease-standard),color var(--motion-fast) var(--ease-standard)}
      .btn-primary{background:var(--accent);color:var(--accent-on)} .btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
      .btn-secondary{background:transparent;color:var(--fg);border-color:var(--border)} .btn-secondary:hover{border-color:var(--fg)}
      .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:var(--focus-ring)}
      .btn[disabled]{opacity:.4;cursor:not-allowed}
      .link{text-decoration:underline}
      .row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
      /* badge */
      .badge{display:inline-flex;align-items:center;height:26px;padding:0 var(--space-3);border:1px solid var(--border);border-radius:var(--radius-pill);font-size:var(--text-xs);letter-spacing:.12em;color:var(--fg-2);background:var(--surface)}
      .badge-hit{background:var(--emoji-yellow);border-color:var(--emoji-yellow);color:var(--emoji-on-yellow)} /* only when nothing else on the view is yellow */
      /* cards */
      .grid{display:grid;gap:var(--space-6)} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
      .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-8);min-width:0}
      .card h3{font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);letter-spacing:var(--tracking-display);margin:var(--space-3) 0 var(--space-2);line-height:var(--leading-tight)}
      .card p{margin:0;color:var(--fg-2);font-weight:300}
      .card .hours{font-family:var(--emoji-font-latin);font-size:var(--text-xl);margin-top:var(--space-4)}
      /* form */
      .field{display:grid;gap:var(--space-2);margin-bottom:var(--space-5)}
      .field label{font-size:var(--text-sm);font-weight:500}
      .field input,.field select,.field textarea{font:400 var(--text-base)/1.5 var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);min-height:48px;width:100%}
      .field small{color:var(--muted);font-size:var(--text-sm)}
      .field.err input{border-color:var(--danger)} .field.err small{color:var(--danger)}
      /* table */
      table{width:100%;border-collapse:collapse;font-size:var(--text-base)}
      th{text-align:left;font-size:var(--text-xs);letter-spacing:var(--emoji-tracking-label);text-transform:uppercase;color:var(--muted);font-weight:500;padding:var(--space-3) 0;border-bottom:1px solid var(--fg)}
      td{padding:var(--space-4) 0;border-bottom:1px solid var(--border)} td.n{font-family:var(--emoji-font-latin);font-size:var(--text-lg);text-align:right} th.n{text-align:right}
      /* moji notice */
      .notice{display:grid;grid-template-columns:72px 1fr;gap:var(--space-5);align-items:center;background:var(--emoji-paper-deep);color:var(--emoji-ink);border-radius:var(--radius-md);padding:var(--space-6)}
      .notice p{margin:0;font-family:var(--font-display);font-size:var(--text-lg);letter-spacing:var(--tracking-display)}
      /* ink footer */
      .ftr{background:var(--emoji-ink-surface);color:var(--emoji-on-ink);padding:var(--section-y-phone) 0;margin-top:var(--section-y-tablet)}
      .ftr .wrap{display:grid;grid-template-columns:1fr auto;gap:var(--space-8);align-items:end}
      .ftr img.lock{height:40px;width:auto} .ftr img.mj{width:56px}
      .ftr p{margin:var(--space-5) 0 0;color:var(--emoji-on-ink-soft);font-size:var(--text-sm)}
      @media (max-width:820px){.wrap{padding:0 var(--container-gutter-phone)}.hero{grid-template-columns:1fr;padding:var(--section-y-phone) 0}.sec{padding:var(--section-y-phone) 0}.sec-head{grid-template-columns:auto 1fr;margin-bottom:var(--space-8)}.sec-head p{grid-column:1/-1}.g3,.g2{grid-template-columns:1fr}.hdr nav{display:none}.ftr .wrap{grid-template-columns:1fr}.meta span+span{padding-left:0;border-left:0}}
      @media (prefers-reduced-motion:reduce){*{transition:none!important}}

    
/* i18n:lang-switch */.lang-switch{display:flex;justify-content:flex-end;gap:20px;padding:10px var(--container-gutter-desktop,32px);background:var(--bg);color:var(--fg);font:400 1rem/1.5 var(--font-body);border-bottom:1px solid var(--border)}.lang-switch a{color:var(--muted);text-decoration:none}.lang-switch a:hover{color:var(--fg)}.lang-switch a[aria-current=page]{color:var(--fg);text-decoration:underline;text-underline-offset:4px}/* /i18n:lang-switch */
</style>
  </head>

<nav class="lang-switch" aria-label="Language"><a href="../../../../design-system/emoji/preview/components-buttons.html" hreflang="zh-Hant" lang="zh-Hant">中文</a><a href="components-buttons.html" hreflang="en" lang="en" aria-current="page">English</a><a href="../../../../ja/design-system/emoji/preview/components-buttons.html" hreflang="ja" lang="ja">日本語</a></nav>
    <main class="wrap" style="padding-top:var(--space-12);padding-bottom:var(--space-12)">
      <p class="label latin">emoji design system · preview</p>
      <h1 style="font-family:var(--font-display);font-size:var(--text-2xl);letter-spacing:var(--tracking-display);margin:var(--space-2) 0 var(--space-8)">Buttons and badges</h1>
      <div class="row"><button class="btn btn-primary">Become a member</button><button class="btn btn-secondary">See events</button><button class="btn btn-primary" disabled>Full</button><a class="link" href="#">How membership works</a></div>
        <div class="row" style="margin-top:var(--space-6)"><span class="badge">Elephant talks</span><span class="badge">Night elephant</span><span class="badge">Members only</span></div><div class="row" style="margin-top:var(--space-8)"><span class="badge badge-hit">Today’s one hit</span><span style="color:var(--muted);font-size:var(--text-sm)">Yellow badge: use only when nothing else on the view is yellow.</span></div>
    </main>
  </body>
