<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>通知退訂 · 言文字</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/stylebook/components.css"><link rel="stylesheet" href="/event-account.css"></head><body class="ui-scope"><main class="event-account ui-shell ui-stack"><label class="ui-field">語言 / Language <select id="language"><option value="zh">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><h1 class="ui-title" id="heading"></h1><p id="event"></p><p id="description"></p><button class="ui-button ui-button--accent" id="confirm" disabled></button><p class="ui-notice" id="status" role="status" aria-live="polite"></p><a class="ui-link" href="/events" id="back"></a></main><script>
const copy={zh:['取消活動通知','確認後，只會關閉此活動的這一類郵件。票券及必要的付款通知不受影響。','確認退訂','已退訂。若要重新開啟，請登入活動頁調整通知偏好。','連結無效，請從原郵件重新開啟。','返回活動列表','活動公告郵件','活動前提醒','回饋邀請','無法完成，請稍後再試。'],en:['Unsubscribe from event emails','Only this email category for this event will be disabled. Your tickets and essential payment updates remain available.','Confirm unsubscribe','Unsubscribed. Sign in to the event page to enable notifications again.','Invalid link. Please reopen it from the original email.','Browse events','Event announcements','Event reminders','Feedback invitations','Could not complete this request. Please try again.'],ja:['イベントメールの配信停止','このイベントの該当する種類のメールのみ停止します。チケットや重要な支払い通知には影響しません。','配信停止を確認','配信を停止しました。再開する場合はイベントページにログインして通知設定を変更してください。','リンクが無効です。元のメールから開き直してください。','イベント一覧','イベントのお知らせ','開催前のリマインダー','感想の依頼','処理できませんでした。後でもう一度お試しください。']};
let lang=/^ja/i.test(navigator.language)?'ja':/^en/i.test(navigator.language)?'en':'zh',token=new URLSearchParams(location.hash.slice(1)).get('token'),data=null,done=false,busy=false;
history.replaceState(null,'',location.pathname);document.getElementById('language').value=lang;
function render(){const c=copy[lang];document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=c[0]+' · 言文字';document.getElementById('heading').textContent=c[0];document.getElementById('description').textContent=c[1];document.getElementById('confirm').textContent=busy?{zh:'處理中…',en:'Processing…',ja:'処理中…'}[lang]:c[2];document.getElementById('back').textContent=c[5];document.getElementById('back').href=(lang==='zh'?'':'/'+lang)+'/events';document.getElementById('event').textContent=data?data.event+' · '+c[6+['blasts','reminders','feedback'].indexOf(data.category)]:'';if(done)document.getElementById('status').textContent=c[3];}
async function request(action){const r=await fetch('/api/events/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action})});if(!r.ok)throw Error();return r.json();}
document.getElementById('language').onchange=e=>{lang=e.target.value;render();};
document.getElementById('confirm').onclick=async()=>{const b=document.getElementById('confirm');b.disabled=true;busy=true;b.setAttribute('aria-busy','true');render();try{await request('unsubscribe');done=true;render();}catch{document.getElementById('status').textContent=copy[lang][9];b.disabled=false;}finally{busy=false;b.setAttribute('aria-busy','false');render();}};
render();if(token)request('preview').then(out=>{data=out;render();document.getElementById('confirm').disabled=false;}).catch(()=>document.getElementById('status').textContent=copy[lang][4]);else document.getElementById('status').textContent=copy[lang][4];
</script></body></html>
