<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EMO POS · 言文字</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBFAF6">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pos-ops.css">
<link rel="stylesheet" href="/pos-members.css">
<link rel="stylesheet" href="/pos-inventory.css">
<link rel="stylesheet" href="/pos-settings.css">
<style>
  /* 平板 POS：單欄、頂欄分頁、48px 以上觸控目標；沿用 CIS token（/style.css）與 /pos-ops.css 的餐飲營運樣式 */
  :root{--p-top:60px}
  html{background:var(--paper);height:100%;overflow:hidden;overscroll-behavior:none}
  /* 全站鎖定尺寸：不可雙指縮放、不可雙擊放大（touch-action 擋雙擊，gesturestart 擋雙指，見下方 script） */
  html,body{touch-action:manipulation}
  body{font-family:var(--sans);font-size:1rem;line-height:1.6;color:var(--ink);background:var(--paper);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  /* 鎖住整頁橡皮筋彈跳：body 固定視窗高，只有 main 內部捲動，且到頂／底不外溢（overscroll-behavior:none） */
  body>.p-top{flex:none}
  body>main{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
  *,*::before,*::after{box-sizing:border-box}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
  [hidden]{display:none!important}
  h1,h2,h3{font-family:var(--sans);letter-spacing:0}
  /* 頂欄用 sticky 而不是 fixed＋固定高度：手機（375px）上店別／工具／分頁會折成三四行，固定高度會讓多出來的行往上被狀態列蓋住、往下壓到內容；sticky 由內容撐高、main 自然往下排 */
  .p-top{position:sticky;top:0;min-height:calc(var(--p-top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));z-index:20}
  .p-brand{display:flex;align-items:center;gap:6px;flex:none;color:var(--ink);text-decoration:none}
  .p-brand i{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-style:normal;font-size:1rem}
  .p-brand b{font-weight:600;font-size:1rem;line-height:1.1}
  .p-ver-wrap{display:flex;flex-direction:column;letter-spacing:-.02em}
  .p-ver{font-size:1rem;font-weight:400;line-height:1.1;color:var(--ink);opacity:.5;font-variant-numeric:tabular-nums;white-space:nowrap}
  .p-scope{display:flex;gap:4px;flex:none}
  .p-scope button,.p-nav button{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 14px;border-radius:999px;font-size:1rem;line-height:1;white-space:nowrap;color:var(--ink-soft);border:1px solid transparent}
  .p-scope button{border-color:var(--line);padding:0 10px}
  .p-scope button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
  .p-nav-wrap{position:relative;display:flex;flex:1;min-width:0}
  .p-nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .p-nav::-webkit-scrollbar{display:none}
  .p-nav button[aria-pressed=true]{background:var(--ink);color:var(--paper);font-weight:600}
  .p-nav button .badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--danger);color:#fff;font-size:1rem;line-height:1;font-weight:600}
  .p-nav button[aria-pressed=true] .badge{background:var(--accent);color:var(--on-accent)}
  /* 分頁列還能往右滑時的明確提示：不能只靠隱藏捲軸或淡化邊緣，之前（10/13）就是因為使用者完全看不出還有分頁而漏用「打卡」「排班」 */
  .p-nav-more{position:absolute;top:0;bottom:0;right:0;display:none;align-items:center;padding:0 2px 0 18px;pointer-events:none;color:var(--muted);font-weight:700;font-size:1.3rem;background:linear-gradient(to right,transparent,var(--card) 65%)}
  .p-nav-more.show{display:flex}
  .p-tools{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
  .p-tools button{all:unset;box-sizing:border-box;cursor:pointer;min-width:44px;min-height:44px;padding:0 12px;border-radius:8px;font-size:1rem;color:var(--muted);display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--card)}
  .p-tools button:active{background:var(--paper-alt)}
  .p-tools .p-net{min-width:0;padding:0 10px;border:0;background:transparent;color:var(--danger);font-weight:600}
  /* 平板滿版：不設 max-width，內容跟著螢幕寬走（iPad 10 吋 1024 → 13 吋 1366 都吃滿）；只有外接大螢幕才收到 1680 */
  main{padding:16px max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1680px;margin:0 auto}
  /* 分頁容器：與 /admin 共用 #orders-body / #pos-body / #resv-body / #sales-body / #soldout-body 的 id，pos-ops.js 直接對這些容器繪製 */
  .p-tab{display:none;padding:0}.p-tab.on{display:block}
  /* 點歌分頁＋設定頁點歌區塊＋右下角播放器（標題最多兩行，不截成一行） */
  /* pos 內的 <section> 會吃到 style.css 的 section{padding:72px+}（點歌頁中段大空白的來源），點歌頁一律歸零 */
  #songs-body section{padding:0}
  .song-head{flex-wrap:wrap!important;gap:8px 12px!important}
  .song-head-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .song-now{display:flex;align-items:center;gap:16px;padding:14px;margin:4px 0 18px;border-radius:12px;background:var(--ink);color:var(--paper)}
  .song-now img,.song-now .song-ph.lg{width:160px;height:90px;border-radius:8px;object-fit:cover;flex:none}
  .song-now .song-ph.lg{display:grid;place-items:center;background:rgba(255,255,255,.12);color:var(--paper);font-size:2rem}
  .song-now-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .song-now-main b{font-size:1.25rem;line-height:1.35;overflow-wrap:anywhere;word-break:normal}
  .song-now-main small{font-size:1rem;opacity:.8;line-height:1.5}
    .song-now .btn{flex:none;min-width:120px;background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .song-now.is-empty{background:var(--paper-alt);color:var(--ink)}.song-now.is-empty .song-ph.lg{background:var(--card);color:var(--muted)}.song-now.is-empty .btn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  @media (max-width:600px){.song-now{flex-wrap:wrap}.song-now img,.song-now .song-ph.lg{width:120px;height:68px}.song-now .btn{width:100%}}
  .song-sfx{margin:0 0 18px}.song-sfx h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 8px}.song-sfx h3 small{color:var(--muted);font-weight:400;font-size:1rem}
  .song-sfx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .song-sfx-btn{min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
  .song-sfx-btn:active{background:var(--ink);color:var(--paper)}.song-sfx-btn.is-stop{color:var(--danger);border-color:var(--danger)}.song-sfx-btn.is-stop:active{background:var(--danger);color:var(--paper)}
  .song-mv{min-width:40px;padding-inline:0}.song-mv:disabled{opacity:.35}
  .song-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
  @media (max-width:900px){.song-grid{grid-template-columns:minmax(0,1fr)}}
  .song-col{min-width:0}.song-col .song-now{margin:0 0 14px}
  /* 平板橫放：音效一排排滿；兩欄撐到視窗底（高度由 songFit 算）、各自捲動；正在播放固定在左欄頂端 */
  @media (min-width:1000px) and (min-height:600px){
    .song-head{margin-bottom:10px}
    .song-sfx{display:flex;align-items:center;gap:12px;margin:0 0 14px}
    .song-sfx h3{flex:none;flex-direction:column;gap:0;margin:0;width:7.5em;line-height:1.3}.song-sfx h3 small{line-height:1.3}
    .song-sfx-grid{flex:1;min-width:0;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
    .song-sfx-btn{min-height:48px;padding:4px}
    .song-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;min-height:360px}
    .song-col{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
    .song-col h3{margin:0 0 10px}
    .song-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin-right:-6px;padding-right:6px}
    .song-now{padding:12px;gap:14px}.song-now img,.song-now .song-ph.lg{width:128px;height:72px}.song-now-main b{font-size:1.125rem}
    .song-col .song-row img,.song-col .song-ph{width:72px;height:40px}
    /* 點歌分頁已有正在播放大卡與「下一首」：播放器自動縮成一條（影片高度 0 仍在播，不可 display:none），不擋找歌的代點／插播；離開分頁恢復原狀 */
    /* 仍保留「＋」鈕：按了加 .is-expand 暫時展開（切分頁就收回），否則在點歌頁永遠放不大 */
    body:has([data-panel=songs].on) #song-dock:not(.is-expand){width:300px}
    body:has([data-panel=songs].on) #song-dock:not(.is-expand) .song-dock-video{height:0;overflow:hidden}
    body:has([data-panel=songs].on) #song-dock:not(.is-expand) .song-dock-label,body:has([data-panel=songs].on) #song-dock:not(.is-expand) .song-dock-handle{display:none}
    body:has([data-panel=songs].on) #song-dock:not(.is-expand) .song-dock-grip{position:absolute;right:0;top:0;background:transparent;padding:0;width:auto}
    body:has([data-panel=songs].on) #song-dock:not(.is-expand) .song-dock-bar{padding-right:52px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
    .song-scroll{padding-bottom:120px}
  }
  .song-grid h3{display:flex;align-items:baseline;gap:8px;margin-top:0}.song-grid h3 small{color:var(--muted);font-weight:400;font-size:1rem}
  .song-count{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--paper-alt);font-size:1rem}
  .song-tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}.song-tabs::-webkit-scrollbar{display:none}
  .song-tabs button{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font-size:1rem;white-space:nowrap;color:var(--ink-soft)}
  .song-tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .song-switch{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0 14px;cursor:pointer}
  .song-switch input{width:24px;height:24px;flex:none;margin:2px 0 0}
  .song-switch span{display:flex;flex-direction:column;gap:2px}.song-switch small{color:var(--muted);font-size:1rem;line-height:1.5}
  .song-switch.sm{padding:8px 12px;margin:4px 0 10px}
  .song-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
  .song-pl{max-height:480px;overflow:auto;-webkit-overflow-scrolling:touch}
  .song-row{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;min-width:0;background:var(--card)}
  .song-rank{flex:none;width:28px;text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .song-row img,.song-ph{width:96px;height:54px;object-fit:cover;border-radius:6px;flex:none;background:var(--paper-alt);display:grid;place-items:center;color:var(--muted)}
  .song-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .song-meta b{font-weight:600;line-height:1.35;overflow-wrap:anywhere;word-break:normal}
  .song-meta small{color:var(--muted);font-size:1rem;line-height:1.45;overflow-wrap:anywhere}.song-meta small i{font-style:normal;opacity:.6}
  .song-act{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .song-btns{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
  .song-picks{margin:0 0 12px}.pick-seg{display:flex;gap:6px;margin:0 0 10px}.pick-seg button{all:unset;box-sizing:border-box;cursor:pointer;flex:1;text-align:center;min-height:44px;border-radius:8px;border:1px solid var(--ink);font-size:1rem;font-weight:600}.pick-seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .pick-groups{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}.pick-groups::-webkit-scrollbar{display:none}.pick-groups button{all:unset;box-sizing:border-box;cursor:pointer;flex:none;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:1rem;white-space:nowrap}.pick-groups button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
  .pick-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.pick-chips button{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:1rem;overflow-wrap:anywhere}.pick-chips button:active{background:var(--line)}.pick-chips.is-song button b,.pick-chips.is-song button small{display:block}.pick-chips.is-song button small{color:var(--ink-soft)}
  .pick-hint{margin:10px 0 0;color:var(--ink-soft)}.pick-back{all:unset;box-sizing:border-box;cursor:pointer;display:block;min-height:44px;line-height:44px;margin:0 0 4px;text-decoration:underline;font-size:1rem}
  .song-search{display:flex;gap:8px;margin:0 0 12px}.song-search input{flex:1;min-width:0;min-height:48px;font:inherit;font-size:1rem;padding:0 12px;border:1px solid var(--line);border-radius:8px}
  .song-set{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin-bottom:14px}
  .song-set label{display:flex;flex-direction:column;gap:4px;font-size:1rem;color:var(--muted)}.song-set input{min-height:44px;font:inherit;font-size:1rem;padding:0 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  #set-songs h4{font-size:1rem;font-weight:600;margin:16px 0 4px}
  .song-hist{margin:8px 0 12px}.song-hist summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--ink-soft);font-weight:500}
  .song-danger{color:var(--danger)}
  @media (max-width:600px){.song-row{flex-wrap:wrap}.song-row img,.song-ph{width:80px;height:45px}.song-act{width:100%;justify-content:flex-start;padding-left:0}.song-rank{width:22px}}
  #song-dock{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:60;width:340px;max-width:calc(100vw - 24px);background:var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.35);color:var(--paper)}
  #song-dock.is-drag{box-shadow:0 14px 40px rgba(0,0,0,.45);opacity:.95}
  .song-dock-grip{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background:rgba(255,255,255,.08)}
  #song-dock.is-drag .song-dock-grip{cursor:grabbing}
  .song-dock-handle{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.5);flex:none}
  .song-dock-label{flex:1;min-width:0;font-size:1rem;opacity:.75;white-space:nowrap;overflow:hidden}
  .song-dock-grip button{all:unset;cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px;font-size:1.25rem;font-weight:700;border-radius:8px}
  .song-dock-grip button:active{background:rgba(255,255,255,.15)}
  .song-dock-video iframe{display:block;width:100%;height:190px;border:0;background:#000}
  .song-dock-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px}
  .song-dock-bar span{flex:1;min-width:0;font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
  .song-dock-bar button{all:unset;cursor:pointer;flex:none;min-height:44px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.4);font-size:1rem}
  /* 縮到最小：影片收起（仍在播放，只是看不到），只留拖移列＋歌名＋下一首 */
  #song-dock.is-min{width:300px}
  #song-dock.is-min .song-dock-video{height:0;overflow:hidden}
  #song-dock.is-min .song-dock-label{display:none}
  #song-dock.is-min .song-dock-grip{position:absolute;right:0;top:0;background:transparent;padding:0;width:auto}
  #song-dock.is-min .song-dock-handle{display:none}
  #song-dock.is-min .song-dock-bar{padding-right:52px}
  #song-dock.is-min .song-dock-bar{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .song-who{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;padding:2px 10px;border-radius:999px;font-size:1rem;line-height:1.5;font-weight:500}
  .song-who.is-guest{background:var(--accent);color:var(--on-accent)}.song-who.is-guest b{font-weight:700}
  .song-who.is-pos{background:var(--paper-alt);color:var(--ink)}
  .song-who.is-pl{background:transparent;color:var(--muted);padding-left:0}
  .song-now .song-who.is-pl{color:var(--paper);opacity:.75}
  #app{touch-action:pan-y}
  .a-sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .a-sec h2{font-size:1.125rem;font-weight:600;margin:0 0 .25rem;display:flex;align-items:center;gap:.5em}
  .a-sec h3,h3{font-size:1rem;font-weight:600;margin:16px 0 8px}
  .hint{color:var(--muted);font-size:1rem;margin:0 0 12px;line-height:1.5}
  .a-empty{color:var(--muted);padding:14px 10px}
  .a-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1rem}
  .a-wrap2{overflow:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
  table.a-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:1rem}
  table.a-tbl th{position:sticky;top:0;z-index:1;background:var(--paper-alt);text-align:left;color:var(--muted);font-weight:500;font-size:1rem;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.a-tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.45}
  table.a-tbl tbody tr:last-child td{border-bottom:0}
  table.a-tbl td.num,table.a-tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.a-tbl a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .a-form{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:12px}
  .a-form label{font-size:1rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
  .a-form input,.a-form select,.a-toolbar input,.a-toolbar select,.ops-pause input{font:inherit;font-size:1rem;padding:8px 12px;min-height:48px;border:1px solid var(--muted);border-radius:8px;background:var(--card);color:var(--ink)}

const tabUrl = tab => '/pos' + (tab === 'pos' ? '' : '/' + tab) + (tab === 'analytics' && typeof ANALYTICS_KIND !== 'undefined' && ANALYTICS_KIND !== 'products' ? '/' + ANALYTICS_KIND : '');
function opsHref(tab){ return tabUrl(tab); }
// Google 登入的 callback 綁在官網網域（PUBLIC_ORIGIN），state cookie 也在那裡：子網域一律先到 www 發起，登入完成再以 #token 導回本站
const AUTH_ORIGIN = /^pos\./i.test(location.hostname) ? location.origin.replace(/\/\/pos\./i, '//www.') : location.origin;

// token：登入完成由 /auth/google 或 Email 連結以 #token= 帶回，讀取後立即從網址移除
const hash = new URLSearchParams(location.hash.slice(1));
let justLoggedInByAdmin = !!hash.get('token');
if (hash.get('token')) { localStorage.setItem(KEY, hash.get('token')); history.replaceState(null,'',location.pathname.startsWith('/pos') ? location.pathname : '/pos'); }
let token = localStorage.getItem(KEY);

// 裝置綁定：每台 iPad 存一個隨機代碼，POS 專用帳號登入一次完成綁定後，之後員工才能用四位數密碼登入（換裝置／重設瀏覽器資料要重新綁定）
let DEVICE_ID = localStorage.getItem('tth_pos_device');
if (!DEVICE_ID) { DEVICE_ID = (crypto.randomUUID ? crypto.randomUUID() : 'd-' + Math.random().toString(36).slice(2) + Date.now().toString(36)); localStorage.setItem('tth_pos_device', DEVICE_ID); }
let DEVICE_BOUND = false; // main() 每次開機都重新確認

async function api(path, { method='GET', body, headers } = {}) {
  const res = await fetch('/api'+path, {
    method, headers:{ 'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{}), ...(headers||{}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let d={}; try{ d=await res.json(); }catch(e){}
  if (res.status === 401 && token) { localStorage.removeItem(KEY); token = null; showLoginScreen('登入已過期，請重新登入。'); }
  if (!res.ok) throw Object.assign(new Error(d.error || ('伺服器錯誤（'+res.status+'）')), {status:res.status});
  return d;
}

function showLoginScreen(msg){ return DEVICE_BOUND ? renderPinLogin(msg) : renderLogin(msg); }

function renderLogin(msg){
  if (typeof paintRegWarn === 'function') paintRegWarn(null);
  const drawer = document.getElementById('p-drawer'); if (drawer) drawer.hidden = true;
  document.getElementById('p-logout').hidden = true;
  document.getElementById('p-nav').innerHTML = ''; document.getElementById('p-scope').innerHTML = '';
  const redirect = encodeURIComponent(location.origin + '/pos');
  app.innerHTML = `<div class="p-login"><div class="p-login-card">
    <div class="p-login-brand"><small>EMOJI</small><h1>言文字 POS</h1></div>
    <p class="p-login-msg${msg ? ' err' : ''}">${esc(msg || '管理員登入一次，本裝置之後就能用四位數密碼。')}</p>
    <a class="btn btn--solid" href="${esc(AUTH_ORIGIN)}/auth/google?redirect=${redirect}">使用 Google 登入</a>
    <div class="p-login-or">或用 Email</div>
    <form id="pos-password-login" class="a-form p-login-form">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn--ghost" type="submit">Email 密碼登入</button>
      <p id="pos-login-error" role="alert" hidden></p>
    </form>
    <a class="btn btn--ghost" href="/event-login.html?redirect=${redirect}">使用 Email 登入連結</a>
    ${DEVICE_BOUND ? `<button type="button" class="btn btn--ghost btn-sm" id="pin-back">改用四位數密碼登入</button>` : ''}
  </div></div>`;
  const form = document.getElementById('pos-password-login');
  form.onsubmit = async event => {
    event.preventDefault();
    const button = form.querySelector('button'), error = document.getElementById('pos-login-error');
    if (button.disabled) return;
    button.disabled = true; error.hidden = true;
    try {
      const result = await api('/auth/admin/password', { method:'POST', body:{ email:form.elements.email.value, password:form.elements.password.value } });
      form.elements.password.value = '';
      token = result.token; localStorage.setItem(KEY, token);
      justLoggedInByAdmin = true;
      await main();
    } catch (e) {
      form.elements.password.value = '';
      error.textContent = e.message || '登入失敗，請稍後再試。'; error.hidden = false; button.disabled = false;
    }
  };
  const back = document.getElementById('pin-back'); if (back) back.onclick = () => renderPinLogin();
}

// 操作人員四位數密碼登入（裝置已綁定才會出現）：沿用打卡鍵盤的樣式，密碼只留在記憶體，絕不進 localStorage／DOM 以外的地方
function renderPinLogin(msg){
  if (typeof paintRegWarn === 'function') paintRegWarn(null);
  const drawer = document.getElementById('p-drawer'); if (drawer) drawer.hidden = true;
  document.getElementById('p-logout').hidden = true;
  document.getElementById('p-nav').innerHTML = ''; document.getElementById('p-scope').innerHTML = '';
  let pin = '';
  // 與打卡／認人鍵盤同一套（.clock-pad／.clock-pin／.clock-key，pos-ops.css）：圓點 <i>、鍵位 1–9／⌫／0／清除
  const paint = () => { const d = document.getElementById('pin-dots'); if (d) d.innerHTML = [0,1,2,3].map(i => `<i class="${i<pin.length?'on':''}"></i>`).join(''); };
  app.innerHTML = `<div class="p-login"><div class="p-login-card">
    <div class="p-login-brand"><small>EMOJI</small><h1>言文字 POS</h1></div>
    <p class="p-login-msg${msg ? ' err' : ''}" role="status">${esc(msg || '請輸入四位數密碼')}</p>
    <div class="clock-pad"><div class="clock-pin" id="pin-dots" aria-label="密碼"></div>
      <div class="clock-keys">${['1','2','3','4','5','6','7','8','9','⌫','0','清除'].map(k=>`<button type="button" class="clock-key" data-key="${esc(k)}">${esc(k)}</button>`).join('')}</div>
    </div>
    <button type="button" class="btn btn--ghost btn-sm" id="pin-alt">改用管理員帳號登入</button>
  </div></div>`;
  paint();
  if (msg) { const d = document.getElementById('pin-dots'); d.classList.add('shake'); if (navigator.vibrate) navigator.vibrate(120); }
  document.getElementById('pin-alt').onclick = () => renderLogin();
  const keysEl = app.querySelector('.clock-keys');
  // 實體鍵盤（藍牙／外接）也能輸入：數字、Backspace、Escape
  window.__posPinKey && document.removeEventListener('keydown', window.__posPinKey);
  window.__posPinKey = ev => {
    if (!document.getElementById('pin-dots')) { document.removeEventListener('keydown', window.__posPinKey); return; }
    const k = /^[0-9]$/.test(ev.key) ? ev.key : ev.key === 'Backspace' ? '⌫' : ev.key === 'Escape' ? '清除' : null;
    const b = k && app.querySelector(`[data-key="${k}"]`); if (b) { ev.preventDefault(); b.click(); }
  };
  document.addEventListener('keydown', window.__posPinKey);
  document.querySelectorAll('[data-key]').forEach(b => b.onclick = async () => {
    const k = b.dataset.key;
    if (k === '⌫') { pin = pin.slice(0, -1); paint(); return; }
    if (k === '清除') { pin = ''; paint(); return; }
    if (!k || pin.length >= 4) return;
    pin += k; paint();
    if (pin.length === 4) {
      keysEl.classList.add('busy');
      try {
        const d = await api('/pos-devices/' + encodeURIComponent(DEVICE_ID) + '/pin-login', { method:'POST', body:{ pin } });
        if (d.choose) return renderBrandChoice(pin, d);
        localStorage.setItem(KEY, d.token); location.reload();
      } catch (e) { renderPinLogin(e.message || '密碼錯誤，請重新輸入。'); }
    }
  });
}

// 雙品牌員工：PIN 通過後選這次要上哪個品牌，登入後鎖定；要換品牌就登出重登（PIN 只留在這個函式的記憶體，不寫入儲存）
function renderBrandChoice(pin, d){
  // 品牌代碼來自伺服器白名單（CAFE/BAR），名稱以 esc 轉義
  app.innerHTML = `<div class="p-login"><div class="p-login-card"><h1>${esc(d.name)}，今天上哪個品牌？</h1><p>登入後只能操作這個品牌；要換品牌請登出後重新登入。</p>${d.brands.filter(b=>BRAND_LABEL[b]).map(b=>`<button type="button" class="btn btn--solid" data-pick-brand="${b}">${esc(BRAND_LABEL[b])}</button>`).join('')}<button type="button" class="btn btn--ghost btn-sm" id="pick-cancel">取消</button></div></div>`;
  document.getElementById('pick-cancel').onclick = () => renderPinLogin();
  app.querySelectorAll('[data-pick-brand]').forEach(b => b.onclick = async () => {
    if (b.disabled) return; b.disabled = true;
    try { const r = await api('/pos-devices/' + encodeURIComponent(DEVICE_ID) + '/pin-login', { method:'POST', body:{ pin, venue:b.dataset.pickBrand } }); localStorage.setItem(KEY, r.token); location.reload(); }
    catch (e) { renderPinLogin(e.message || '登入失敗，請重新輸入。'); }
  });
}

/* 店別：員工鎖定登入時的品牌（單一）；管理員可切在咖啡／三點水／全部 */
const scopesOf = d => d?.me?.operator ? (d.brands || []).filter(b => BRAND_LABEL[b]).slice(0,1) : d?.brands ? d.brands.filter(b => BRAND_LABEL[b]) : ['', ...Object.keys(BRAND_LABEL)];
function setScope(s){ if (DATA?.me?.operator && s !== scopesOf(DATA)[0]) return; SCOPE = s; try { localStorage.setItem('tth_pos_scope', s); } catch (e) {} }

// 舊網址 /pos/products、/pos/customers 併入「分析」：/pos/analytics/products|customers
const LEGACY_ANALYTICS = { products:'products', customers:'customers' };
function routeTab(){
  const seg = location.pathname.replace(/^\/pos\/?/, '').replace(/\/+$/,'').split('/');
  if (LEGACY_ANALYTICS[seg[0]]) { ANALYTICS_KIND = LEGACY_ANALYTICS[seg[0]]; history.replaceState(null, '', '/pos/analytics/' + ANALYTICS_KIND); return 'analytics'; }
  if (seg[0] === 'analytics' && LEGACY_ANALYTICS[seg[1]]) ANALYTICS_KIND = seg[1];
  return TABS.some(t=>t.id===seg[0]) ? seg[0] : 'pos';
}
function go(tab, replace){
  TAB = tab;
  const url = tabUrl(tab);
  if (location.pathname !== url) history[replace ? 'replaceState' : 'pushState'](null, '', url);
  paintNav(); activate();
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-tab]'); if (!a) return;
  e.preventDefault(); go(a.dataset.tab);
});
window.addEventListener('popstate', () => { TAB = routeTab(); paintNav(); activate(); });

// 分頁列（手機單行可滑動時）還能往右滑就亮「›」提示：淡化邊緣太不明顯，10/13 就是因為使用者完全看不出還有分頁而漏用「打卡」「排班」，這次用明確的提示而不是只靠邊緣效果
const navEl = document.getElementById('p-nav');
function updateNavMore(){ const more = document.getElementById('p-nav-more'); if (!more) return; more.classList.toggle('show', navEl.scrollWidth - navEl.scrollLeft - navEl.clientWidth > 4); }
navEl.addEventListener('scroll', updateNavMore, { passive: true });
window.addEventListener('resize', updateNavMore);

function paintNav(){
  const scopes = scopesOf(DATA);
  if (!scopes.includes(SCOPE)) setScope(scopes[0] || '');
  document.getElementById('p-scope').innerHTML = scopes.length > 1 ? scopes.map(s => `<button type="button" data-scope="${esc(s)}" aria-pressed="${s===SCOPE}">${esc(s ? BRAND_LABEL[s] : '全部')}</button>`).join('') : (SCOPE ? `<span class="pill pill-ok">${esc(BRAND_LABEL[SCOPE])}</span>` : '');
  document.getElementById('p-scope').querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { setScope(b.dataset.scope); resetPanels(); paintNav(); activate(); });
  const navTab = TABS.find(t => t.id === TAB)?.group || TAB; // 設定底下的分頁，頂欄亮「設定」
  document.getElementById('p-nav').innerHTML = TABS.filter(t => !t.group).map(t => `<button type="button" data-tab="${t.id}" aria-pressed="${t.id===navTab}">${POSIcon(t.icon)}${t.label}${t.id==='reservations'&&PENDING?`<span class="badge">${PENDING}</span>`:''}</button>`).join('');
  document.getElementById('p-nav').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  // 手機分頁列是可滑動單行（不換行），切換分頁後把目前分頁捲進視野，避免使用者不知道要滑到哪一個
  const active = document.querySelector('#p-nav [data-tab="' + navTab + '"]'); if (active) active.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  updateNavMore();
}
function resetPanels(){
  // 換店別：清掉各分頁的快取簽章與初始化旗標，讓 pos-ops.js 重新繪製
  document.querySelectorAll('[data-panel] > [id]').forEach(h => { delete h.dataset.sig; delete h.dataset.init; h.innerHTML=''; });
  POS_TABLE=''; POS_PICK=null; POS_DISCOUNT=null; POS_RECEIVED=''; HIST_Q=''; CLOCK_PIN='';
  POS_YAN={phone:'',name:'',balance:null};POS_MEMBER=false;resetPosMembers();if(typeof resetInventory==='function')resetInventory();if(typeof resetSongs==='function')resetSongs();
}
function activate(){
  startKitchenPrinting();
  refreshRegWarn();
  document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('on', p.dataset.panel === TAB));
  if (typeof songDockTab === 'function') songDockTab();
  clearTimeout(ORDERS_TIMER); clearTimeout(POS_TIMER);
  if (TAB !== 'logs') { LOGS_PIN = ''; LOGS_PAD = ''; LOGS_MSG = ''; } // 紀錄限店長：離開分頁就要重輸識別碼
  if (TAB === 'pos') loadPos();
  else if (TAB === 'members') loadPosMembers();
  else if (TAB === 'orders') loadOrders();
  else if (TAB === 'soldout') loadSoldOut();
  else if (TAB === 'inventory') loadInventory();
  else if (TAB === 'reservations') loadReservations();
  else if (TAB === 'history') loadHistory();
  else if (TAB === 'sales') loadSales();
  else if (TAB === 'analytics') loadAnalytics();
  else if (TAB === 'clock') loadClock();
  else if (TAB === 'logs') loadLogs();
  else if (TAB === 'shifts') loadShifts();
  else if (TAB === 'songs') loadSongs();
  else if (TAB === 'tips') loadTips();
  else if (TAB === 'feedback') loadFeedback();
  else if (TAB === 'settings') loadSettings();
  if (TAB !== 'settings') resetSettings(); // 店長識別碼只留在設定頁，離開就清空
}
function render(){
  document.getElementById('p-drawer').hidden = false;
  bindCashDrawerButton(document.getElementById('p-drawer'));
  document.getElementById('p-logout').hidden = false;
  app.innerHTML = TABS.map(t => `<section class="p-tab" data-panel="${t.id}">${t.group ? `<a class="p-back" href="${tabUrl(t.group)}" data-tab="${t.group}">‹ 設定</a>` : ''}${PANEL[t.id]()}</section>`).join('');
  paintNav(); activate();
}

/* 訂位待確認數：頂欄紅點，每 60 秒更新 */
async function refreshPending(){
  try { const d = await api('/admin/reservations?days=7'); PENDING = d.pending || 0; } catch (e) { PENDING = 0; }
  const b = document.querySelector('#p-nav [data-tab=reservations]'); if (b) b.innerHTML = POSIcon('calendar') + '訂位' + (PENDING ? `<span class="badge">${PENDING}</span>` : '');
}
setInterval(() => { if (DATA) refreshPending(); }, 60000);

/* 未開帳警示：這台平板現在要管的品牌（鎖店別＝店別，否則依時段）今天營業日還沒開帳，就在頂欄上方常駐一條紅色警示，開帳後才消失 */
let REGWARN_SEQ = 0;
function paintRegWarn(d){
  const bar = document.getElementById('p-regwarn');
  const v = d ? (SCOPE || d.active_venue || 'CAFE') : '';
  const r = d?.current?.[v];
  const show = !!(DATA && d && BRAND_LABEL[v] && !(r && !r.closed_at));
  if (!show) { bar.hidden = true; bar.innerHTML = ''; document.body.classList.remove('has-regwarn'); return; }
  const wait = d.wait?.[v] || '';
  const msg = wait ? `${BRAND_LABEL[v]}還沒開帳：${wait}尚未關帳，關帳後才能開帳結帳。` : `${BRAND_LABEL[v]}今天還沒開帳，開帳前不能結帳。`;
  const sig = v + '|' + msg;
  if (bar.dataset.sig !== sig || bar.hidden) {
    bar.dataset.sig = sig;
    bar.innerHTML = `<span>⚠ ${esc(msg)}</span>${wait ? '' : `<button type="button" data-regwarn-open="${esc(v)}">去開帳</button>`}`;
    const b = bar.querySelector('[data-regwarn-open]');
    if (b) b.onclick = () => { SALES_DAY = ''; REG_OPEN_FORM = b.dataset.regwarnOpen; REG_CASH_OPEN = false; REG_CLOSE_OPEN = false; REG_COUNT_OPEN = false; const h = document.getElementById('sales-body'); if (h) delete h.dataset.sig; go('sales'); };
  }
  bar.hidden = false; document.body.classList.add('has-regwarn');
}
async function refreshRegWarn(){
  if (!DATA) return paintRegWarn(null);
  const seq = ++REGWARN_SEQ;
  let d = null; try { d = await api('/admin/registers' + scopeQuery()); } catch (e) { return; } // 抓不到（離線／伺服器忙）就維持原狀，不要閃
  if (seq === REGWARN_SEQ) paintRegWarn(d);
}
setInterval(() => { if (DATA && !document.hidden) refreshRegWarn(); }, 30000);

/* 純瀏覽器（Star webPRNT Browser）：不再是 PWA。清掉舊版已安裝的 service worker 與快取，避免平板吃到舊檔 */
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then(ks => ks.filter(k => /^pos-v/.test(k)).forEach(k => caches.delete(k))).catch(() => {});

/* 離線提示：API 一律要連線，離線時標示並暫停自動更新 */
const net = document.getElementById('p-net');
const paintNet = () => { net.hidden = navigator.onLine; };
addEventListener('online', () => { paintNet(); if (DATA) activate(); }); addEventListener('offline', paintNet); paintNet();

// 平板從待機喚醒：各分頁的自動更新計時器已停，回到前景立刻重新抓一次
document.addEventListener('visibilitychange', () => { if (!document.hidden && DATA) { activate(); refreshPending(); } });

/* 登入續期：token 有效 7 天，剩不到 2 天就在背景換新的，營業中不會突然被登出；換到的 token 失效或被移除管理員時走 401 流程回登入畫面 */
function tokenExp(t){ try { return JSON.parse(atob(t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; } catch (e) { return 0; } }
async function renewToken(){
  if (!token || tokenExp(token) - Date.now() > 2 * 86400e3) return;
  try { const d = await api('/auth/renew', { method:'POST', body:{} }); if (d.token) { token = d.token; localStorage.setItem(KEY, token); } } catch (e) {}
}
setInterval(renewToken, 3600e3);
document.getElementById('p-logout').onclick = () => { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); location.reload(); };

async function main(){
  try { const dv = await api('/pos-devices/' + encodeURIComponent(DEVICE_ID)); DEVICE_BOUND = !!dv.bound; } catch (e) {}
  if (!token) return showLoginScreen();
  try {
    const d = await api('/state');
    if (d.role !== 'admin') return showLoginScreen('此帳號沒有後台權限，請改用在咖啡／三點水的管理員帳號登入。');
    if (d.brands && !d.brands.some(b => BRAND_LABEL[b])) return showLoginScreen('此帳號不是餐飲品牌的管理員（等等空間請用 /admin）。');
    if (justLoggedInByAdmin && !d.me?.operator) {
      // 只有 POS 專用帳號能綁定裝置；綁完立刻登出，裝置只留員工四位數密碼入口（POS 帳號不留在平板上）
      const isPosAccount = String(d.me?.email || '').toLowerCase() === 'pos@emoji.tw';
      api('/admin/pos-devices/bind', { method:'POST', body:{ device_id: DEVICE_ID } }).then(() => { DEVICE_BOUND = true; if (isPosAccount) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); location.reload(); } }).catch(() => {});
    }
    DATA = d;
    MENU_DOC = (typeof d.content?.menu === 'string' && d.content.menu.trim()) ? MenuLib.parseMenuDoc(d.content.menu) : MenuLib.parseMenuDoc('');
    TAB = routeTab();
    if (d.me?.operator) setScope(scopesOf(d)[0] || '');
    render();
    refreshPending();
    songBoot();
    serviceCallBoot();
    posLiveBoot();
    tipBoot();
    renewToken();
  } catch(e){
    if (e.status === 401) return;   // api() 已轉到登入畫面
    app.innerHTML = `<p class="p-center">暫時無法連線：${esc(e.message)}<br><button class="btn btn--ghost btn-sm" style="margin-top:1rem" onclick="location.reload()">重新整理</button></p>`;
  }
}
main();
</script>
</body>
</html>
