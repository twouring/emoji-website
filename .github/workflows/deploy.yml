name: Deploy to Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cloudrun-emoji-website
  cancel-in-progress: false
env:
  PROJECT_ID: emoji0701
  REGION: asia-east1
  SERVICE: emoji-website
  # 後台獨立服務（admin.emoji.tw）：同一個 image，服務上設 SERVICE_ROLE=admin；環境變數沿用既有 revision
  ADMIN_SERVICE: emoji-admin
  IMAGE: asia-east1-docker.pkg.dev/emoji0701/emoji/emoji-website
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm test
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      # 版本號＝台北日期＋當日 main 的第 N 次提交（流水號）
      - name: Write VERSION
        run: |
          D=$(TZ=Asia/Taipei date +%Y%m%d)
          N=$(git rev-list --count --since="$(TZ=Asia/Taipei date +%Y-%m-%d) 00:00 +0800" HEAD)
          printf '%s-%02d' "$D" "$N" > VERSION
          cat VERSION
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/609447194815/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@emoji0701.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet
      # github.sha is a trusted 40-hex value, safe to interpolate
      - name: Build and push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:${{ github.sha }}" --region "$REGION" --project "$PROJECT_ID" --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
          gcloud run deploy "$ADMIN_SERVICE" --image "$IMAGE:${{ github.sha }}" --region "$REGION" --project "$PROJECT_ID" --quiet
          gcloud run services describe "$ADMIN_SERVICE" --region "$REGION" --format='value(status.url)'
